<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563eb" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    
    <!-- Glow Effect -->
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Glow Effects -->
  <circle cx="300" cy="200" r="400" fill="url(#glow)" opacity="0.3"/>
  <circle cx="1620" cy="880" r="500" fill="url(#glow)" opacity="0.2"/>
  
  <!-- Main Content Area -->
  <g transform="translate(960, 540)">
    <!-- Tradelia Logo -->
    <text x="0" y="-100" font-family="Inter, sans-serif" font-size="120" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">
      TRADELIA
    </text>
    
    <!-- AI Badge -->
    <circle cx="280" cy="-180" r="50" fill="#2563eb"/>
    <text x="280" y="-165" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">
      AI
    </text>
    
    <!-- Tagline -->
    <text x="0" y="20" font-family="Inter, sans-serif" font-size="48" font-weight="600" fill="#94a3b8" text-anchor="middle">
      Trading Intelligence Powered by AI
    </text>
    
    <!-- Accent Line -->
    <line x1="-200" y1="80" x2="200" y2="80" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="80" r="6" fill="#2563eb"/>
  </g>
  
  <!-- Decorative Elements -->
  <g opacity="0.1">
    <circle cx="200" cy="300" r="100" fill="#2563eb"/>
    <circle cx="1720" cy="780" r="150" fill="#2563eb"/>
    <rect x="100" y="800" width="200" height="200" rx="20" fill="#2563eb" transform="rotate(45 200 900)"/>
  </g>
</svg>

