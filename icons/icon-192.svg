<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="icon192Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="icon192Glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#icon192Gradient)" />
  <rect width="192" height="192" rx="40" fill="url(#icon192Glow)" />
  
  <!-- T letter (centered) -->
  <g transform="translate(96, 96)">
    <!-- Main T -->
    <rect x="-28" y="-48" width="56" height="12" rx="3" fill="#ffffff" />
    <rect x="-8" y="-36" width="16" height="60" rx="3" fill="#ffffff" />
    
    <!-- Data visualization elements -->
    <g opacity="0.9">
      <circle cx="-50" cy="-20" r="8" fill="#ffffff" />
      <circle cx="0" cy="-10" r="7" fill="#ffffff" />
      <circle cx="50" cy="-30" r="7" fill="#ffffff" />
      <circle cx="-40" cy="15" r="6" fill="#ffffff" />
      <circle cx="40" cy="20" r="6" fill="#ffffff" />
      
      <!-- Network lines -->
      <line x1="-50" y1="-20" x2="0" y2="-10" stroke="#ffffff" stroke-width="2.5" opacity="0.5" />
      <line x1="0" y1="-10" x2="50" y2="-30" stroke="#ffffff" stroke-width="2.5" opacity="0.5" />
      <line x1="-40" y1="15" x2="40" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.5" />
    </g>
  </g>
</svg>
