<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="icon512Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="icon512Glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#icon512Gradient)" />
  <rect width="512" height="512" rx="110" fill="url(#icon512Glow)" />
  
  <!-- T letter (centered, larger) -->
  <g transform="translate(256, 256)">
    <!-- Main T -->
    <rect x="-72" y="-120" width="144" height="28" rx="6" fill="#ffffff" />
    <rect x="-20" y="-92" width="40" height="152" rx="6" fill="#ffffff" />
    
    <!-- Enhanced data visualization elements -->
    <g opacity="0.9">
      <circle cx="-130" cy="-50" r="20" fill="#ffffff" />
      <circle cx="0" cy="-25" r="18" fill="#ffffff" />
      <circle cx="130" cy="-75" r="18" fill="#ffffff" />
      <circle cx="-100" cy="40" r="16" fill="#ffffff" />
      <circle cx="100" cy="50" r="16" fill="#ffffff" />
      <circle cx="-60" cy="90" r="12" fill="#ffffff" opacity="0.8" />
      <circle cx="60" cy="100" r="12" fill="#ffffff" opacity="0.8" />
      
      <!-- Network lines (more detailed) -->
      <line x1="-130" y1="-50" x2="0" y2="-25" stroke="#ffffff" stroke-width="6" opacity="0.5" />
      <line x1="0" y1="-25" x2="130" y2="-75" stroke="#ffffff" stroke-width="6" opacity="0.5" />
      <line x1="-100" y1="40" x2="100" y2="50" stroke="#ffffff" stroke-width="6" opacity="0.5" />
      <line x1="-60" y1="90" x2="60" y2="100" stroke="#ffffff" stroke-width="4" opacity="0.4" />
    </g>
  </g>
</svg>
