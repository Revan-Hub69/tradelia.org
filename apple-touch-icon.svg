<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="appleGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background (iOS requires no transparency) -->
  <rect width="180" height="180" rx="40" fill="url(#appleGradient)" />
  <rect width="180" height="180" rx="40" fill="url(#appleGlow)" />
  
  <!-- T letter (centered) -->
  <g transform="translate(90, 90)">
    <!-- Main T -->
    <rect x="-26" y="-44" width="52" height="11" rx="3" fill="#ffffff" />
    <rect x="-7" y="-33" width="14" height="55" rx="3" fill="#ffffff" />
    
    <!-- Data visualization elements -->
    <g opacity="0.9">
      <circle cx="-46" cy="-18" r="7" fill="#ffffff" />
      <circle cx="0" cy="-9" r="6" fill="#ffffff" />
      <circle cx="46" cy="-27" r="6" fill="#ffffff" />
      <circle cx="-37" cy="14" r="5" fill="#ffffff" />
      <circle cx="37" cy="18" r="5" fill="#ffffff" />
      
      <!-- Network lines -->
      <line x1="-46" y1="-18" x2="0" y2="-9" stroke="#ffffff" stroke-width="2" opacity="0.5" />
      <line x1="0" y1="-9" x2="46" y2="-27" stroke="#ffffff" stroke-width="2" opacity="0.5" />
      <line x1="-37" y1="14" x2="37" y2="18" stroke="#ffffff" stroke-width="2" opacity="0.5" />
    </g>
  </g>
</svg>
