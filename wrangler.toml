# Cloudflare Pages/Workers Configuration
# Compatible with both Vercel and Cloudflare

name = "tradelia"
compatibility_date = "2024-01-01"

[env.production]
name = "tradelia-production"

[env.staging]
name = "tradelia-staging"

# Pages Functions configuration
# Functions are in /functions directory
# Routes are automatically mapped from /functions/api/*.js to /api/*

# Environment variables (set in Cloudflare Dashboard)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# FIREBASE_SERVICE_ACCOUNT
# etc.

# Build configuration
[build]
command = "npm run build"
cwd = "."

# Pages output directory
pages_build_output_dir = "dist"

# Note: firebase-admin is loaded dynamically and excluded from bundle
# See api/notifications.js for implementation details
