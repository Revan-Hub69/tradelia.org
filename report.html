<!-- /report.html -->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tradelia · Report Runtime</title>
  <link rel="icon" href="./favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/report.css" />
</head>
  <script type="module">
  // Verifica ES modules essenziali (stampa overlay se 404 o export errato)
  const must = [
    './assets/js/components/header.js',
    './assets/js/components/helpx.js',
    './assets/js/components/share.js',
    './assets/js/components/drawer.js',
    './assets/js/modules/headerTicker.js',
    './assets/js/modules/f1b.js',
    './assets/js/modules/f2.js',
    './assets/js/utils/qs.js',
    './assets/js/utils/tone.js',
    './assets/js/utils/stateBadge.js'
  ];
  for (const p of must) {
    try {
      const m = await import(p);
      // opzionale: controlla simboli chiave se servono
      // es: if (p.endsWith('header.js') && !m.initHeader) throw new Error('initHeader mancante');
    } catch (e) {
      throw new Error(`Import fallito: ${p}\n${e?.message||e}`);
    }
  }
  // Se arrivi qui, i path sono OK
  console.log('Preflight OK: tutti i moduli importabili');
</script>

<body class="text-gray-900 bg-slate-100">
  <!-- HEADER -->
  <header id="app-header" class="hdr sticky top-0 z-50 bg-white/90 border-b border-slate-200 noprint"></header>

  <!-- HEADER TICKER -->
  <main class="max-w-7xl mx-auto px-3 sm:px-5 py-3">
    <section id="header-ticker" class="mb-2" aria-label="Header Ticker (pills)"></section>
  </main>

  <!-- MODULI -->
  <section id="moduli" class="pt-3">
    <div class="max-w-7xl mx-auto px-3 sm:px-5">
      <div class="flex items-end justify-between mb-3 sm:mb-4">
        <div class="min-w-0">
          <h2 class="text-base sm:text-lg font-semibold text-slate-800 tracking-tight">Moduli analitici</h2>
          <p class="text-xs text-slate-500">Framework F1–F5 · schede auditabili</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="view-grid" class="btn" aria-pressed="true"><i data-lucide="grid"></i><span class="hidden sm:inline">Griglia</span></button>
          <button id="view-list" class="btn" aria-pressed="false"><i data-lucide="list"></i><span class="hidden sm:inline">Lista</span></button>
        </div>
      </div>
      <div id="mod-container" data-view="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-1.5 sm:gap-2 lg:gap-3" aria-label="Griglia moduli analitici"></div>
    </div>
  </section>

  <!-- DRAWER (side / bottom-sheet) -->
  <div id="mod-drawer" class="fixed inset-0 z-[60] hidden">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-[1px]" data-close="backdrop"></div>
    <aside class="absolute right-0 top-0 h-full w-[92%] sm:w-[560px] translate-x-full will-change-transform transition-transform duration-200 ease-out bg-white border-l border-slate-200">
      <header class="h-12 sm:h-14 border-b border-slate-200 flex items-center justify-between px-3 sm:px-4 bg-white/95 backdrop-blur">
        <div class="min-w-0">
          <div id="drawer-title" class="font-semibold text-slate-800 truncate">Modulo</div>
          <div id="drawer-sub" class="text-xs text-slate-500 truncate">—</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="drawer-print" class="btn" aria-label="Stampa sezione"><i data-lucide="printer"></i></button>
          <button id="drawer-close" class="btn" aria-label="Chiudi"><i data-lucide="x"></i></button>
        </div>
      </header>
      <div id="drawer-body" class="h-[calc(100%-3.25rem)] sm:h-[calc(100%-3.75rem)] overflow-auto p-3 sm:p-4 bg-slate-50/40"></div>
    </aside>
  </div>

  <!-- App -->
  <script type="module">
    import { initHeader }       from './assets/js/components/header.js';
    import { initHelpX }        from './assets/js/components/helpx.js';
    import { initShare }        from './assets/js/components/share.js';
    import { initDrawerAPI }    from './assets/js/components/drawer.js';
    import { initHeaderTicker } from './assets/js/modules/headerTicker.js';
    import { mountF1B }         from './assets/js/modules/f1b.js';
    import { mountF2 }         from './assets/js/modules/f2.js';
    import { getDataURL }       from './assets/js/utils/qs.js';

    // Boot
    lucide.createIcons();
    initDrawerAPI();
    initHeader();    // stampa + condividi
    initHelpX();     // dizionario “?”
    initShare();     // API share.open(...)

    // Layout controls
    const cont = document.getElementById('mod-container');
    document.getElementById('view-grid')?.addEventListener('click', (e)=>{
      cont.dataset.view='grid'; e.currentTarget.setAttribute('aria-pressed','true');
      document.getElementById('view-list').setAttribute('aria-pressed','false');
      cont.className='grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-1.5 sm:gap-2 lg:gap-3';
    });
    document.getElementById('view-list')?.addEventListener('click', (e)=>{
      cont.dataset.view='list'; e.currentTarget.setAttribute('aria-pressed','true');
      document.getElementById('view-grid').setAttribute('aria-pressed','false');
      cont.className='space-y-1.5';
    });

    // Data load
    async function loadReport() {
      const url = getDataURL();
      const res = await fetch(url, { cache:'no-store' });
      if (!res.ok) throw new Error('Fetch JSON: ' + res.status);
      const data = await res.json();

      // Header ticker
      initHeaderTicker(data?.Header || {});
      // Moduli
      const apiF1B = mountF1B(); apiF1B.update(data?.F1B || {});
      const apiF2  = mountF2();  apiF2.update(data?.F2  || {});
    }

    loadReport().catch(err=>{
      console.error(err);
      document.getElementById('header-ticker').innerHTML =
        `<div class="text-sm text-red-700 bg-red-50 border border-red-200 p-2 rounded">Errore caricamento dati: ${err.message}</div>`;
    });
  </script>
</body>
</html>
