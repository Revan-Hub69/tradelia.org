  <script type="module">
    import Logger from '/report/assets/js/utils/logger.js';
    import { registerOverlay, unregisterOverlay, OVERLAY_TYPES } from '/report/assets/js/utils/overlay-manager.js';
    
    // ===== STATE =====
    let glossaryData = {};
    let allTerms = [];
    let filteredTerms = [];
    let activeFilter = 'all';
    let searchQuery = '';
    const OVERLAY_ID = 'glossary-popup';
    
    // ===== MAPPATURA TAG =====
    // Funzione per assegnare tag in base al contenuto/nome della metrica
    function assignTag(key, term) {
      // Supporta sia formato nuovo che vecchio
      const title = (term.nomeTecnico || term.title || key).toLowerCase();
      const what = (term.definizioneAccademica || term.what || '').toLowerCase();
      const how = (term.spiegazioneAI || term.how || '').toLowerCase();
      const universo = (term.universo || '').toLowerCase();
      const content = `${key} ${title} ${what} ${how} ${universo}`.toLowerCase();
      
      // Regole specifiche per chiavi che iniziano con pattern noti (più precise)
      const keyUpper = key.toUpperCase();
      
      // Trading: opzioni, volatilità, greche, dealer, flow
      if (key.startsWith('F3O_') || keyUpper.includes('_IV_') || keyUpper.includes('GAMMA') || 
          keyUpper.includes('VEGA') || keyUpper.includes('DELTA') || keyUpper.includes('DEALER') || 
          keyUpper.includes('MAXPAIN') || keyUpper.includes('GAMMAFLIP') || keyUpper.includes('FLOWNET') ||
          keyUpper.includes('TOPPRINTS') || keyUpper.includes('PCR_') || keyUpper.includes('RR25') ||
          keyUpper.includes('TERMSLOPE') || keyUpper.includes('GSR') || keyUpper.includes('EM_TOGGLE')) {
        return 'Trading';
      }
      
      // Investimenti: valuation, earnings, margins, profitability, peer, consensus
      if (keyUpper.includes('VALUATION') || keyUpper.includes('EARNINGS') || keyUpper.includes('MARGINS') || 
          keyUpper.includes('PROFITABILITY') || keyUpper.includes('BALANCE_SHEET') || keyUpper.includes('CASHFLOW') ||
          keyUpper.includes('PEER_') || keyUpper.includes('CONSENSUS') || keyUpper.includes('TARGET_') ||
          keyUpper.includes('UPSIDE') || keyUpper.includes('EVENT_LAST_EARNINGS') || keyUpper.startsWith('VAL_') ||
          keyUpper.includes('MARGIN_HEALTH') || keyUpper.includes('EARNINGS_REV') || keyUpper.includes('QUALITY_BS')) {
        return 'Investimenti';
      }
      
      // Finanza base: credit, curva, FX, regime, macro, governance
      if (key.includes('Credit') || key.includes('Curva') || key.includes('FX_') || 
          key.includes('VolRegime') || key.includes('LiquidityRegime') || key.includes('MacroGate') ||
          key.includes('ModuleStatus') || key.includes('Freshness') || key.includes('Governance') ||
          key.includes('Compliance') || key.includes('MiFID') || key.includes('Educational') ||
          key.includes('HeroDisclaimer') || key === 'Snapshot' || key === 'Currency' ||
          key === 'Start' || key === 'End' || key === 'UpdatedAt' || key === 'Version' || key === 'State' ||
          key.includes('Treasury') || key.includes('Futures') || key.includes('Commodities')) {
        return 'Finanza base';
      }
      
      // Keyword per Trading (peso maggiore)
      const tradingKeywords = [
        'trading', 'trader', 'momentum', 'volatilità', 'volatility', 'vix', 'gamma', 'vega', 'delta',
        'opzioni', 'options', 'futures', 'cfd', 'scalping', 'breakout', 'resistance', 'support',
        'rsi', 'macd', 'bollinger', 'stochastic', 'indicatori tecnici', 'pattern', 'chart', 'candlestick',
        'short', 'long', 'leverage', 'leva', 'stop loss', 'take profit', 'position sizing',
        'regime score', 'risk-on', 'risk-off', 'breadth', 'sentiment', 'flow', 'dealer', 'gamma flip',
        'strategy mode', 'index momentum', 'risk tilt', 'smallcap pressure', 'size bias',
        'leadership', 'defensive leadership', 'lagging', 'stress microcap', 'finviz query',
        'tech signal', 'news tone', 'perf vector', 'price trend', 'iv rank', 'gsr', 'term slope',
        'rr25', 'pcr', 'put/call', 'delta imbalance', 'expected move'
      ];
      
      // Keyword per Investimenti (peso maggiore)
      const investimentiKeywords = [
        'investimenti', 'investment', 'portafoglio', 'portfolio', 'asset allocation', 'diversificazione',
        'etf', 'fondi', 'mutual fund', 'rebalancing', 'dividend', 'dividendi', 'yield', 'rendimento',
        'valuation', 'valutazione', 'pe', 'p/e', 'ev/ebitda', 'pb', 'p/b', 'roe', 'roic', 'roa',
        'earnings', 'utili', 'eps', 'revenue', 'ricavi', 'margini', 'margins', 'cash flow',
        'balance sheet', 'bilancio', 'debt', 'debito', 'equity', 'patrimonio', 'fundamental',
        'analisi fondamentale', 'consensus', 'analisti', 'target price', 'upside', 'downside',
        'profitability', 'redditività', 'margini', 'flussi di cassa', 'fcf', 'free cash flow',
        'revisions', 'consistency', 'stability', 'peer', 'sector breadth', 'etf flow', 'top holding',
        'si level', 'short float', 'dtc', 'days to cover', 'inst flow', 'insider flow'
      ];
      
      // Keyword per Finanza base
      const finanzaBaseKeywords = [
        'credito', 'credit', 'spread', 'curva', 'curve', 'tasso', 'rate', 'interest', 'tassi',
        'monetaria', 'monetary', 'politica', 'policy', 'macro', 'macroeconomia', 'pil', 'gdp',
        'inflazione', 'inflation', 'cpi', 'ppi', 'employment', 'occupazione', 'unemployment',
        'disclaimer', 'governance', 'compliance', 'mifid', 'esma', 'freshness', 'confidence',
        'integrity', 'version', 'module', 'status', 'snapshot', 'data', 'feed', 'source',
        'freshness score', 'confidence final', 'data integrity', 'feedsync', 'audit path',
        'module version', 'policy', 'educational scope', 'sources tier', 'company name',
        'ticker', 'venue', 'isin', 'sector', 'start', 'end', 'updated at', 'state'
      ];
      
      // Conta match per ogni categoria (con peso)
      let tradingScore = tradingKeywords.filter(kw => content.includes(kw)).length * 2;
      let investimentiScore = investimentiKeywords.filter(kw => content.includes(kw)).length * 2;
      let finanzaBaseScore = finanzaBaseKeywords.filter(kw => content.includes(kw)).length;
      
      // Bonus per pattern nel titolo
      if (title.includes('trading') || title.includes('trader') || title.includes('opzioni') || 
          title.includes('volatilità') || title.includes('gamma') || title.includes('momentum')) {
        tradingScore += 3;
      }
      
      if (title.includes('valuation') || title.includes('earnings') || title.includes('investimento') ||
          title.includes('portafoglio') || title.includes('etf') || title.includes('fondi')) {
        investimentiScore += 3;
      }
      
      if (title.includes('credito') || title.includes('curva') || title.includes('tasso') ||
          title.includes('macro') || title.includes('politica') || title.includes('governance')) {
        finanzaBaseScore += 3;
      }
      
      // Assegna tag in base al punteggio più alto
      if (tradingScore > investimentiScore && tradingScore > finanzaBaseScore) {
        return 'Trading';
      } else if (investimentiScore > finanzaBaseScore) {
        return 'Investimenti';
      } else {
        return 'Finanza base';
      }
    }
    
    // ===== CARICAMENTO HEADER & FOOTER =====
    async function mountHeaderFooter() {
      document.documentElement.setAttribute('data-theme', 'dark');
      
      try {
        const headerSlot = document.getElementById('site-header-slot');
        if (headerSlot) {
          const { siteHeader } = await import('/report/assets/js/components/site-header.js');
          if (siteHeader?.mount) {
            siteHeader.mount(headerSlot);
            Logger.debug('Glossario', 'Header montato');
          }
        }
        
        const footerSlot = document.getElementById('site-footer-slot');
        if (footerSlot) {
          const { siteFooter } = await import('/report/assets/js/components/site-footer.js');
          if (siteFooter?.mount) {
            siteFooter.mount(footerSlot);
            Logger.debug('Glossario', 'Footer montato');
          }
        }
      } catch (err) {
        Logger.warn('Glossario', 'Errore montaggio header/footer', err);
      }
    }
    
    // ===== CARICAMENTO GLOSSARIO =====
    async function loadGlossary() {
      try {
        let res = await fetch('/glossario.json', { cache: 'no-store' });
        
        if (!res.ok) {
          Logger.warn('Glossario', 'Nuovo JSON non trovato, uso fallback');
          res = await fetch('/report/assets/glossary.json', { cache: 'no-store' });
        }
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        // Rimuovi metadati (_v)
        const { _v, ...terms } = data;
        glossaryData = terms;
        
        // Crea array di termini con tag assegnati e ordina alfabeticamente
        allTerms = Object.entries(terms).map(([key, term]) => {
          // Supporta sia formato nuovo (nomeTecnico) che vecchio (title)
          const title = term.nomeTecnico || term.title || key;
          const tag = assignTag(key, term);
          return {
            key,
            title,
            term,
            tag
          };
        }).sort((a, b) => a.title.localeCompare(b.title, 'it', { sensitivity: 'base' }));
        
        filteredTerms = [...allTerms];
        
        Logger.debug('Glossario', `Glossario caricato: ${allTerms.length} termini`);
        
        renderTerms();
        updateStats();
        setupFilters();
      } catch (err) {
        Logger.error('Glossario', 'Errore caricamento glossario', err);
        document.getElementById('terms-container').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">Errore di caricamento</div>
            <div class="empty-state-text">Impossibile caricare il glossario. Riprova più tardi.</div>
          </div>
        `;
      }
    }
    
    // ===== FILTRI =====
    function setupFilters() {
      const filterButtons = document.querySelectorAll('.category-filter-btn');
      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          filterButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterTerms();
        });
      });
    }
    
    // ===== FILTRO E RICERCA =====
    function filterTerms() {
      searchQuery = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      
      filteredTerms = allTerms.filter(({ key, title, term, tag }) => {
        // Filtro per tag
        if (activeFilter !== 'all' && tag !== activeFilter) {
          return false;
        }
        
        // Ricerca (cerca anche nel contenuto del drawer)
        if (searchQuery) {
          const searchableText = [
            key.toLowerCase(),
            title.toLowerCase(),
            (term.nomeTecnico || '').toLowerCase(),
            (term.what || term.definizioneAccademica || '').toLowerCase(),
            (term.how || term.spiegazioneAI || '').toLowerCase(),
            (term.source || term.fonteAccademica || '').toLowerCase()
          ].join(' ');
          
          if (!searchableText.includes(searchQuery)) {
            return false;
          }
        }
        
        return true;
      });
      
      renderTerms();
      updateStats();
    }
    
    // ===== RENDERING MINI SCHEDE =====
    function renderTerms() {
      const container = document.getElementById('terms-container');
      
      if (filteredTerms.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-title">Nessun termine trovato</div>
            <div class="empty-state-text">Prova a cercare con altre parole chiave o seleziona un filtro diverso.</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = filteredTerms.map(({ key, title, tag }) => {
        const tagClass = tag.toLowerCase().replace(' ', '-');
        return `
          <div class="term-card" data-key="${escapeHtml(key)}">
            <h3 class="term-card-title">${escapeHtml(title)}</h3>
            <span class="term-card-tag term-card-tag--${tagClass}">${escapeHtml(tag)}</span>
          </div>
        `;
      }).join('');
      
      // Event listeners per click
      container.querySelectorAll('.term-card').forEach(card => {
        card.addEventListener('click', () => {
          const key = card.dataset.key;
          openTermDrawer(key);
        });
      });
    }
    
    // ===== DRAWER TERMINE =====
    function openTermDrawer(key) {
      const item = allTerms.find(t => t.key === key);
      if (!item) return;
      
      const { term, title, tag } = item;
      const overlay = document.getElementById('glossary-popup-overlay');
      const panel = overlay.querySelector('.glossary-popup-panel');
      
      // Supporta sia formato nuovo che vecchio
      const nomeTecnico = term.nomeTecnico || term.title || title;
      const universo = term.universo || tag;
      const difficolta = term.difficolta || '';
      
      // Supporta sia formato nuovo (definizioneAccademica/spiegazioneAI) che vecchio (what/how)
      const definizioneAccademica = term.definizioneAccademica || term.what || '';
      const spiegazioneAI = term.spiegazioneAI || term.how || '';
      const fonteAccademica = term.fonteAccademica || term.source || '';
      
      const tagClass = tag.toLowerCase().replace(' ', '-');
      
      // HTML identico a quello dei report
      panel.innerHTML = `
        <header class="glossary-popup-header">
          <div class="glossary-popup-header-content">
            <h2 id="glossary-popup-title" class="glossary-popup-title">${escapeHtml(nomeTecnico)}</h2>
            <div class="glossary-popup-badges">
              ${universo ? `
                <span class="glossary-popup-badge glossary-popup-tag glossary-popup-tag--${tagClass}">${escapeHtml(universo)}</span>
              ` : ''}
              ${difficolta ? `
                <span class="glossary-popup-badge glossary-popup-badge--difficolta ${difficolta.toLowerCase()}">${escapeHtml(difficolta)}</span>
              ` : ''}
            </div>
          </div>
          <button class="glossary-popup-close" aria-label="Chiudi" type="button">×</button>
        </header>
        <div class="glossary-popup-body">
          ${definizioneAccademica ? `
            <div class="glossary-popup-section">
              <h3 class="glossary-popup-section-title">Definizione Accademica</h3>
              <p class="glossary-popup-section-text">${escapeHtml(definizioneAccademica)}</p>
            </div>
          ` : ''}
          
          ${spiegazioneAI ? `
            <div class="glossary-popup-section">
              <h3 class="glossary-popup-section-title">Spiegazione AI</h3>
              <p class="glossary-popup-section-text">${escapeHtml(spiegazioneAI)}</p>
            </div>
          ` : ''}
          
          ${fonteAccademica ? `
            <div class="glossary-popup-section">
              <h3 class="glossary-popup-section-title">Fonte</h3>
              <p class="glossary-popup-section-text glossary-popup-source">${escapeHtml(fonteAccademica)}</p>
            </div>
          ` : ''}
          
          ${!definizioneAccademica && !spiegazioneAI && !fonteAccademica ? `
            <div class="glossary-popup-section">
              <p class="glossary-popup-section-text">Nessuna informazione disponibile nel glossario per questo termine.</p>
            </div>
          ` : ''}
        </div>
        <footer class="glossary-popup-footer">
          <button class="glossary-popup-close-bottom" type="button">Chiudi</button>
        </footer>
      `;
      
      // Close handlers (stesso sistema dei report)
      const closeBtn = panel.querySelector('.glossary-popup-close');
      const closeBtnBottom = panel.querySelector('.glossary-popup-close-bottom');
      
      if (closeBtn) {
        closeBtn.addEventListener('click', () => closeTermDrawer());
      }
      if (closeBtnBottom) {
        closeBtnBottom.addEventListener('click', () => closeTermDrawer());
      }
      
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeTermDrawer();
      });
      
      // Listener per close request dall'overlay manager (ESC key)
      overlay.addEventListener('overlay-close-request', (e) => {
        if (e.detail.id === OVERLAY_ID) {
          closeTermDrawer();
        }
      });
      
      // Apri drawer (stesso sistema dei report)
      overlay.hidden = false;
      // NOTA: overflow gestito da overlay-manager.js (non impostare qui)
      
      // Registra overlay nello stack (gestisce z-index e overflow)
      registerOverlay(OVERLAY_ID, OVERLAY_TYPES.GLOSSARY, overlay, panel);
      
      Logger.debug('Glossario', `Drawer aperto per termine: ${key}`);
    }
    
    function closeTermDrawer() {
      const overlay = document.getElementById('glossary-popup-overlay');
      if (!overlay || overlay.hidden) return;
      
      overlay.hidden = true;
      // NOTA: overflow gestito da overlay-manager.js (non impostare qui)
      
      // Rimuovi overlay dallo stack (gestisce anche overflow)
      unregisterOverlay(OVERLAY_ID);
      
      Logger.debug('Glossario', 'Drawer chiuso');
    }
    
    // ===== STATS =====
    function updateStats() {
      const statsEl = document.getElementById('stats-text');
      if (!statsEl) return;
      
      const total = allTerms.length;
      const showing = filteredTerms.length;
      
      if (showing === total) {
        statsEl.textContent = `${total} termini totali`;
      } else {
        statsEl.textContent = `Mostrando ${showing} di ${total} termini`;
      }
    }
    
    // ===== UTILITIES =====
    function escapeHtml(str) {
      if (str == null) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }
    
    // ===== EVENT LISTENERS =====
    document.getElementById('search-input')?.addEventListener('input', () => {
      filterTerms();
    });
    
    // ===== INIZIALIZZAZIONE =====
    async function init() {
      await mountHeaderFooter();
      await loadGlossary();
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
