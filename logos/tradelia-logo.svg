<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon/Mark - Larger and more visible -->
  <g transform="translate(0, 8)">
    <!-- T letter - Larger and clearer -->
    <rect x="4" y="0" width="24" height="6" rx="2" fill="url(#logoGradient)" />
    <rect x="12" y="6" width="8" height="28" rx="2" fill="url(#logoGradient)" />
    
    <!-- Data visualization elements - More visible -->
    <circle cx="36" cy="20" r="4" fill="url(#logoGradient)" opacity="0.9" />
    <circle cx="44" cy="12" r="3.5" fill="url(#logoGradient)" opacity="0.8" />
    <circle cx="52" cy="24" r="3.5" fill="url(#logoGradient)" opacity="0.85" />
    
    <!-- Connecting lines - More visible -->
    <line x1="36" y1="20" x2="44" y2="12" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.6" />
    <line x1="44" y1="12" x2="52" y2="24" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.6" />
  </g>
  
  <!-- Text - Better spacing and visibility -->
  <g transform="translate(62, 8)">
    <!-- Tradelia -->
    <text x="0" y="24" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.6">
      Tradelia
    </text>
    <!-- AI badge - Larger and more visible -->
    <rect x="108" y="8" width="32" height="18" rx="4" fill="url(#logoGradientDark)" />
    <text x="114" y="21" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.8">
      AI
    </text>
  </g>
</svg>
