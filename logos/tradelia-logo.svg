<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <!-- Gradient professionale -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <!-- Glow subtle per profondità -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon/Mark - T come elemento decorativo/iconico -->
  <g transform="translate(0, 12)" filter="url(#softGlow)">
    <!-- T letter - Design geometrico moderno come icona -->
    <rect x="0" y="0" width="28" height="4.5" rx="2.5" fill="url(#logoGradient)" />
    <rect x="12" y="4.5" width="4" height="26" rx="2" fill="url(#logoGradient)" />
  </g>
  
  <!-- Text - Tradelia completo per chiarezza -->
  <g transform="translate(38, 12)">
    <!-- Tradelia - Parola completa, chiaramente leggibile -->
    <text x="0" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="-0.4">
      Tradelia
    </text>
    <!-- AI - Posizionato come superscript (tipo ™ o ®) in alto a destra -->
    <text x="120" y="18" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#60a5fa" letter-spacing="1">
      AI
    </text>
  </g>
</svg>
