<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <!-- Gradient professionale -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <!-- Glow subtle per profondità -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon/Mark - T innovativa con design moderno -->
  <!-- Basato su principi: Simplicity, Memorability, Scalability (Aaker 1991, Keller 1993) -->
  <g transform="translate(0, 12)" filter="url(#softGlow)">
    <!-- T letter - Design geometrico moderno con angoli leggermente arrotondati -->
    <!-- Proporzioni auree approssimate per equilibrio visivo -->
    <rect x="0" y="0" width="32" height="5" rx="2.5" fill="url(#logoGradient)" />
    <rect x="13.5" y="5" width="5" height="28" rx="2.5" fill="url(#logoGradient)" />
    
    <!-- Elemento decorativo minimale - suggerisce analisi/dati -->
    <!-- Basato su principio "Less is More" (Mies van der Rohe) -->
    <circle cx="38" cy="20" r="2" fill="url(#logoGradient)" opacity="0.6" />
  </g>
  
  <!-- Text - Tipografia professionale senza ripetere T -->
  <!-- Basato su: Legibility Hierarchy (Bringhurst 2004), Type Design Principles -->
  <g transform="translate(48, 12)">
    <text x="0" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="-0.4">
      radelia
    </text>
    <text x="110" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#60a5fa" letter-spacing="1.5">
      AI
    </text>
  </g>
</svg>
