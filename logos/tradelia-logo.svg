<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon/Mark -->
  <g transform="translate(0, 10)">
    <!-- T letter with modern geometric design -->
    <path d="M 12 0 L 12 8 L 8 8 L 8 20 L 16 20 L 16 8 L 12 8 Z" fill="url(#logoGradient)" />
    <!-- Abstract data visualization element (representing AI/analytics) -->
    <circle cx="20" cy="14" r="2" fill="url(#logoGradient)" opacity="0.8" />
    <circle cx="24" cy="10" r="1.5" fill="url(#logoGradient)" opacity="0.6" />
    <circle cx="28" cy="16" r="1.5" fill="url(#logoGradient)" opacity="0.7" />
    <!-- Connecting lines (network/data flow) -->
    <line x1="20" y1="14" x2="24" y2="10" stroke="url(#logoGradient)" stroke-width="0.5" opacity="0.4" />
    <line x1="24" y1="10" x2="28" y2="16" stroke="url(#logoGradient)" stroke-width="0.5" opacity="0.4" />
  </g>
  
  <!-- Text -->
  <g transform="translate(38, 8)">
    <!-- Tradelia -->
    <text x="0" y="20" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
      Tradelia
    </text>
    <!-- AI badge -->
    <rect x="88" y="6" width="24" height="14" rx="3" fill="url(#logoGradientDark)" />
    <text x="92" y="17" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      AI
    </text>
  </g>
</svg>
