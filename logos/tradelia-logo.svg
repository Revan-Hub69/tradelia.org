<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon/Mark - Design pulito e moderno -->
  <g transform="translate(0, 15)">
    <!-- T letter - Design geometrico pulito -->
    <rect x="0" y="0" width="28" height="6" rx="3" fill="url(#logoGradient)" />
    <rect x="11" y="6" width="6" height="24" rx="3" fill="url(#logoGradient)" />
  </g>
  
  <!-- Text - Tipografia classica e professionale -->
  <g transform="translate(42, 15)">
    <text x="0" y="28" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
      Tradelia
    </text>
    <text x="118" y="28" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#60a5fa" letter-spacing="2">
      AI
    </text>
  </g>
</svg>
