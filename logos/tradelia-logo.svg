<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient per T split: metà grigia, metà blu -->
    <linearGradient id="tSplitGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- APPROCCIO 3: LETTERMARK con T split color -->
  <g transform="translate(0, 12)">
    <!-- T iniziale - metà grigia, metà blu, più vicina al testo -->
    <text x="0" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="url(#tSplitGradient)" letter-spacing="-0.3">
      T
    </text>
    <!-- Resto della parola normale, più vicino alla T -->
    <text x="24" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#ffffff" letter-spacing="-0.5">
      radelia
    </text>
    <!-- AI superscript -->
    <text x="140" y="20" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#60a5fa" letter-spacing="1.5">
      AI
    </text>
  </g>
</svg>
