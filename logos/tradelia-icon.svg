<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#iconGradient)" />
  <circle cx="256" cy="256" r="240" fill="url(#iconGlow)" />
  
  <!-- T letter (centered and larger) -->
  <g transform="translate(256, 256)">
    <!-- Main T shape -->
    <rect x="-24" y="-80" width="48" height="16" rx="4" fill="#ffffff" />
    <rect x="-8" y="-64" width="16" height="96" rx="4" fill="#ffffff" />
    
    <!-- Data visualization elements (AI/analytics representation) -->
    <g opacity="0.9">
      <circle cx="-40" cy="-40" r="6" fill="#ffffff" />
      <circle cx="0" cy="-20" r="5" fill="#ffffff" />
      <circle cx="40" cy="-50" r="5" fill="#ffffff" />
      <circle cx="-30" cy="20" r="4" fill="#ffffff" />
      <circle cx="30" cy="30" r="4" fill="#ffffff" />
      
      <!-- Connecting lines (network) -->
      <line x1="-40" y1="-40" x2="0" y2="-20" stroke="#ffffff" stroke-width="2" opacity="0.5" />
      <line x1="0" y1="-20" x2="40" y2="-50" stroke="#ffffff" stroke-width="2" opacity="0.5" />
      <line x1="-30" y1="20" x2="30" y2="30" stroke="#ffffff" stroke-width="2" opacity="0.5" />
    </g>
  </g>
</svg>
