<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- APPROCCIO 2: MONOGRAM (solo icona T, no testo) -->
  <!-- Basato su: Distinctiveness (Keller 1993), Memorability -->
  <!-- Esempi: IBM, HP, Chanel - icona riconoscibile senza testo -->
  <g transform="translate(10, 10)">
    <!-- T letter - Design geometrico pulito e riconoscibile -->
    <rect x="0" y="0" width="40" height="6" rx="3" fill="url(#logoGradient)" />
    <rect x="17" y="6" width="6" height="34" rx="3" fill="url(#logoGradient)" />
    
    <!-- Elemento decorativo minimale - suggerisce AI/analisi -->
    <circle cx="50" cy="25" r="2.5" fill="url(#logoGradient)" opacity="0.6" />
  </g>
</svg>
