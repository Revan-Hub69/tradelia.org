<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Archivio Report Tradelia AI - SRD v5.0 (Swing Research Deck) e MTB v3.1 (Macro Tactical Briefing)" />
  <meta name="theme-color" content="#0f0f0f" />
  
  <title>TRADELIA • AI — Archivio</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/report/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/global-header.css" />
  <link rel="stylesheet" href="/archivio/assets/css/archive.css" />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <!-- HEADER SLOT -->
  <div id="site-header-slot"></div>
  
  <!-- MAIN CONTENT -->
  <main id="archive-main" class="container">
    <header class="archive-header">
      <h1 class="archive-title">Archivio Report</h1>
      <p class="archive-subtitle">SRD v5.0 (Swing Research Deck) e MTB v3.1 (Macro Tactical Briefing) — report pubblici disponibili dopo 24h</p>
      <div class="archive-actions" id="archive-admin-actions" hidden>
        <button class="archive-admin-btn" id="archive-admin-button">
          Apri dashboard admin
        </button>
      </div>
    </header>
    
    <!-- SEZIONI: Report | Tutorial -->
    <nav class="archive-tabs" role="tablist">
      <button class="archive-tab active" role="tab" data-tab="reports" aria-selected="true">
        Report
      </button>
      <button class="archive-tab" role="tab" data-tab="tutorials" aria-selected="false">
        Tutorial
      </button>
    </nav>
    
    <!-- SEZIONE REPORT -->
    <section id="reports-section" class="archive-section active" role="tabpanel">
      <!-- Filtri (solo per abbonati, nascosti di default) -->
      <div id="filters-container" class="archive-filters" hidden>
        <button class="btn-toggle-filters" aria-expanded="false">
          <span>Filtri e Ricerca</span>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 10l5 5 5-5"/>
          </svg>
        </button>
        <div class="filters-panel" hidden>
          <!-- Filtri avanzati qui -->
        </div>
      </div>
      
      <!-- Tabella Report -->
      <div class="archive-table-container">
        <table class="archive-table" id="reports-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Asset</th>
              <th>Framework</th>
              <th>Tipologia</th>
              <th>Exchange</th>
              <th>Settore</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="reports-tbody">
            <!-- Report caricati dinamicamente -->
          </tbody>
        </table>
      </div>
      
      <!-- Loading State -->
      <div id="loading-state" class="archive-loading">
        <p>Caricamento report...</p>
      </div>
      
      <!-- Empty State -->
      <div id="empty-state" class="archive-empty" hidden>
        <p>Nessun report disponibile</p>
      </div>
    </section>
    
    <!-- SEZIONE TUTORIAL -->
    <section id="tutorials-section" class="archive-section" role="tabpanel" hidden>
      <div class="tutorials-list" id="tutorials-list">
        <!-- Tutorial caricati dinamicamente -->
      </div>
      
      <!-- Loading State -->
      <div id="tutorials-loading" class="archive-loading">
        <p>Caricamento tutorial...</p>
      </div>
    </section>
  </main>
  
  <!-- FOOTER SLOT -->
  <div id="site-footer-slot"></div>
  
  <!-- SCRIPTS -->
  <script type="module" src="/archivio/assets/js/archive.js"></script>
</body>
</html>
