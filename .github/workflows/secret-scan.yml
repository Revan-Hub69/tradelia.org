name: Secret Scan

on:
  push:
  pull_request:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (repo scan)
        uses: trufflesecurity/trufflehog-action@v2
        with:
          # Default configuration scans the repository for high-entropy strings and known secrets
          args: "--json"
