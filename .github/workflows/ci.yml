name: CI

on:
  push:
    branches: [ Tradelia-Main ]
  pull_request:
    branches: [ Tradelia-Main ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate tokens
        run: npm run generate-tokens
      
      - name: Check manifest
        run: npm run generate-manifest
      
      # TODO: Aggiungere ESLint quando configurato
      # - name: Run ESLint
      #   run: npm run lint
      
      - name: Check for build errors
        run: |
          if [ -f "vite.config.js" ]; then
            npm install -g vite
            vite build --mode production || echo "Build check skipped"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run security audit
        run: npm audit --audit-level=moderate || true

