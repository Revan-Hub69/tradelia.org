services:
  - type: web
    name: tradelia-ai
    env: node
    buildCommand: npm install && NODE_OPTIONS="--max-old-space-size=4096" npm run build
    startCommand: node server.js || node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /
    plan: starter
