<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- APPROCCIO 3: LETTERMARK (T stilizzata come parte del testo) -->
  <!-- Basato su: Visual Integration (Lidwell 2010), Cohesive Design -->
  <!-- La T iniziale è stilizzata ma fa parte della parola -->
  <g transform="translate(0, 12)">
    <!-- T iniziale stilizzata (più grande, gradient) -->
    <text x="0" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="url(#logoGradient)" letter-spacing="-0.5">
      T
    </text>
    <!-- Resto della parola normale -->
    <text x="28" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#ffffff" letter-spacing="-0.5">
      radelia
    </text>
    <!-- AI superscript -->
    <text x="140" y="20" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#60a5fa" letter-spacing="1.5">
      AI
    </text>
  </g>
</svg>
