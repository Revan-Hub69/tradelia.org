<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- APPROCCIO 1: WORDMARK PURO (solo testo, no icona) -->
  <!-- Basato su: Simplicity Principle (Aaker 1991), Avoid Redundancy (Gestalt) -->
  <!-- Esempi: Google, Coca-Cola, FedEx -->
  <g transform="translate(0, 12)">
    <text x="0" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#ffffff" letter-spacing="-0.5">
      Tradelia
    </text>
    <text x="130" y="20" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#60a5fa" letter-spacing="1.5">
      AI
    </text>
  </g>
</svg>
