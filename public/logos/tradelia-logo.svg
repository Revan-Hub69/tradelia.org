<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient per T split: metà grigia scura (migliore contrasto), metà blu -->
    <!-- WCAG AA: grigio più scuro (#6b7280) per contrasto 4.5:1 su sfondo scuro -->
    <linearGradient id="tSplitGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- APPROCCIO 3: LETTERMARK con T split color - Verificato design principles -->
  <!-- Basato su: Visual Hierarchy (Lidwell 2010), WCAG AA contrast, Typography Balance -->
  <g transform="translate(0, 12)">
    <!-- T iniziale - Split 45/55 (grigio/blu) per migliore equilibrio visivo -->
    <!-- Font-weight 600 (allineato con radelia) per coerenza -->
    <text x="0" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="url(#tSplitGradient)" letter-spacing="-0.2">
      T
    </text>
    <!-- Resto della parola - Spacing ottimizzato per leggibilità -->
    <text x="22" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#ffffff" letter-spacing="-0.5">
      radelia
    </text>
    <!-- AI superscript - Posizionamento ottimizzato -->
    <text x="138" y="20" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#60a5fa" letter-spacing="1.5">
      AI
    </text>
  </g>
</svg>
