<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Servizi Gratuiti Tradelia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.5s ease-out both; }
    .flip-page { perspective: 2000px; position: relative; width: 100%; max-width: 1000px; margin: 0 auto; }
    .flip-wrapper { transition: transform 0.8s ease; transform-style: preserve-3d; position: relative; width: 100%; }
    .flip-page[data-flipped="1"] .flip-wrapper,
    .flip-page[data-flipped="2"] .flip-wrapper,
    .flip-page[data-flipped="3"] .flip-wrapper,
    .flip-page[data-flipped="4"] .flip-wrapper {
      transform: rotateY(180deg);
    }
    .flip-face {
      backface-visibility: hidden;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: auto;
    }
    .flip-back { transform: rotateY(180deg); }
    .form-field:focus-within label { color: #2563eb; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-200 to-slate-50 py-20 px-4">

  <div class="flip-page" id="flipContainer" data-flipped="0">
    <div class="flip-wrapper">

      <!-- Pagina principale -->
      <section class="flip-face bg-white p-10 font-[Inter] text-gray-900 rounded-3xl shadow-2xl ring-1 ring-gray-200">
        <h2 class="text-4xl font-semibold text-center text-blue-800 mb-6">I Servizi Gratuiti Tradelia</h2>
        <p class="text-center text-gray-600 mb-10">Soluzioni analitiche professionali per investitori e trader</p>
        <p class="text-base text-gray-600 text-center mb-6">Seleziona il tipo di richiesta</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

          <!-- Pulsanti -->
          <button onclick="flipPage(1)" class="group relative rounded-2xl px-6 py-8 bg-white border border-blue-100 hover:ring-2 hover:ring-blue-200 hover:-translate-y-1 transition">
            <div class="flex flex-col items-center gap-3">
              <div class="bg-blue-100 p-3 rounded-full"><i data-lucide="bar-chart" class="w-6 h-6 text-blue-700"></i></div>
              <span class="font-semibold text-center">Analisi su Singolo Asset</span>
              <p class="text-sm text-gray-500 text-center">Analisi completa tecnica, fondamentale e macro</p>
              <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 absolute bottom-4 right-4 opacity-70"></i>
            </div>
          </button>

          <button onclick="flipPage(2)" class="group relative rounded-2xl px-6 py-8 bg-white border border-blue-100 hover:ring-2 hover:ring-blue-200 hover:-translate-y-1 transition">
            <div class="flex flex-col items-center gap-3">
              <div class="bg-blue-100 p-3 rounded-full"><i data-lucide="trending-up" class="w-6 h-6 text-blue-700"></i></div>
              <span class="font-semibold text-center">3 Azioni Sottovalutate</span>
              <p class="text-sm text-gray-500 text-center">Titoli solidi con pricing inefficiente</p>
              <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 absolute bottom-4 right-4 opacity-70"></i>
            </div>
          </button>

          <button onclick="flipPage(3)" class="group relative rounded-2xl px-6 py-8 bg-white border border-blue-100 hover:ring-2 hover:ring-blue-200 hover:-translate-y-1 transition">
            <div class="flex flex-col items-center gap-3">
              <div class="bg-blue-100 p-3 rounded-full"><i data-lucide="bitcoin" class="w-6 h-6 text-blue-700"></i></div>
              <span class="font-semibold text-center">3 Crypto Solide</span>
              <p class="text-sm text-gray-500 text-center">Token con sviluppo attivo e potenziale</p>
              <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 absolute bottom-4 right-4 opacity-70"></i>
            </div>
          </button>

          <button onclick="flipPage(4)" class="group relative rounded-2xl px-6 py-8 bg-white border border-blue-100 hover:ring-2 hover:ring-blue-200 hover:-translate-y-1 transition">
            <div class="flex flex-col items-center gap-3">
              <div class="bg-blue-100 p-3 rounded-full"><i data-lucide="wallet" class="w-6 h-6 text-blue-700"></i></div>
              <span class="font-semibold text-center">3 Titoli ad Alto Dividendo</span>
              <p class="text-sm text-gray-500 text-center">Selezione con yield elevato</p>
              <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 absolute bottom-4 right-4 opacity-70"></i>
            </div>
          </button>

        </div>
      </section>

      <!-- Pagina form -->
      <section class="flip-face flip-back bg-white p-10 rounded-3xl shadow-2xl ring-1 ring-gray-200 min-h-[600px]">
        <div class="flex justify-end">
          <button onclick="flipPage(0)" class="text-gray-400 hover:text-blue-700">
            <i data-lucide="corner-up-left" class="w-6 h-6"></i>
          </button>
        </div>
        <div id="formContainer"></div>
      </section>

    </div>
  </div>

  <script>
    function flipPage(val) {
      const container = document.getElementById("flipContainer");
      container.setAttribute("data-flipped", val);
      const formContainer = document.getElementById("formContainer");
      formContainer.innerHTML = "";

      const servizio = val === 1 ? "Analisi Singolo Asset"
                    : val === 2 ? "3 Azioni Sottovalutate"
                    : val === 3 ? "3 Crypto Solide"
                    : "3 Titoli ad Alto Dividendo";

      const title = val === 1
        ? "Analisi su asset con metodologia AI avanzata e dati istituzionali"
        : `Riceverai 3 ${servizio.slice(2)} selezionati settimanalmente.`;

      const isAsset = val === 1;

      const formHTML = `
        <div class="text-sm text-gray-600 text-center mb-6">${title}</div>
        <form id="richiestaForm" class="space-y-6 max-w-xl mx-auto">
          <input type="hidden" name="servizio" value="${servizio}" />
          ${isAsset ? `
          <div class="form-field">
            <label class="block text-sm font-medium text-gray-700 mb-1">Ticker o nome asset</label>
            <input name="asset" required class="w-full border border-gray-300 rounded-lg px-4 py-2" placeholder="Es. AAPL o Apple Inc." />
          </div>
          <div class="form-field">
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo di analisi</label>
            <select name="analisi" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
              <option>Approfondita (consigliata)</option>
              <option>Tecnica</option>
              <option>Fondamentale</option>
              <option>Macro</option>
            </select>
          </div>` : ""}
          <div class="form-field">
            <label class="block text-sm font-medium text-gray-700 mb-1">Metodo di ricezione</label>
            <select name="metodo" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
              <option>WhatsApp</option>
              <option>SMS</option>
              <option>Email</option>
            </select>
          </div>
          <div class="form-field">
            <label class="block text-sm font-medium text-gray-700 mb-1">Contatto</label>
            <input name="contatto" required class="w-full border border-gray-300 rounded-lg px-4 py-2" placeholder="Numero o email" />
          </div>
          <div class="form-field">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
            <input name="nome" required class="w-full border border-gray-300 rounded-lg px-4 py-2" placeholder="Il tuo nome" />
          </div>
          <div class="pt-2">
            <button type="submit" class="w-full bg-blue-700 text-white font-semibold py-3 rounded-lg hover:bg-blue-800">
              Invia Richiesta
            </button>
          </div>
        </form>`;
      formContainer.innerHTML = formHTML;
      lucide.createIcons();
    }

    lucide.createIcons();

    document.addEventListener("submit", async function (e) {
      const form = e.target;
      if (form.id !== "richiestaForm") return;
      e.preventDefault();

      const data = Object.fromEntries(new FormData(form).entries());
      const btn = form.querySelector("button[type=submit]");
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin w-5 h-5 mx-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="4" class="opacity-25"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M4 12a8 8 0 018-8" class="opacity-75"/></svg>`;

      try {
        const res = await fetch("/api/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          form.innerHTML = `<div class="text-center text-green-600 font-medium text-lg py-6">✅ Richiesta inviata con successo! Ti contatteremo al più presto.</div>`;
        } else {
          throw new Error("Errore");
        }
      } catch (err) {
        alert("Errore nell'invio. Riprova.");
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });
  </script>

</body>
</html>
