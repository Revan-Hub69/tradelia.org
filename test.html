<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Servizi Gratuiti Tradelia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out both;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-slate-200 to-slate-50 py-20 px-4">

    <section class="w-full max-w-4xl mx-auto bg-white p-10 md:p-14 font-[Inter] text-gray-900 rounded-3xl shadow-2xl ring-1 ring-gray-200">
      <h2 class="text-4xl md:text-5xl font-semibold text-center text-blue-800 mb-6 tracking-tight leading-tight">I Servizi Gratuiti Tradelia</h2>
      <p class="text-center text-gray-600 text-base tracking-wide mb-12">Soluzioni analitiche professionali per investitori e trader, offerte gratuitamente da Tradelia</p>

      <div class="space-y-6 animate-fade-in">
        <p class="text-base text-gray-600 text-center">Seleziona il tipo di richiesta per avviare l'analisi gratuita</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6">

          <!-- CARD -->
          <button class="group relative w-full text-left rounded-2xl px-6 py-8 bg-white border border-blue-100 shadow-sm hover:shadow-md hover:-translate-y-1 hover:ring-2 hover:ring-blue-200 transition-all duration-300 ease-out cursor-pointer" role="button">
            <div class="flex flex-col items-center gap-4">
              <div class="bg-blue-100 p-3 rounded-full">
                <i data-lucide="bar-chart" class="w-6 h-6 text-blue-700 group-hover:text-blue-800 transition-transform"></i>
              </div>
              <span class="text-base font-semibold text-center">Analisi su Singolo Asset</span>
              <p class="text-sm text-gray-500 text-center">Approccio tecnico, fondamentale, macro e approfondito con metodologia avanzata</p>
              <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 opacity-70 group-hover:opacity-100 transition-opacity absolute bottom-4 right-4"></i>
            </div>
          </button>

          <!-- CARD -->
          <button class="group relative w-full text-left rounded-2xl px-6 py-8 bg-white border border-blue-100 shadow-sm hover:shadow-md hover:-translate-y-1 hover:ring-2 hover:ring-blue-200 transition-all duration-300 ease-out cursor-pointer" role="button">
            <div class="flex flex-col items-center gap-4">
              <div class="bg-blue-100 p-3 rounded-full">
                <i data-lucide="trending-up" class="w-6 h-6 text-blue-700 group-hover:text-blue-800 transition-transform"></i>
              </div>
              <span class="text-base font-semibold text-center">3 Azioni Sottovalutate</span>
              <p class="text-sm text-gray-500 text-center">Titoli con fondamentali solidi e pricing inefficiente</p>
              <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 opacity-70 group-hover:opacity-100 transition-opacity absolute bottom-4 right-4"></i>
            </div>
          </button>

          <!-- CARD -->
          <button class="group relative w-full text-left rounded-2xl px-6 py-8 bg-white border border-blue-100 shadow-sm hover:shadow-md hover:-translate-y-1 hover:ring-2 hover:ring-blue-200 transition-all duration-300 ease-out cursor-pointer" role="button">
            <div class="flex flex-col items-center gap-4">
              <div class="bg-blue-100 p-3 rounded-full">
                <i data-lucide="bitcoin" class="w-6 h-6 text-blue-700 group-hover:text-blue-800 transition-transform"></i>
              </div>
              <span class="text-base font-semibold text-center">3 Crypto Solide</span>
              <p class="text-sm text-gray-500 text-center">Token major cap con sviluppo attivo e margine di crescita</p>
              <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 opacity-70 group-hover:opacity-100 transition-opacity absolute bottom-4 right-4"></i>
            </div>
          </button>

          <!-- CARD -->
          <button class="group relative w-full text-left rounded-2xl px-6 py-8 bg-white border border-blue-100 shadow-sm hover:shadow-md hover:-translate-y-1 hover:ring-2 hover:ring-blue-200 transition-all duration-300 ease-out cursor-pointer" role="button">
            <div class="flex flex-col items-center gap-4">
              <div class="bg-blue-100 p-3 rounded-full">
                <i data-lucide="wallet" class="w-6 h-6 text-blue-700 group-hover:text-blue-800 transition-transform"></i>
              </div>
              <span class="text-base font-semibold text-center">3 Titoli ad Alto Dividendo</span>
              <p class="text-sm text-gray-500 text-center">Selezione con yield elevato e payout sostenibile</p>
              <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 opacity-70 group-hover:opacity-100 transition-opacity absolute bottom-4 right-4"></i>
            </div>
          </button>

        </div>
      </div>
    </section>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
