<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servizi Gratuiti Tradelia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      .service-card {
        @apply w-full text-center border border-gray-200 bg-white px-6 py-6 rounded-2xl shadow-sm hover:shadow-md hover:border-blue-600 hover:bg-blue-50 transition-all duration-300 ease-in-out;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out both;
      }
    </style>
  </head>
  <body class="text-gray-900">
    <section class="w-full max-w-5xl mx-auto bg-white p-10 font-[Inter] text-gray-900 rounded-3xl shadow-2xl border border-gray-100 mt-16 mb-20">
      <h2 class="text-4xl font-semibold text-center text-blue-800 mb-14 tracking-tight">I Servizi Gratuiti Tradelia</h2>

      <div class="space-y-6 animate-fade-in">
        <p class="text-base text-gray-600 text-center">Seleziona il tipo di richiesta per avviare l'analisi gratuita</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 mt-8">

          <button class="group service-card">
            <div class="flex items-center justify-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m0-4V7m4 10v-4m0-4V7m4 10v-6m0-4V7" />
              </svg>
              <span class="text-lg font-semibold">Analisi su Singolo Asset</span>
            </div>
            <p class="text-sm text-gray-500 mt-2">Analisi tecnica, fondamentale e macro su misura</p>
          </button>

          <button class="group service-card">
            <div class="flex items-center justify-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" />
              </svg>
              <span class="text-lg font-semibold">3 Azioni Sottovalutate</span>
            </div>
            <p class="text-sm text-gray-500 mt-2">Selezione AI tra titoli di qualità con pricing inefficiente</p>
          </button>

          <button class="group service-card">
            <div class="flex items-center justify-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v8m4-4H8" />
              </svg>
              <span class="text-lg font-semibold">3 Crypto Solide</span>
            </div>
            <p class="text-sm text-gray-500 mt-2">Token major cap con fondamentali, crescita e sviluppo attivo</p>
          </button>

          <button class="group service-card">
            <div class="flex items-center justify-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c1.1 0 2 .9 2 2v4a2 2 0 01-2 2c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2z" />
              </svg>
              <span class="text-lg font-semibold">3 Titoli ad Alto Dividendo</span>
            </div>
            <p class="text-sm text-gray-500 mt-2">Titoli selezionati con yield elevato e payout sostenibile</p>
          </button>

        </div>
      </div>
    </section>
  </body>
</html>
