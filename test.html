<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Servizi Gratuiti Tradelia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out both;
      }
      .flip-page {
        perspective: 2000px;
        position: relative;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
      }
      .flip-wrapper {
        transition: transform 0.8s ease;
        transform-style: preserve-3d;
        position: relative;
        width: 100%;
      }
      .flip-page[data-flipped="1"] .flip-wrapper,
      .flip-page[data-flipped="2"] .flip-wrapper,
      .flip-page[data-flipped="3"] .flip-wrapper,
      .flip-page[data-flipped="4"] .flip-wrapper {
        transform: rotateY(180deg);
      }
      .flip-face {
        backface-visibility: hidden;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
      }
      .flip-back {
        transform: rotateY(180deg);
      }
      .form-field:focus-within label {
        color: #2563eb;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-slate-200 to-slate-50 py-20 px-4">
    <div class="flip-page" id="flipContainer" data-flipped="0">
      <div class="flip-wrapper">
        <section class="flip-face bg-white p-10 font-[Inter] text-gray-900 rounded-3xl shadow-2xl ring-1 ring-gray-200">
          <h2 class="text-4xl font-semibold text-center text-blue-800 mb-6 tracking-tight leading-tight">I Servizi Gratuiti Tradelia</h2>
          <p class="text-center text-gray-600 text-base tracking-wide mb-10">Soluzioni analitiche professionali per investitori e trader, offerte gratuitamente da Tradelia</p>
          <p class="text-base text-gray-600 text-center mb-6">Seleziona il tipo di richiesta per avviare l'analisi gratuita</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-6">
            <button onclick="flipPage(1)" class="group relative w-full text-left rounded-2xl px-6 py-8 bg-white border border-blue-100 shadow-sm hover:shadow-md hover:-translate-y-1 hover:ring-2 hover:ring-blue-200 transition-all duration-500 ease-out cursor-pointer">
              <div class="flex flex-col items-center gap-3">
                <div class="bg-blue-100 p-3 rounded-full">
                  <i data-lucide="bar-chart" class="w-6 h-6 text-blue-700"></i>
                </div>
                <span class="text-base font-semibold text-center">Analisi su Singolo Asset</span>
                <p class="text-sm text-gray-500 text-center">Approccio tecnico, fondamentale, macro e approfondito con metodologia avanzata</p>
                <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 opacity-70 absolute bottom-4 right-4"></i>
              </div>
            </button>
            <button onclick="flipPage(2)" class="group relative w-full text-left rounded-2xl px-6 py-8 bg-white border border-blue-100 shadow-sm hover:shadow-md hover:-translate-y-1 hover:ring-2 hover:ring-blue-200 transition-all duration-500 ease-out cursor-pointer">
              <div class="flex flex-col items-center gap-3">
                <div class="bg-blue-100 p-3 rounded-full">
                  <i data-lucide="trending-up" class="w-6 h-6 text-blue-700"></i>
                </div>
                <span class="text-base font-semibold text-center">3 Azioni Sottovalutate</span>
                <p class="text-sm text-gray-500 text-center">Titoli con fondamentali solidi e pricing inefficiente</p>
                <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 opacity-70 absolute bottom-4 right-4"></i>
              </div>
            </button>
            <button onclick="flipPage(3)" class="group relative w-full text-left rounded-2xl px-6 py-8 bg-white border border-blue-100 shadow-sm hover:shadow-md hover:-translate-y-1 hover:ring-2 hover:ring-blue-200 transition-all duration-500 ease-out cursor-pointer">
              <div class="flex flex-col items-center gap-3">
                <div class="bg-blue-100 p-3 rounded-full">
                  <i data-lucide="bitcoin" class="w-6 h-6 text-blue-700"></i>
                </div>
                <span class="text-base font-semibold text-center">3 Crypto Solide</span>
                <p class="text-sm text-gray-500 text-center">Token major cap con sviluppo attivo e margine di crescita</p>
                <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 opacity-70 absolute bottom-4 right-4"></i>
              </div>
            </button>
            <button onclick="flipPage(4)" class="group relative w-full text-left rounded-2xl px-6 py-8 bg-white border border-blue-100 shadow-sm hover:shadow-md hover:-translate-y-1 hover:ring-2 hover:ring-blue-200 transition-all duration-500 ease-out cursor-pointer">
              <div class="flex flex-col items-center gap-3">
                <div class="bg-blue-100 p-3 rounded-full">
                  <i data-lucide="wallet" class="w-6 h-6 text-blue-700"></i>
                </div>
                <span class="text-base font-semibold text-center">3 Titoli ad Alto Dividendo</span>
                <p class="text-sm text-gray-500 text-center">Selezione con yield elevato e payout sostenibile</p>
                <i data-lucide="arrow-right" class="w-5 h-5 text-blue-600 opacity-70 absolute bottom-4 right-4"></i>
              </div>
            </button>
          </div>
        </section>

        <section class="flip-face flip-back bg-white p-10 font-[Inter] text-gray-900 rounded-3xl shadow-2xl ring-1 ring-gray-200 min-h-[600px]">
          <div class="flex justify-end">
            <button onclick="flipPage(0)" class="text-gray-400 hover:text-blue-700 transition-all">
              <i data-lucide="corner-up-left" class="w-6 h-6"></i>
            </button>
          </div>
          <div id="formContainer"></div>
        </section>
      </div>
    </div>

    <script>
      function flipPage(val) {
        const container = document.getElementById("flipContainer");
        container.setAttribute("data-flipped", val);

        const formContainer = document.getElementById("formContainer");
        formContainer.innerHTML = "";

        const title = val === 1
          ? "Analisi su asset con metodologia AI avanzata e dati istituzionali"
          : `Riceverai 3 ${val === 2 ? "Azioni Sottovalutate" : val === 3 ? "Crypto Solide" : "Titoli ad Alto Dividendo"} selezionati settimanalmente dalla nostra AI.`;

        const isAsset = val === 1;

        const formHTML = `
          <div class="text-sm text-gray-600 text-center mb-6 max-w-2xl mx-auto">${title}</div>
          <form class='space-y-6 max-w-xl mx-auto' method="POST" action="/api/send-email">
            ${isAsset ? `
            <div class="form-field">
              <label class="block text-sm font-medium text-gray-700 mb-1">Ticker o nome asset</label>
              <input name="asset" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="Es. AAPL o Apple Inc." />
            </div>
            <div class="form-field">
              <label class="block text-sm font-medium text-gray-700 mb-1">Tipo di analisi</label>
              <select name="analisi" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500 transition">
                <option>Approfondita (consigliata)</option>
                <option>Tecnica</option>
                <option>Fondamentale</option>
                <option>Macro</option>
              </select>
            </div>` : ""}
            <div class="form-field">
              <label class="block text-sm font-medium text-gray-700 mb-1">Metodo di ricezione</label>
              <select name="metodo" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500 transition">
                <option>WhatsApp</option>
                <option>SMS</option>
                <option>Email</option>
              </select>
            </div>
            <div class="form-field">
              <label class="block text-sm font-medium text-gray-700 mb-1">Contatto</label>
              <input name="contatto" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="Numero o email" />
            </div>
            <div class="form-field">
              <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
              <input name="nome" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="Il tuo nome" />
            </div>
            <div class="pt-2">
              <button type="submit" class="w-full bg-blue-700 text-white font-semibold py-3 rounded-lg hover:bg-blue-800 focus:ring-2 focus:ring-blue-500 transition">
                Invia Richiesta
              </button>
            </div>
          </form>
        `;

        formContainer.innerHTML = formHTML;
        lucide.createIcons();
      }
      lucide.createIcons();
    </script>
  </body>
</html>
