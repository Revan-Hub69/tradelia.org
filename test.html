<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servizi Gratuiti Tradelia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .flip-page { perspective: 2000px; max-width: 1000px; margin: 0 auto; }
    .flip-wrapper { transition: transform 0.8s ease; transform-style: preserve-3d; position: relative; width: 100%; }
    .flip-page[data-flipped="1"] .flip-wrapper,
    .flip-page[data-flipped="2"] .flip-wrapper,
    .flip-page[data-flipped="3"] .flip-wrapper,
    .flip-page[data-flipped="4"] .flip-wrapper {
      transform: rotateY(180deg);
    }
    .flip-face {
      backface-visibility: hidden;
      position: absolute;
      width: 100%;
    }
    .flip-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-200 to-slate-50 py-20 px-4">

  <div class="flip-page" id="flipContainer" data-flipped="0">
    <div class="flip-wrapper">

      <!-- Pagina iniziale -->
      <section class="flip-face bg-white p-10 text-gray-900 rounded-3xl shadow-2xl ring-1 ring-gray-200">
        <h2 class="text-3xl sm:text-4xl font-semibold text-center text-blue-800 mb-4">Servizi Gratuiti Tradelia</h2>
        <p class="text-center text-gray-600 mb-8">Richiedi un'analisi professionale supportata da intelligenza artificiale e dati istituzionali</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

          <button onclick="flipPage(1)" class="group rounded-2xl px-6 py-6 bg-white border border-blue-100 hover:ring-2 hover:ring-blue-200 hover:-translate-y-1 transition text-center">
            <div class="flex flex-col items-center gap-2">
              <div class="bg-blue-100 p-3 rounded-full"><i data-lucide="bar-chart" class="w-6 h-6 text-blue-700"></i></div>
              <span class="font-semibold">Analisi Singolo Asset</span>
              <p class="text-sm text-gray-500">Tecnica, fondamentale e macro</p>
            </div>
          </button>

          <button onclick="flipPage(2)" class="group rounded-2xl px-6 py-6 bg-white border border-blue-100 hover:ring-2 hover:ring-blue-200 hover:-translate-y-1 transition text-center">
            <div class="flex flex-col items-center gap-2">
              <div class="bg-blue-100 p-3 rounded-full"><i data-lucide="trending-up" class="w-6 h-6 text-blue-700"></i></div>
              <span class="font-semibold">3 Azioni Sottovalutate</span>
              <p class="text-sm text-gray-500">Scelte basate su inefficienze di pricing</p>
            </div>
          </button>

          <button onclick="flipPage(3)" class="group rounded-2xl px-6 py-6 bg-white border border-blue-100 hover:ring-2 hover:ring-blue-200 hover:-translate-y-1 transition text-center">
            <div class="flex flex-col items-center gap-2">
              <div class="bg-blue-100 p-3 rounded-full"><i data-lucide="bitcoin" class="w-6 h-6 text-blue-700"></i></div>
              <span class="font-semibold">3 Crypto Solide</span>
              <p class="text-sm text-gray-500">Token con sviluppo attivo e adozione</p>
            </div>
          </button>

          <button onclick="flipPage(4)" class="group rounded-2xl px-6 py-6 bg-white border border-blue-100 hover:ring-2 hover:ring-blue-200 hover:-translate-y-1 transition text-center">
            <div class="flex flex-col items-center gap-2">
              <div class="bg-blue-100 p-3 rounded-full"><i data-lucide="wallet" class="w-6 h-6 text-blue-700"></i></div>
              <span class="font-semibold">3 Titoli ad Alto Dividendo</span>
              <p class="text-sm text-gray-500">Selezione settoriale con yield elevato</p>
            </div>
          </button>

        </div>
      </section>

      <!-- Pagina form -->
      <section class="flip-face flip-back bg-white p-8 sm:p-10 rounded-3xl shadow-2xl ring-1 ring-gray-200 min-h-[600px]">
        <div class="flex justify-end mb-4">
          <button onclick="flipPage(0)" class="text-gray-400 hover:text-blue-700">
            <i data-lucide="corner-up-left" class="w-6 h-6"></i>
          </button>
        </div>
        <div id="formContainer"></div>
      </section>

    </div>
  </div>

  <script>
    function flipPage(val) {
      const container = document.getElementById("flipContainer");
      container.setAttribute("data-flipped", val);
      const formContainer = document.getElementById("formContainer");
      formContainer.innerHTML = "";

      const servizio = val === 1 ? "Analisi Singolo Asset"
                    : val === 2 ? "3 Azioni Sottovalutate"
                    : val === 3 ? "3 Crypto Solide"
                    : "3 Titoli ad Alto Dividendo";

      const title = val === 1
        ? "Analisi su asset con metodologia AI e dati istituzionali"
        : `Riceverai ${servizio} selezionati da modelli proprietari Tradelia.`;

      const isAsset = val === 1;

      const formHTML = `
        <div class="text-sm text-gray-600 text-center mb-6">${title}</div>
        <form id="richiestaForm" class="space-y-5 max-w-xl mx-auto text-sm">
          <input type="hidden" name="servizio" value="${servizio}" />
          ${isAsset ? `
          <div>
            <label class="block font-medium mb-1">Ticker o nome asset</label>
            <input name="asset" required class="w-full border border-gray-300 rounded-md px-4 py-2" placeholder="Es. AAPL o Apple Inc." />
          </div>
          <div>
            <label class="block font-medium mb-1">Tipo di analisi</label>
            <select name="analisi" required class="w-full border border-gray-300 rounded-md px-4 py-2">
              <option>Approfondita (consigliata)</option>
              <option>Tecnica</option>
              <option>Fondamentale</option>
              <option>Macro</option>
            </select>
          </div>` : ""}
          <div>
            <label class="block font-medium mb-1">Metodo di ricezione</label>
            <select name="metodo" required class="w-full border border-gray-300 rounded-md px-4 py-2">
              <option>WhatsApp (consigliato)</option>
              <option>SMS</option>
              <option>Email</option>
            </select>
            <p class="text-[11px] text-gray-500 mt-1 italic">
              Non riceverai comunicazioni promozionali. I dati sono usati solo per inviarti il report richiesto.
            </p>
          </div>
          <div>
            <label class="block font-medium mb-1">Contatto</label>
            <input name="contatto" required class="w-full border border-gray-300 rounded-md px-4 py-2" placeholder="Numero o email" />
          </div>
          <div>
            <label class="block font-medium mb-1">Nome</label>
            <input name="nome" required class="w-full border border-gray-300 rounded-md px-4 py-2" placeholder="Il tuo nome" />
          </div>
          <div>
            <button type="submit" class="w-full bg-blue-700 text-white font-semibold py-3 rounded-md hover:bg-blue-800 transition">
              Invia Richiesta
            </button>
          </div>
        </form>`;
      formContainer.innerHTML = formHTML;
      lucide.createIcons();
    }

    lucide.createIcons();

    document.addEventListener("submit", async function (e) {
      const form = e.target;
      if (form.id !== "richiestaForm") return;
      e.preventDefault();

      const data = Object.fromEntries(new FormData(form).entries());
      const btn = form.querySelector("button[type=submit]");
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin w-5 h-5 mx-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="4" class="opacity-25"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M4 12a8 8 0 018-8" class="opacity-75"/></svg>`;

      try {
        const res = await fetch("/api/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          form.innerHTML = `<div class="text-center text-green-600 font-medium text-lg py-6">✅ Richiesta inviata con successo! Ti contatteremo a breve.</div>`;
        } else {
          throw new Error("Errore");
        }
      } catch (err) {
        alert("Errore nell'invio. Riprova.");
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });
  </script>

</body>
</html>
