<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servizi Tradelia – Selezione Iniziale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f9fafb;
      }

      .service-card {
        @apply w-full text-center border border-gray-200 bg-white px-6 py-8 rounded-2xl shadow-sm hover:shadow-md hover:border-blue-600 hover:bg-blue-50 transition-all duration-300 ease-in-out cursor-pointer;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fade-in 0.5s ease-out both;
      }
    </style>
  </head>

  <body class="text-gray-900">
    <section class="w-full max-w-6xl mx-auto bg-white p-10 mt-12 rounded-3xl shadow-2xl border border-gray-100">
      <h2 class="text-4xl font-semibold text-center text-blue-800 mb-14 tracking-tight">I Servizi Gratuiti Tradelia</h2>

      <!-- Step 1: Scelta iniziale del servizio -->
      <div id="step-1" class="space-y-6 animate-fade-in">
        <p class="text-base text-gray-600 text-center">Seleziona il tipo di richiesta per avviare l'analisi gratuita</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mt-8">

          <button data-type="analisi" class="group service-card hover:scale-[1.015]">
            <div class="flex flex-col items-center gap-3">
              <div class="bg-blue-100 p-3 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700 group-hover:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m0-4V7m4 10v-4m0-4V7m4 10v-6m0-4V7" />
                </svg>
              </div>
              <span class="text-base font-semibold">Analisi su Singolo Asset</span>
              <p class="text-sm text-gray-500 text-center">Analisi tecnica, fondamentale e macro su misura</p>
            </div>
          </button>

          <button data-type="azioni" class="group service-card hover:scale-[1.015]">
            <div class="flex flex-col items-center gap-3">
              <div class="bg-blue-100 p-3 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700 group-hover:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" />
                </svg>
              </div>
              <span class="text-base font-semibold">3 Azioni Sottovalutate</span>
              <p class="text-sm text-gray-500 text-center">Titoli con fondamentali solidi e pricing inefficiente</p>
            </div>
          </button>

          <button data-type="crypto" class="group service-card hover:scale-[1.015]">
            <div class="flex flex-col items-center gap-3">
              <div class="bg-blue-100 p-3 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700 group-hover:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v8m4-4H8" />
                </svg>
              </div>
              <span class="text-base font-semibold">3 Crypto Solide</span>
              <p class="text-sm text-gray-500 text-center">Token major cap con sviluppo attivo e margine di crescita</p>
            </div>
          </button>

          <button data-type="dividendi" class="group service-card hover:scale-[1.015]">
            <div class="flex flex-col items-center gap-3">
              <div class="bg-blue-100 p-3 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700 group-hover:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c1.1 0 2 .9 2 2v4a2 2 0 01-2 2c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2z" />
                </svg>
              </div>
              <span class="text-base font-semibold">3 Titoli ad Alto Dividendo</span>
              <p class="text-sm text-gray-500 text-center">Selezione con yield elevato e payout sostenibile</p>
            </div>
          </button>

        </div>
      </div>
    </section>
  </body>
</html>
