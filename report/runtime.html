<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tradelia · Report Runtime</title>
  <link rel="icon" href="./favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== Base ===== */
    :root{--card-b:#fff;--card-br:#e5e7eb;--ink:#0f172a}
    html,body{height:100%}
    body{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:#f1f5f9 url('https://www.transparenttextures.com/patterns/cubes.png');
      background-size:280px; color:var(--ink)
    }
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:rgba(80,160,200,.4);border-radius:100vh}
    ::-webkit-scrollbar-thumb:hover{background:rgba(80,160,200,.6)}
    *{scrollbar-width:thin;scrollbar-color:rgba(80,160,200,.5) #e5e7eb}
    .hdr{backdrop-filter:saturate(1.2) blur(6px)}

    /* ===== Buttons ===== */
    .btn{display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .65rem;border-radius:.7rem;font-weight:600;font-size:14px;
      border:1px solid #e5e7eb;background:linear-gradient(#fff,#f8fafc);box-shadow:0 1px 0 rgba(2,6,23,.04), inset 0 -1px 0 rgba(2,6,23,.03);
      transition:transform .08s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease;-webkit-tap-highlight-color:transparent}
    .btn:hover{background:linear-gradient(#fff,#f1f5f9);border-color:#dbe3ea}
    .btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(0,0,0,.06)}
    .btn:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(56,189,248,.5)}
    .btn i{width:18px;height:18px}
    .sbtn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .65rem;border-radius:.7rem;border:1px solid #e5e7eb;background:#fff;
      font-weight:600;font-size:13px;transition:transform .08s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease}
    .sbtn:hover{background:#f8fafc;border-color:#dbe3ea}
    .sbtn:active{transform:translateY(1px)}
    .sbtn i{width:18px;height:18px}

    /* ===== Share animations ===== */
    @keyframes fadeBackdropIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeBackdropOut{from{opacity:1}to{opacity:0}}
    @keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes popOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(4px) scale(.985)}}
    .popup-backdrop{animation:fadeBackdropIn .18s ease forwards}
    .popup-backdrop.closing{animation:fadeBackdropOut .16s ease forwards}
    .popup-card{animation:popIn .20s cubic-bezier(.22,.61,.36,1) forwards}
    .popup-card.closing{animation:popOut .16s ease forwards}

    /* ===== Ticker header cards ===== */
    #header-ticker .card{border:1px solid var(--card-br);border-radius:.9rem;padding:.8rem;background:var(--card-b)}
    #header-ticker label{display:flex;align-items:center;gap:.45rem;font-size:11px;color:#64748b}
    #header-ticker .val{font-weight:700;color:var(--ink)}

    /* ===== Help “?” popup (unificato) ===== */
    .hx{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;
      border:1px solid rgba(2,132,199,.6);font-size:10px;line-height:1;color:#0369a1;background:#fff}
    .hx:hover{background:#f0f9ff}
    .hx-pop{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
      display:flex;align-items:center;justify-content:center;z-index:9999}
    .hx-card{position:relative;z-index:10000;background:#fff;border:1px solid #e5e7eb;border-radius:14px;
      padding:18px;max-width:620px;width:min(92%,620px);box-shadow:0 12px 34px rgba(0,0,0,.2)}
    .hx-card h3{margin:0 0 6px;font-weight:700;color:#0f172a}
    .hx-card .src{font-size:11px;color:#6b7280;margin-bottom:10px}
    .hx-card p,.hx-card li{line-height:1.45}

    /* ===== Module cards & drawer ===== */
    .mdc{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 1px 0 rgba(2,6,23,.04), inset 0 -1px 0 rgba(2,6,23,.02)}
    .mdc-h{background:linear-gradient(#fff,#fbfdff)}
    @media print{.noprint{display:none!important}}
    #mod-drawer aside{background:#ffffff;border-left:1px solid #e5e7eb;box-shadow:-8px 0 24px rgba(2,6,23,.10)}
    #drawer-body .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 1px 0 rgba(2,6,23,.04), inset 0 -1px 0 rgba(2,6,23,.02)}
    .sec-h{display:flex;align-items:center;gap:.5rem;font-weight:600;color:#0f172a;margin-bottom:.5rem}
    .sec-h i{width:18px;height:18px;color:#0284c7}

    /* ===== F1B visuals ===== */
    .f1b-kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
    @media(min-width:640px){.f1b-kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    .f1b-kpi{border:1px solid #e5e7eb;border-radius:.75rem;padding:.65rem;background:#fff}
    .f1b-kpi label{display:flex;align-items:center;gap:.35rem;font-size:11px;color:#64748b}
    .f1b-kpi .v{font-weight:700;color:#0f172a}
    .f1b-chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:.2rem .55rem;font-size:12px}
    .f1b-tag{display:inline-flex;align-items:center;gap:.35rem;border:1px dashed #cbd5e1;color:#0f172a;background:#f8fafc;border-radius:999px;padding:.15rem .55rem;font-size:12px}
    .f1b-badge{font-size:11px;padding:.12rem .5rem;border-radius:999px;border:1px solid}
    .f1b-badge--green{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
    .f1b-badge--yellow{color:#92400e;background:#fffbeb;border-color:#fcd34d}
    .f1b-badge--red{color:#7c2d12;background:#fef3c7;border-color:#fbbf24}
    .f1b-badge--neutral{color:#334155;background:#f1f5f9;border-color:#e5e7eb}
    .f1b-spark{display:block;width:100%;height:32px}

    /* ===== Mobile tweaks ===== */
    @media (max-width: 640px){
      .btn,.sbtn{ padding:.6rem .8rem; gap:.6rem; font-size:14px }
      #header-ticker .card{ padding:.7rem }
      #header-ticker label{ font-size:12px }
      #header-ticker .val{ font-size:15px }
      .f1b-kpi{ padding:.7rem }
      .f1b-chip,.f1b-tag{ font-size:13px; padding:.25rem .7rem }
      .hx{ width:18px; height:18px; font-size:11px }
      #mod-drawer aside{ width:100% !important }
    }

    /* ===== Tone badges (validazione colore) ===== */
    .tone{display:inline-flex;align-items:center;gap:.4rem;padding:.15rem .55rem;border-radius:999px;border:1px solid;font-size:12px;font-weight:600}
    .tone--green{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
    .tone--yellow{color:#92400e;background:#fffbeb;border-color:#fcd34d}
    .tone--red{color:#7c2d12;background:#fef3c7;border-color:#fbbf24}
    .tone--neutral{color:#334155;background:#f1f5f9;border-color:#e5e7eb}
  </style>
</head>

<body class="text-gray-900">
  <!-- HEADER -->
  <header class="hdr sticky top-0 z-50 bg-white/90 border-b border-slate-200 noprint">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 h-12 sm:h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <a href="/" class="shrink-0 text-lg sm:text-xl font-extrabold tracking-tight text-sky-900 hover:opacity-90 transition">
          <span class="text-slate-900">TRADELIA</span><span class="text-blue-600">&bull;AI</span>
        </a>
        <span class="text-slate-400 text-xs sm:text-sm truncate">Report Runtime</span>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-print" class="btn" aria-label="Stampa / PDF">
          <i data-lucide="printer" aria-hidden="true"></i><span class="hidden sm:inline">Stampa / PDF</span>
        </button>
        <button id="btn-share" class="btn" aria-label="Condividi">
          <i data-lucide="share-2" aria-hidden="true"></i><span class="hidden sm:inline">Condividi</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Share sheet (unico) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // Stampa
      document.getElementById('btn-print')?.addEventListener('click', () => window.print());

      // Condivisione
      document.getElementById('btn-share')?.addEventListener('click', async () => {
        const urlObj = new URL(window.location.href);
        if (!urlObj.searchParams.get('id')) urlObj.searchParams.set('id', 'sample-id');
        const longUrl = urlObj.toString();
        openShareSheet({ longUrl, title:'Tradelia · Report Runtime', text:'Guarda il report completo su Tradelia AI' });
      });

      // Shorten helper (is.gd)
      async function shortenUrl_isgd(longUrl, { timeoutMs = 5000 } = {}) {
        const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const api = `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`;
          const res = await fetch(api, { signal: ctrl.signal });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (data.shorturl) return data.shorturl;
          throw new Error(data.errormessage || 'is.gd error');
        } finally { clearTimeout(t); }
      }

      // Share popup unico
      function openShareSheet({ longUrl, title, text }) {
        const backdrop = document.createElement('div');
        backdrop.className = 'popup-backdrop fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-50';

        const card = document.createElement('div');
        card.className = 'popup-card bg-white rounded-xl shadow-2xl p-5 w-[92%] max-w-lg text-left border border-slate-200';

        let currentUrl = longUrl;
        const enc = encodeURIComponent;
        const targets = (u) => ([
          { label:'WhatsApp',   href:`https://wa.me/?text=${enc(text+' ') + enc(u)}`, icon:'message-square' },
          { label:'Telegram',   href:`https://t.me/share/url?url=${enc(u)}&text=${enc(text)}`, icon:'send' },
          { label:'X (Twitter)',href:`https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(u)}`, icon:'twitter' },
          { label:'LinkedIn',   href:`https://www.linkedin.com/sharing/share-offsite/?url=${enc(u)}`, icon:'linkedin' },
          { label:'Reddit',     href:`https://www.reddit.com/submit?url=${enc(u)}&title=${enc(title)}`, icon:'square' },
          { label:'Facebook',   href:`https://www.facebook.com/sharer/sharer.php?u=${enc(u)}`, icon:'facebook' },
          { label:'Email',      href:`mailto:?subject=${enc(title)}&body=${enc(text)}%0A%0A${enc(u)}`, icon:'mail' },
        ]);

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-3">
            <div>
              <h2 class="font-semibold text-slate-800 leading-tight">${title}</h2>
              <p class="text-xs text-slate-500 mt-0.5">Condividi il link del report</p>
            </div>
            <button id="closePopup" class="btn" aria-label="Chiudi">
              <i data-lucide="x"></i><span class="hidden sm:inline">Chiudi</span>
            </button>
          </div>
          <div class="flex items-center gap-2 mb-3">
            <label class="text-sm text-slate-700 flex items-center gap-2">
              <input id="useShort" type="checkbox" class="h-4 w-4 accent-sky-600">
              <span>Usa link breve (is.gd)</span>
            </label>
            <span id="shortStatus" class="text-xs text-slate-400">(non attivo)</span>
          </div>
          <div class="space-y-3 sm:space-y-4">
            <div class="mx-auto w-[180px]">
              <img id="qrImg" alt="QR per condivisione" class="w-full h-auto rounded-lg border border-slate-200 shadow-sm bg-white p-2"
                   src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(currentUrl)}" />
            </div>
            <div id="shareGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 justify-items-center sm:justify-items-start"></div>
            <div id="urlBox" class="bg-slate-50 border border-slate-200 text-[12px] p-2 rounded-md font-mono select-all break-all">${currentUrl}</div>
            <div class="flex gap-2">
              <button id="copyLink" class="sbtn"><i data-lucide="copy"></i><span>Copia link</span></button>
              <a id="openNew" class="sbtn" href="${currentUrl}" target="_blank" rel="noopener"><i data-lucide="external-link"></i><span>Apri</span></a>
            </div>
            <p class="text-[11px] text-slate-500">Suggerimento: usa i pulsanti sopra per aprire la condivisione del servizio scelto.</p>
          </div>
        `;

        const renderTargets = (u) => {
          const grid = card.querySelector('#shareGrid');
          grid.innerHTML = targets(u).map(t =>
            `<a class="sbtn" href="${t.href}" target="_blank" rel="noopener">
               <i data-lucide="${t.icon}"></i><span>${t.label}</span>
             </a>`).join('');
          lucide.createIcons();
        };

        const updateAll = (u) => {
          card.querySelector('#urlBox').textContent = u;
          card.querySelector('#openNew').href = u;
          card.querySelector('#qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(u)}`;
          renderTargets(u);
        };

        renderTargets(currentUrl);

        const close = () => {
          backdrop.classList.add('closing'); card.classList.add('closing');
          card.addEventListener('animationend', () => backdrop.remove(), { once: true });
        };
        backdrop.appendChild(card);
        document.body.appendChild(backdrop);
        lucide.createIcons();

        // Chiudi cliccando fuori o sul bottone
        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
        card.querySelector('#closePopup').addEventListener('click', close);

        // Copia link
        card.querySelector('#copyLink').addEventListener('click', async () => {
          try{
            await navigator.clipboard.writeText(card.querySelector('#urlBox').textContent);
            const btn = card.querySelector('#copyLink');
            btn.innerHTML = '<i data-lucide="check"></i><span>Copiato</span>';
            lucide.createIcons(); setTimeout(close, 900);
          }catch{
            const range = document.createRange(); range.selectNodeContents(card.querySelector('#urlBox'));
            const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
          }
        });

        // Switch short link
        let cachedShort = null;
        card.querySelector('#useShort').addEventListener('change', async (e) => {
          const shortStatus = card.querySelector('#shortStatus');
          if (e.target.checked) {
            shortStatus.textContent = 'creo link breve…'; shortStatus.className = 'text-xs text-sky-600';
            try {
              if (!cachedShort) cachedShort = await shortenUrl_isgd(longUrl);
              updateAll(cachedShort);
              shortStatus.textContent = 'attivo (is.gd)'; shortStatus.className = 'text-xs text-emerald-600';
            } catch {
              updateAll(longUrl); e.target.checked = false;
              shortStatus.textContent = 'non disponibile (fallback)'; shortStatus.className = 'text-xs text-amber-600';
            }
          } else {
            updateAll(longUrl);
            shortStatus.textContent = '(non attivo)'; shortStatus.className = 'text-xs text-slate-400';
          }
        });
      }
    });
  </script>

      </div>

  </section>
</main>

<!-- Binder: applica JSON ai campi + colori -->
<script>
(function(){
  const toneClass = (tone) => ({
    green:'bg-emerald-500',
    yellow:'bg-amber-400',
    red:'bg-rose-500',
    neutral:'bg-slate-300'
  }[(tone||'neutral').toLowerCase()] || 'bg-slate-300');

  // Regole di validazione -> tone
  function toneByConfidence(v){
    if (v==null || isNaN(v)) return 'neutral';
    if (v >= 0.80) return 'green';
    if (v >= 0.60) return 'yellow';
    return 'red';
  }
  function toneByFreshness(label){ // es. "T-0", "T-1", "T-2+"
    if (!label) return 'neutral';
    if (/T-0/i.test(label)) return 'green';
    if (/T-1/i.test(label)) return 'yellow';
    return 'red';
  }
  function toneBySimple01(v){ // OCR, DataIntegrity, FeedSync (0..1)
    if (v==null || isNaN(v)) return 'neutral';
    if (v >= 0.85) return 'green';
    if (v >= 0.65) return 'yellow';
    return 'red';
  }
  function toneByState(s){ // ACTIVE/HOLD/REVIEW
    const k=String(s||'').toUpperCase();
    if (k==='ACTIVE') return 'green';
    if (k==='REVIEW') return 'yellow';
    if (k==='HOLD') return 'red';
    return 'neutral';
  }

  // Applica value + barra colore per singolo campo
  function setField(key, { value, tone }){
    const valEl = document.querySelector(`[data-bind="value:${key}"]`);
    const toneEl = document.querySelector(`[data-bind="tone:${key}"]`);
    if (valEl) valEl.textContent = (value ?? '—');
    if (toneEl){
      // reset classi base + applica colore
      toneEl.className = 'absolute left-0 top-0 h-full w-1 rounded-l-md ' + toneClass(tone);
      toneEl.setAttribute('data-tone', tone);
    }
  }

  // API pubblica: passa qui il JSON completo
  function applyHeaderJSON(data){
    // mapping: campo -> value + tone rule
    setField('DataStart',     { value: data?.Start,        tone: 'neutral' });
    setField('DataEnd',       { value: data?.End,          tone: 'neutral' });
    setField('Ticker',        { value: data?.Ticker,       tone: 'neutral' });
    setField('Venue',         { value: data?.Venue,        tone: 'neutral' });

    const freshLabel = data?.FreshnessLabel ?? data?.Freshness; // es. "T-1"
    setField('Freshness',     { value: freshLabel,         tone: toneByFreshness(freshLabel) });

    const conf = Number(data?.ConfidenceFinal);
    setField('ConfidenceFinal',{ value: isFinite(conf)? conf.toFixed(2) : '—', tone: toneByConfidence(conf) });

    const ocr  = Number(data?.OCR_Conf);
    const di   = Number(data?.DataIntegrity);
    const fs   = Number(data?.FeedSync);
    setField('OCR_Conf',      { value: isFinite(ocr)? ocr.toFixed(2) : '—', tone: toneBySimple01(ocr) });
    setField('DataIntegrity', { value: isFinite(di)?  di.toFixed(2)  : '—', tone: toneBySimple01(di)  });
    setField('FeedSync',      { value: isFinite(fs)?  fs.toFixed(2)  : '—', tone: toneBySimple01(fs)  });

    const state = data?.State ?? data?.ReportState;
    setField('State',         { value: state || '—',       tone: toneByState(state) });
  }

  // Espone global per il tuo runtime
  window.Tradelia = window.Tradelia || {};
  window.Tradelia.HeaderJSON = { apply: applyHeaderJSON };

  // Placeholder demo (puoi rimuoverlo):
  // window.Tradelia.HeaderJSON.apply({
  //   Start: "2025-10-21 20:40", End: "2025-10-21 20:55",
  //   Ticker: "QYLD", Venue: "NASDAQ",
  //   FreshnessLabel: "T-1",
  //   ConfidenceFinal: 0.78,
  //   OCR_Conf: 0.91, DataIntegrity: 0.72, FeedSync: 0.58,
  //   State: "REVIEW"
  // });

})();
</script>

<script>
(function(){
  // Dizionario: chiave -> { t: titolo, a: descrizione, s: fonte }
  const HELP_DICT = {
    Sessione:{t:'Sessione REG (adjusted)', a:'Analisi sulla sola sessione regolare; serie prezzi adjusted per dividendi/split per coerenza storica.', s:'CMT Association; CFA Institute'},
    DataStart:{t:'Inizio report', a:'Timestamp locale di avvio analisi. Serve per audit e replicabilità.', s:'Audit trail interno'},
    DataEnd:{t:'Fine report', a:'Timestamp locale di chiusura analisi. Evita look-ahead bias.', s:'Audit trail interno'},
    Ticker:{t:'Ticker', a:'Simbolo ufficiale dello strumento sul venue primario.', s:'Nasdaq/NYSE; SEC 8-A'},
    Venue:{t:'Borsa di negoziazione', a:'MIC/venue primario di quotazione (no MTF).', s:'O’Hara; Hasbrouck'},
    Validazione:{t:'Validazione ticker/venue', a:'Cross-check simbolo ⇄ venue; ADR/dual listing.', s:'Data governance'},
    VersionTag:{t:'VersionTag', a:'Versione del motore/metodo per tracciabilità e audit.', s:'Governance interna'},
    SyncID:{t:'SyncID', a:'Chiave audit: <TICKER>_<YYYYMMDD>_F*.', s:'Audit trail'},
    Freshness:{t:'Freshness', a:'Freschezza dati rispetto alla validazione locale (es. T-0, T-1).', s:'Policy qualità'},
    OCR_Conf:{t:'OCR_Conf', a:'Attendibilità estrazione numerica (0–1). >0.85 buono.', s:'Kahn & Strong; Pipino'},
    DataIntegrity:{t:'DataIntegrity', a:'Completezza/consistenza dataset (0–1). >0.85 buono.', s:'Kahn & Strong; Pipino'},
    FeedSync:{t:'FeedSync', a:'Allineamento temporale tra pannelli/feed (0–1).', s:'Hasbrouck'},
    ConfidenceFinal:{t:'Affidabilità complessiva', a:'Metrica conservativa: MIN(OCR_Conf, DataIntegrity, FeedSync, conf H4, conf H1).', s:'Metodo interno'},
    StatoReport:{t:'Stato report', a:'ACTIVE / REVIEW / HOLD secondo soglie qualità e copertura input.', s:'Policy interna'},
    TapeNotes:{t:'TapeNotes', a:'Note micro-strutturali sull’asta di chiusura REG.', s:'Hasbrouck; O’Hara'},
    Missing:{t:'Missing (critici)', a:'Campi critici mancanti ⇒ N/D; se impattano la confidence ⇒ HOLD.', s:'Policy N/D'}
  };

  // Modulo popup unico (evita doppi trigger anche dentro drawer/overlay)
  const HelpX = {
    dict: Object.assign(Object.create(null), HELP_DICT),
    _pop: null, _prevOverflow:'',
    open(key){
      const d = this.dict[key] || { t:key, a:'Descrizione non disponibile.', s:'—' };
      if (this._pop) {
        this._pop.h.textContent = d.t;
        this._pop.src.textContent = 'Fonte: ' + d.s;
        this._pop.text.innerHTML = d.a;
        this._pop.wrap.focus();
        return;
      }
      const wrap = document.createElement('div');
      wrap.className = 'hx-pop'; wrap.role='dialog'; wrap.ariaModal='true'; wrap.tabIndex=-1;

      const card = document.createElement('div');
      card.className = 'hx-card';
      card.addEventListener('click', ev => ev.stopPropagation()); // non chiudere clic interno

      const h = document.createElement('h3'); h.textContent = d.t;
      const src = document.createElement('div'); src.className='src'; src.textContent='Fonte: ' + d.s;
      const text = document.createElement('div'); text.className='text-sm text-slate-800'; text.innerHTML = d.a;

      card.append(h, src, text); wrap.append(card); document.body.appendChild(wrap);

      // lock scroll
      this._prevOverflow = document.documentElement.style.overflow || '';
      document.documentElement.style.overflow = 'hidden';

      const close = () => this.close();
      wrap.addEventListener('click', (e)=> { if (e.target === e.currentTarget) close(); });
      document.addEventListener('keydown', this._onEsc = (e)=> {
        if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); close(); }
      }, true);

      wrap.focus();
      this._pop = { wrap, card, h, src, text, close };
    },
    close(){
      if (!this._pop) return;
      const { wrap } = this._pop;
      document.removeEventListener('keydown', this._onEsc, true);
      document.documentElement.style.overflow = this._prevOverflow;
      wrap.remove();
      this._pop = null;
    }
  };

  // Listener UNICO, in capturing, per tutti i bottoni .hx
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.hx');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();               // <-- niente doppi popup in overlay/drawer
    const k = btn.getAttribute('data-k');
    HelpX.open(k);
  }, true);

  // Espone global (se devi aggiungere voci a runtime)
  window.Tradelia = window.Tradelia || {};
  window.Tradelia.HelpX = HelpX;
})();
</script>
