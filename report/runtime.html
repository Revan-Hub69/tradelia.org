<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tradelia · Report Runtime</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    body{
      font-family:'Inter',sans-serif;
      background:#f1f5f9 url('https://www.transparenttextures.com/patterns/cubes.png');
      background-size:280px; color:#0f172a;
    }
    /* Pulsanti compatti + effetto push */
    .btn {
      display:inline-flex; align-items:center; gap:.45rem;
      padding:.4rem .6rem; border-radius:.6rem; font-weight:600; font-size:14px;
      border:1px solid #e5e7eb; background:linear-gradient(#fff,#f8fafc);
      box-shadow:0 1px 0 rgba(2,6,23,.04), inset 0 -1px 0 rgba(2,6,23,.03);
      transition:transform .08s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{ background:linear-gradient(#fff,#f1f5f9); border-color:#dbe3ea; }
    .btn:active{ transform:translateY(1px); box-shadow:inset 0 1px 0 rgba(0,0,0,.06); }
    .btn:focus-visible{ outline:none; box-shadow:0 0 0 2px rgba(56,189,248,.5); }
    .btn-primary{ color:#0b2a3f; }
    .btn i{ width:18px; height:18px; }

    /* Header compatto su mobile */
    .hdr { backdrop-filter:saturate(1.2) blur(6px); }

    /* Animazioni popup desktop */
    @keyframes fadeBackdropIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fadeBackdropOut { from { opacity: 1 } to { opacity: 0 } }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px) scale(.98) }
      to   { opacity: 1; transform: translateY(0) scale(1) }
    }
    @keyframes popOut {
      from { opacity: 1; transform: translateY(0) scale(1) }
      to   { opacity: 0; transform: translateY(4px) scale(.985) }
    }
    .popup-backdrop { animation: fadeBackdropIn .18s ease forwards; }
    .popup-backdrop.closing { animation: fadeBackdropOut .16s ease forwards; }
    .popup-card { animation: popIn .20s cubic-bezier(.22,.61,.36,1) forwards; }
    .popup-card.closing { animation: popOut .16s ease forwards; }

    @media print { .noprint{display:none!important} }
  </style>
</head>

<body class="text-gray-900">
  <header class="hdr sticky top-0 z-50 bg-white/90 border-b border-slate-200 noprint">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 h-12 sm:h-14 flex items-center justify-between">
      <!-- Brand + titolo -->
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <a href="/index.html" class="shrink-0 text-lg sm:text-xl font-extrabold tracking-tight text-sky-900 hover:opacity-90 transition">
          <span class="text-slate-900">TRADELIA</span><span class="text-blue-600">&bull;AI</span>
        </a>
        <span class="text-slate-400 text-xs sm:text-sm truncate">Report Runtime</span>
      </div>

      <!-- Azioni (icone su mobile, testo da sm+) -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-print" class="btn btn-primary" aria-label="Stampa / PDF">
          <i data-lucide="printer" aria-hidden="true"></i><span class="hidden sm:inline">Stampa / PDF</span>
        </button>
        <button id="btn-share" class="btn btn-primary" aria-label="Condividi">
          <i data-lucide="share-2" aria-hidden="true"></i><span class="hidden sm:inline">Condividi</span>
        </button>
      </div>
    </div>
  </header>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const btnPrint = document.getElementById('btn-print');
      const btnShare = document.getElementById('btn-share');

      btnPrint?.addEventListener('click', () => window.print());

      btnShare?.addEventListener('click', async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') || 'sample-qyld-2025-10-20';
        const url = `https://tradelia.org/report/runtime.html?id=${id}`;

        const isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);

        // 📱 mobile: share nativa se disponibile
        if (isMobile && navigator.share) {
          try {
            await navigator.share({
              title: 'Tradelia · Report Runtime',
              text: 'Guarda il report completo su Tradelia AI',
              url
            });
            return;
          } catch (_) { /* utente annulla */ }
        }

        // 💻 desktop (o mobile senza share nativa): popup elegante con animazioni
        openSharePopup(url);
      });

      function openSharePopup(url) {
        const backdrop = document.createElement('div');
        backdrop.className =
          'popup-backdrop fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-50';

        const card = document.createElement('div');
        card.className =
          'popup-card bg-white rounded-xl shadow-2xl p-5 w-[92%] max-w-sm text-center border border-slate-200';

        card.innerHTML = `
          <h2 class="font-semibold text-slate-800 mb-2">Condividi report</h2>
          <p class="text-sm text-slate-600 mb-4">Copia il link e invialo dove preferisci:</p>
          <div class="bg-slate-50 border border-slate-200 text-[12px] p-2 rounded-md font-mono mb-4 select-all break-all">${url}</div>
          <div class="flex justify-center gap-3">
            <button id="copyLink" class="btn bg-blue-50 border-blue-200 text-blue-700">
              <i data-lucide="copy"></i><span class="hidden sm:inline">Copia link</span>
            </button>
            <button id="closePopup" class="btn border-slate-300">
              <i data-lucide="x"></i><span class="hidden sm:inline">Chiudi</span>
            </button>
          </div>
        `;

        backdrop.appendChild(card);
        document.body.appendChild(backdrop);
        lucide.createIcons();

        const close = () => {
          backdrop.classList.add('closing');
          card.classList.add('closing');
          card.addEventListener('animationend', () => backdrop.remove(), { once: true });
        };

        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
        card.querySelector('#closePopup').addEventListener('click', close);

        card.querySelector('#copyLink').addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(url);
            const btn = card.querySelector('#copyLink');
            btn.innerHTML = '<i data-lucide="check"></i><span class="hidden sm:inline">Copiato</span>';
            lucide.createIcons();
            setTimeout(close, 900);
          } catch {
            // fallback minimo: selezione del testo
            const selection = window.getSelection();
            const range = document.createRange();
            const box = card.querySelector('div.font-mono');
            range.selectNodeContents(box);
            selection.removeAllRanges();
            selection.addRange(range);
          }
        });
      }
    });
  </script>
