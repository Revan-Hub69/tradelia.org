<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tradelia · Report Runtime</title>
  <link rel="icon" href="./favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== Base ===== */
    :root{--card-b:#fff;--card-br:#e5e7eb;--ink:#0f172a}
    html,body{height:100%}
    body{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:#f1f5f9 url('https://www.transparenttextures.com/patterns/cubes.png');
      background-size:280px; color:var(--ink)
    }
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:rgba(80,160,200,.4);border-radius:100vh}
    ::-webkit-scrollbar-thumb:hover{background:rgba(80,160,200,.6)}
    *{scrollbar-width:thin;scrollbar-color:rgba(80,160,200,.5) #e5e7eb}
    .hdr{backdrop-filter:saturate(1.2) blur(6px)}

    /* ===== Buttons ===== */
    .btn{display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .65rem;border-radius:.7rem;font-weight:600;font-size:14px;
      border:1px solid #e5e7eb;background:linear-gradient(#fff,#f8fafc);box-shadow:0 1px 0 rgba(2,6,23,.04), inset 0 -1px 0 rgba(2,6,23,.03);
      transition:transform .08s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease;-webkit-tap-highlight-color:transparent}
    .btn:hover{background:linear-gradient(#fff,#f1f5f9);border-color:#dbe3ea}
    .btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(0,0,0,.06)}
    .btn:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(56,189,248,.5)}
    .btn i{width:18px;height:18px}
    .sbtn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .65rem;border-radius:.7rem;border:1px solid #e5e7eb;background:#fff;
      font-weight:600;font-size:13px;transition:transform .08s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease}
    .sbtn:hover{background:#f8fafc;border-color:#dbe3ea}
    .sbtn:active{transform:translateY(1px)}
    .sbtn i{width:18px;height:18px}

    /* ===== Share animations ===== */
    @keyframes fadeBackdropIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeBackdropOut{from{opacity:1}to{opacity:0}}
    @keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes popOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(4px) scale(.985)}}
    .popup-backdrop{animation:fadeBackdropIn .18s ease forwards}
    .popup-backdrop.closing{animation:fadeBackdropOut .16s ease forwards}
    .popup-card{animation:popIn .20s cubic-bezier(.22,.61,.36,1) forwards}
    .popup-card.closing{animation:popOut .16s ease forwards}

    /* ===== Ticker header cards ===== */
    #header-ticker .card{border:1px solid var(--card-br);border-radius:.9rem;padding:.8rem;background:var(--card-b)}
    #header-ticker label{display:flex;align-items:center;gap:.45rem;font-size:11px;color:#64748b}
    #header-ticker .val{font-weight:700;color:var(--ink)}

    /* ===== Help “?” popup (unificato) ===== */
    .hx{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;
      border:1px solid rgba(2,132,199,.6);font-size:10px;line-height:1;color:#0369a1;background:#fff}
    .hx:hover{background:#f0f9ff}
    .hx-pop{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
      display:flex;align-items:center;justify-content:center;z-index:9999}
    .hx-card{position:relative;z-index:10000;background:#fff;border:1px solid #e5e7eb;border-radius:14px;
      padding:18px;max-width:620px;width:min(92%,620px);box-shadow:0 12px 34px rgba(0,0,0,.2)}
    .hx-card h3{margin:0 0 6px;font-weight:700;color:#0f172a}
    .hx-card .src{font-size:11px;color:#6b7280;margin-bottom:10px}
    .hx-card p,.hx-card li{line-height:1.45}

    /* ===== Module cards & drawer ===== */
    .mdc{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 1px 0 rgba(2,6,23,.04), inset 0 -1px 0 rgba(2,6,23,.02)}
    .mdc-h{background:linear-gradient(#fff,#fbfdff)}
    @media print{.noprint{display:none!important}}
    #mod-drawer aside{background:#ffffff;border-left:1px solid #e5e7eb;box-shadow:-8px 0 24px rgba(2,6,23,.10)}
    #drawer-body .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 1px 0 rgba(2,6,23,.04), inset 0 -1px 0 rgba(2,6,23,.02)}
    .sec-h{display:flex;align-items:center;gap:.5rem;font-weight:600;color:#0f172a;margin-bottom:.5rem}
    .sec-h i{width:18px;height:18px;color:#0284c7}

    /* ===== F1B visuals ===== */
    .f1b-kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
    @media(min-width:640px){.f1b-kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    .f1b-kpi{border:1px solid #e5e7eb;border-radius:.75rem;padding:.65rem;background:#fff}
    .f1b-kpi label{display:flex;align-items:center;gap:.35rem;font-size:11px;color:#64748b}
    .f1b-kpi .v{font-weight:700;color:#0f172a}
    .f1b-chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:.2rem .55rem;font-size:12px}
    .f1b-tag{display:inline-flex;align-items:center;gap:.35rem;border:1px dashed #cbd5e1;color:#0f172a;background:#f8fafc;border-radius:999px;padding:.15rem .55rem;font-size:12px}
    .f1b-badge{font-size:11px;padding:.12rem .5rem;border-radius:999px;border:1px solid}
    .f1b-badge--green{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
    .f1b-badge--yellow{color:#92400e;background:#fffbeb;border-color:#fcd34d}
    .f1b-badge--red{color:#7c2d12;background:#fef3c7;border-color:#fbbf24}
    .f1b-badge--neutral{color:#334155;background:#f1f5f9;border-color:#e5e7eb}
    .f1b-spark{display:block;width:100%;height:32px}

    /* ===== Mobile tweaks ===== */
    @media (max-width: 640px){
      .btn,.sbtn{ padding:.6rem .8rem; gap:.6rem; font-size:14px }
      #header-ticker .card{ padding:.7rem }
      #header-ticker label{ font-size:12px }
      #header-ticker .val{ font-size:15px }
      .f1b-kpi{ padding:.7rem }
      .f1b-chip,.f1b-tag{ font-size:13px; padding:.25rem .7rem }
      .hx{ width:18px; height:18px; font-size:11px }
      #mod-drawer aside{ width:100% !important }
    }

    /* ===== Tone badges (validazione colore) ===== */
    .tone{display:inline-flex;align-items:center;gap:.4rem;padding:.15rem .55rem;border-radius:999px;border:1px solid;font-size:12px;font-weight:600}
    .tone--green{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
    .tone--yellow{color:#92400e;background:#fffbeb;border-color:#fcd34d}
    .tone--red{color:#7c2d12;background:#fef3c7;border-color:#fbbf24}
    .tone--neutral{color:#334155;background:#f1f5f9;border-color:#e5e7eb}
  </style>
</head>

<body class="text-gray-900">
  <!-- HEADER -->
  <header class="hdr sticky top-0 z-50 bg-white/90 border-b border-slate-200 noprint">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 h-12 sm:h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <a href="/" class="shrink-0 text-lg sm:text-xl font-extrabold tracking-tight text-sky-900 hover:opacity-90 transition">
          <span class="text-slate-900">TRADELIA</span><span class="text-blue-600">&bull;AI</span>
        </a>
        <span class="text-slate-400 text-xs sm:text-sm truncate">Report Runtime</span>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-print" class="btn" aria-label="Stampa / PDF">
          <i data-lucide="printer" aria-hidden="true"></i><span class="hidden sm:inline">Stampa / PDF</span>
        </button>
        <button id="btn-share" class="btn" aria-label="Condividi">
          <i data-lucide="share-2" aria-hidden="true"></i><span class="hidden sm:inline">Condividi</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Share sheet (unico) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // Stampa
      document.getElementById('btn-print')?.addEventListener('click', () => window.print());

      // Condivisione
      document.getElementById('btn-share')?.addEventListener('click', async () => {
        const urlObj = new URL(window.location.href);
        if (!urlObj.searchParams.get('id')) urlObj.searchParams.set('id', 'sample-id');
        const longUrl = urlObj.toString();
        openShareSheet({ longUrl, title:'Tradelia · Report Runtime', text:'Guarda il report completo su Tradelia AI' });
      });

      // Shorten helper (is.gd)
      async function shortenUrl_isgd(longUrl, { timeoutMs = 5000 } = {}) {
        const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const api = `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`;
          const res = await fetch(api, { signal: ctrl.signal });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (data.shorturl) return data.shorturl;
          throw new Error(data.errormessage || 'is.gd error');
        } finally { clearTimeout(t); }
      }

      // Share popup unico
      function openShareSheet({ longUrl, title, text }) {
        const backdrop = document.createElement('div');
        backdrop.className = 'popup-backdrop fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-50';

        const card = document.createElement('div');
        card.className = 'popup-card bg-white rounded-xl shadow-2xl p-5 w-[92%] max-w-lg text-left border border-slate-200';

        let currentUrl = longUrl;
        const enc = encodeURIComponent;
        const targets = (u) => ([
          { label:'WhatsApp',   href:`https://wa.me/?text=${enc(text+' ') + enc(u)}`, icon:'message-square' },
          { label:'Telegram',   href:`https://t.me/share/url?url=${enc(u)}&text=${enc(text)}`, icon:'send' },
          { label:'X (Twitter)',href:`https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(u)}`, icon:'twitter' },
          { label:'LinkedIn',   href:`https://www.linkedin.com/sharing/share-offsite/?url=${enc(u)}`, icon:'linkedin' },
          { label:'Reddit',     href:`https://www.reddit.com/submit?url=${enc(u)}&title=${enc(title)}`, icon:'square' },
          { label:'Facebook',   href:`https://www.facebook.com/sharer/sharer.php?u=${enc(u)}`, icon:'facebook' },
          { label:'Email',      href:`mailto:?subject=${enc(title)}&body=${enc(text)}%0A%0A${enc(u)}`, icon:'mail' },
        ]);

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-3">
            <div>
              <h2 class="font-semibold text-slate-800 leading-tight">${title}</h2>
              <p class="text-xs text-slate-500 mt-0.5">Condividi il link del report</p>
            </div>
            <button id="closePopup" class="btn" aria-label="Chiudi">
              <i data-lucide="x"></i><span class="hidden sm:inline">Chiudi</span>
            </button>
          </div>
          <div class="flex items-center gap-2 mb-3">
            <label class="text-sm text-slate-700 flex items-center gap-2">
              <input id="useShort" type="checkbox" class="h-4 w-4 accent-sky-600">
              <span>Usa link breve (is.gd)</span>
            </label>
            <span id="shortStatus" class="text-xs text-slate-400">(non attivo)</span>
          </div>
          <div class="space-y-3 sm:space-y-4">
            <div class="mx-auto w-[180px]">
              <img id="qrImg" alt="QR per condivisione" class="w-full h-auto rounded-lg border border-slate-200 shadow-sm bg-white p-2"
                   src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(currentUrl)}" />
            </div>
            <div id="shareGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 justify-items-center sm:justify-items-start"></div>
            <div id="urlBox" class="bg-slate-50 border border-slate-200 text-[12px] p-2 rounded-md font-mono select-all break-all">${currentUrl}</div>
            <div class="flex gap-2">
              <button id="copyLink" class="sbtn"><i data-lucide="copy"></i><span>Copia link</span></button>
              <a id="openNew" class="sbtn" href="${currentUrl}" target="_blank" rel="noopener"><i data-lucide="external-link"></i><span>Apri</span></a>
            </div>
            <p class="text-[11px] text-slate-500">Suggerimento: usa i pulsanti sopra per aprire la condivisione del servizio scelto.</p>
          </div>
        `;

        const renderTargets = (u) => {
          const grid = card.querySelector('#shareGrid');
          grid.innerHTML = targets(u).map(t =>
            `<a class="sbtn" href="${t.href}" target="_blank" rel="noopener">
               <i data-lucide="${t.icon}"></i><span>${t.label}</span>
             </a>`).join('');
          lucide.createIcons();
        };

        const updateAll = (u) => {
          card.querySelector('#urlBox').textContent = u;
          card.querySelector('#openNew').href = u;
          card.querySelector('#qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(u)}`;
          renderTargets(u);
        };

        renderTargets(currentUrl);

        const close = () => {
          backdrop.classList.add('closing'); card.classList.add('closing');
          card.addEventListener('animationend', () => backdrop.remove(), { once: true });
        };
        backdrop.appendChild(card);
        document.body.appendChild(backdrop);
        lucide.createIcons();

        // Chiudi cliccando fuori o sul bottone
        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
        card.querySelector('#closePopup').addEventListener('click', close);

        // Copia link
        card.querySelector('#copyLink').addEventListener('click', async () => {
          try{
            await navigator.clipboard.writeText(card.querySelector('#urlBox').textContent);
            const btn = card.querySelector('#copyLink');
            btn.innerHTML = '<i data-lucide="check"></i><span>Copiato</span>';
            lucide.createIcons(); setTimeout(close, 900);
          }catch{
            const range = document.createRange(); range.selectNodeContents(card.querySelector('#urlBox'));
            const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
          }
        });

        // Switch short link
        let cachedShort = null;
        card.querySelector('#useShort').addEventListener('change', async (e) => {
          const shortStatus = card.querySelector('#shortStatus');
          if (e.target.checked) {
            shortStatus.textContent = 'creo link breve…'; shortStatus.className = 'text-xs text-sky-600';
            try {
              if (!cachedShort) cachedShort = await shortenUrl_isgd(longUrl);
              updateAll(cachedShort);
              shortStatus.textContent = 'attivo (is.gd)'; shortStatus.className = 'text-xs text-emerald-600';
            } catch {
              updateAll(longUrl); e.target.checked = false;
              shortStatus.textContent = 'non disponibile (fallback)'; shortStatus.className = 'text-xs text-amber-600';
            }
          } else {
            updateAll(longUrl);
            shortStatus.textContent = '(non attivo)'; shortStatus.className = 'text-xs text-slate-400';
          }
        });
      }
    });
  </script>

<!-- Binder: applica JSON ai campi + colori -->
<script>
(function(){
  const toneToClass = (tone)=>({
    green:'tone-g', yellow:'tone-y', red:'tone-r', neutral:'tone-n'
  }[(tone||'neutral').toLowerCase()]||'tone-n');

  // Regole → tone
  const toneByConfidence = (v)=> (v==null||isNaN(v))?'neutral': v>=0.80?'green': v>=0.60?'yellow':'red';
  const toneByFreshness  = (label)=> !label?'neutral': /T-0/i.test(label)?'green': /T-1/i.test(label)?'yellow':'red';
  const toneBySimple01   = (v)=> (v==null||isNaN(v))?'neutral': v>=0.85?'green': v>=0.65?'yellow':'red';
  const toneByState      = (s)=>({ACTIVE:'green',REVIEW:'yellow',HOLD:'red'})[(String(s||'').toUpperCase())]||'neutral';

  function setField(key, { value, tone }){
    const valEl  = document.querySelector(`[data-bind="value:${key}"]`);
    const toneEl = document.querySelector(`[data-bind="tone:${key}"]`);
    if (valEl) valEl.textContent = (value ?? '—');
    if (toneEl){
      toneEl.className = 'tonebar ' + toneToClass(tone);
      toneEl.setAttribute('data-tone', tone);
    }
  }

  function applyHeaderJSON(data){
    setField('DataStart', { value: data?.Start, tone:'neutral' });
    setField('DataEnd',   { value: data?.End,   tone:'neutral' });
    setField('Ticker',    { value: data?.Ticker, tone:'neutral' });
    setField('Venue',     { value: data?.Venue,  tone:'neutral' });

    const freshLabel = data?.FreshnessLabel ?? data?.Freshness;
    setField('Freshness', { value: freshLabel, tone: toneByFreshness(freshLabel) });

    const conf = Number(data?.ConfidenceFinal);
    setField('ConfidenceFinal',{ value: isFinite(conf)? conf.toFixed(2):'—', tone: toneByConfidence(conf) });

    const ocr=Number(data?.OCR_Conf), di=Number(data?.DataIntegrity), fs=Number(data?.FeedSync);
    setField('OCR_Conf',      { value:isFinite(ocr)?ocr.toFixed(2):'—', tone:toneBySimple01(ocr) });
    setField('DataIntegrity', { value:isFinite(di)? di.toFixed(2): '—', tone:toneBySimple01(di)  });
    setField('FeedSync',      { value:isFinite(fs)? fs.toFixed(2): '—', tone:toneBySimple01(fs)  });

    const state = data?.State ?? data?.ReportState;
    setField('State', { value: state || '—', tone: toneByState(state) });
  }

  window.Tradelia = window.Tradelia || {};
  window.Tradelia.HeaderJSON = { apply: applyHeaderJSON };
})();
</script>

    const onEsc=(e)=>{ if(e.key==='Escape'){ e.stopPropagation(); e.preventDefault(); closePop(); } };

  }, true);

  window.Tradelia = window.Tradelia || {};
  window.Tradelia.HelpX = HelpX;
})();
</script>

    drawer.classList.remove('hidden');

    if (isMobile()){
      requestAnimationFrame(()=> panel.style.transform='translateY(0)');

    if (isMobile()){

    } else {
      panel.style.transform='translateX(100%)';
    }
    panel.addEventListener('transitionend', ()=> drawer.classList.add('hidden'), {once:true});

  drawer?.addEventListener('click', (e)=>{ if(e.target.dataset.close==='backdrop') closeDrawer(); });

  window.Tradelia = window.Tradelia || {};

  if (window.lucide) lucide.createIcons();
})();

<script>
(function(){
  // Utils
  const $ = (s,root=document)=> root.querySelector(s);
  const badgeMap = {
    green:'f1b-badge f1b-badge--green',
    yellow:'f1b-badge f1b-badge--yellow',
    red:'f1b-badge f1b-badge--red',
    neutral:'f1b-badge f1b-badge--neutral'
  };
  const toneByVIX = (v)=> (v==null||isNaN(v))?'neutral': v<15?'green': v<=22?'yellow':'red';
  const dotClass = (t)=> ({green:'f1b-dot dot-g',yellow:'f1b-dot dot-y',red:'f1b-dot dot-r',neutral:'f1b-dot dot-n'}[t]||'f1b-dot dot-n');

  // Sparkline minimal (exported for drawer)
  function sparkline(svgEl, values){
    if(!svgEl) return;
    svgEl.innerHTML='';
    if(!Array.isArray(values)||values.length<2) return;
    const w=100,h=32,p=2,min=Math.min(...values),max=Math.max(...values),rng=(max-min)||1;
    const d=values.map((v,i)=>{
      const x=p+(w-2*p)*(i/(values.length-1));
      const y=h-p-(h-2*p)*((v-min)/rng);
      return (i?'L':'M')+x.toFixed(2)+','+y.toFixed(2);
    }).join(' ');
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d); path.setAttribute('fill','none');
    path.setAttribute('stroke','#0284c7'); path.setAttribute('stroke-width','1.4');
    svgEl.appendChild(path);
  }

  function setBadge(el, badge){
    if(!el) return;
    const color = (badge && badge.color) || 'neutral';
    el.className = badgeMap[color]||badgeMap.neutral;
    el.textContent = (badge && badge.label) || el.textContent || '—';
  }

  /** ======== COMPOSE SUMMARY (fallback) ======== */
  function buildSummary(m){
    const pre = m?.Meta?.Summary || m?.Summary?.Text;
    if (pre && String(pre).trim().length) return String(pre).trim();

    const mode = m?.Metrics?.Classification?.StrategyMode || '—';
    const rs   = m?.Metrics?.RegimeScore?.score;
    const fs   = m?.Metrics?.FlowScore?.score;
    const br   = m?.Metrics?.Breadth1M?.label;
    const rt   = m?.Metrics?.RiskTilt?.label;
    const vixL = m?.UI?.Display?.VIX_Label ?? m?.Inputs?.VIX_Close_T1;

    const bits = [];
    bits.push(`Il modulo macro favorisce **${mode}**${(rs!=null)?` (RegimeScore ${Number(rs).toFixed(2)})`:''}.`);
    if (fs!=null) bits.push(`Il **FlowScore** è ${Number(fs).toFixed(2)}; ${rt?`il **Risk Tilt** è ${rt.toLowerCase()}`:'rotazione neutra'}.`);
    if (br) bits.push(`La **breadth 1M** risulta ${br.toLowerCase()}.`);
    if (vixL!=null) bits.push(`Il **VIX** è ${typeof vixL==='number'? vixL.toFixed(2): vixL}.`);
    bits.push(`Consultare le tab per dettagli, input settoriali e note di audit.`);

    return bits.join(' ');
  }

  /* ========= BINDER CARD (ultra-compatta) ========= */
  function bindF1BCard(card, m){
    $('[data-f1b="kpi-mode"]',card).textContent = m?.Metrics?.Classification?.StrategyMode ?? '—';
    if(m?.Meta?.StateBadge){ setBadge($('[data-f1b="state-badge"]',card), m.Meta.StateBadge); }

    // Micro chip desktop: VIX dot + Breadth label
    const vixVal = m?.Inputs?.VIX_Close_T1;
    const vixTone= toneByVIX(vixVal);
    const chipVix= $('[data-f1b="chip-vix"]',card);
    if (chipVix){
      chipVix.innerHTML = `<span class="${dotClass(vixTone)}" aria-hidden="true"></span> VIX ${ (typeof vixVal==='number') ? vixVal.toFixed(2) : (m?.UI?.Display?.VIX_Label ?? '—') }`;
    }
    const chipBr = $('[data-f1b="chip-breadth"]',card);
    if (chipBr){
      chipBr.textContent = `Breadth ${m?.Metrics?.Breadth1M?.label ?? '—'}`;
    }

    // Drawer open
    $('[data-f1b="open"]',card).onclick=(ev)=>{
      ev.stopPropagation();
      if (window.Tradelia?.openDrawer) window.Tradelia.openDrawer();
      renderF1BDrawer(m); // con tabs + resoconto
    };

    if (window.lucide) lucide.createIcons();
  }

  /* ========= DRAWER A TAB + RESOCONTO ========= */
  function renderF1BDrawer(m){
    const body = document.getElementById('drawer-body');
    document.getElementById('drawer-title').textContent = 'F1B — Screening Macro-Settoriale';
    document.getElementById('drawer-sub').textContent   = 'Rotazione · Volatilità · Regime';

    const fmt=(x,d=2)=> (x==null||x==='—') ? '—' : (typeof x==='number'? x.toFixed(d):x);
    const rows=(m?.Inputs?.SectorETFs||[]).map(r=>`
      <tr class="border-b last:border-0 hover:bg-slate-50/60">
        <td class="py-1 pr-2 font-semibold">${r.ticker||'—'}</td>
        <td class="py-1 pr-2">${r.name||'—'}</td>
        <td class="py-1 pr-2 text-slate-500">${r.group||'—'}</td>
        <td class="py-1 pr-2 text-right">${fmt(r.perf_1m_pct,2)}%</td>
        <td class="py-1 pr-2 text-right">${fmt(r.flow_5d_usd_M,2)} M</td>
        <td class="py-1 text-right">${r.rank_flow_5d??'—'}</td>
      </tr>`).join('');

    const summaryText = buildSummary(m);

    body.innerHTML = `
      <div class="space-y-3">
        <div class="tabbar noprint">
          <button class="sbtn" data-tab="#f1b-ov" aria-pressed="true"><i data-lucide="layout-grid"></i><span>Overview</span></button>
          <button class="sbtn" data-tab="#f1b-mx" aria-pressed="false"><i data-lucide="activity"></i><span>Metriche</span></button>
          <button class="sbtn" data-tab="#f1b-le" aria-pressed="false"><i data-lucide="layers"></i><span>Leadership</span></button>
          <button class="sbtn" data-tab="#f1b-se" aria-pressed="false"><i data-lucide="chart-line"></i><span>Serie</span></button>
          <button class="sbtn" data-tab="#f1b-in" aria-pressed="false"><i data-lucide="table-2"></i><span>Inputs</span></button>
          <button class="sbtn" data-tab="#f1b-au" aria-pressed="false"><i data-lucide="badge-check"></i><span>Audit</span></button>
          <button class="sbtn" data-tab="#f1b-rs" aria-pressed="false"><i data-lucide="notes"></i><span>Resoconto</span></button>
        </div>

        <!-- OVERVIEW -->
        <section id="f1b-ov" class="tab-sec active">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-2">
            <div class="card p-3">
              <div class="sec-h"><i data-lucide="sparkles"></i><span>Classificazione</span></div>
              <div><b>StrategyMode:</b> ${m?.Metrics?.Classification?.StrategyMode||'—'} <button class="hx" data-k="F1B_Mode">?</button></div>
              <div class="mt-1"><b>RegimeScore:</b> ${fmt(m?.Metrics?.RegimeScore?.score)} <button class="hx" data-k="F1B_Regime">?</button></div>
              <div class="mt-1"><b>FlowScore:</b> ${fmt(m?.Metrics?.FlowScore?.score)} <button class="hx" data-k="F1B_FlowScore">?</button></div>
            </div>
            <div class="card p-3">
              <div class="sec-h"><i data-lucide="list-tree"></i><span>Read-through</span></div>
              <div class="text-sm text-slate-700 leading-relaxed">
                ${summaryText}
              </div>
            </div>
          </div>
        </section>

        <!-- METRICHE -->
        <section id="f1b-mx" class="tab-sec">
          <div class="card p-3">
            <div class="sec-h"><i data-lucide="activity"></i><span>Metriche & Stato</span></div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div class="f1b-kpi"><label>VIX <button class="hx" data-k="F1B_VIX">?</button></label><div class="v">${m?.UI?.Display?.VIX_Label ?? m?.Inputs?.VIX_Close_T1 ?? '—'}</div></div>
              <div class="f1b-kpi"><label>Breadth 1M <button class="hx" data-k="F1B_Breadth">?</button></label><div class="v">${m?.Metrics?.Breadth1M?.label ?? '—'}</div></div>
              <div class="f1b-kpi"><label>Risk Tilt <button class="hx" data-k="F1B_RiskTilt">?</button></label><div class="v">${m?.Metrics?.RiskTilt?.label ?? '—'}</div></div>
              <div class="f1b-kpi"><label>FlowScore <button class="hx" data-k="F1B_FlowScore">?</button></label><div class="v">${fmt(m?.Metrics?.FlowScore?.score)}</div></div>
              <div class="f1b-kpi"><label>RegimeScore <button class="hx" data-k="F1B_Regime">?</button></label><div class="v">${fmt(m?.Metrics?.RegimeScore?.score)}</div></div>
              <div class="f1b-kpi"><label>State <button class="hx" data-k="StatoReport">?</button></label><div class="v">${m?.Meta?.State||'—'}</div></div>
            </div>
          </div>
        </section>

        <!-- LEADERSHIP -->
        <section id="f1b-le" class="tab-sec">
          <div class="card p-3">
            <div class="sec-h"><i data-lucide="layers"></i><span>Leadership settoriale</span></div>
            <div class="flex flex-wrap gap-1.5">
              ${(m?.Leadership?.TopInflow||[]).slice(0,6).map(x=>`<span class="f1b-chip">${x.ticker||'—'} · ${x.name||'—'}</span>`).join('')}
            </div>
            <div class="mt-2 text-sm text-slate-600">Deboli:
              ${(m?.Leadership?.WeakSectors||[]).slice(0,6).map(x=>`<span class="f1b-tag">${x.ticker||'—'} · ${x.name||'—'}</span>`).join(' ')}
            </div>
          </div>
        </section>

        <!-- SERIE -->
        <section id="f1b-se" class="tab-sec">
          <div class="card p-3">
            <div class="sec-h"><i data-lucide="chart-line"></i><span>Serie VIX</span></div>
            <svg class="f1b-spark" preserveAspectRatio="none" viewBox="0 0 100 32" id="drawer-spark"></svg>
            <div class="text-[11px] text-slate-500 mt-0.5">
              ${(Array.isArray(m?.Series?.VIX_Sparkline) && m.Series.VIX_Sparkline.length)
                ? `VIX · ultimi ${m?.Series?.VIX_Sparkline.length} gg · ${m?.Series?.Timebase||'daily'}`
                : 'VIX · n/d'}
            </div>
          </div>
        </section>

        <!-- INPUTS -->
        <section id="f1b-in" class="tab-sec">
          <div class="card p-3 overflow-auto">
            <div class="sec-h"><i data-lucide="table-2"></i><span>Inputs (ETF settoriali)</span></div>
            <table class="w-full text-sm">
              <thead class="text-slate-500">
                <tr class="border-b">
                  <th class="text-left py-1 pr-2">Ticker</th>
                  <th class="text-left py-1 pr-2">Nome</th>
                  <th class="text-left py-1 pr-2">Gruppo</th>
                  <th class="text-right py-1 pr-2">Perf 1M %</th>
                  <th class="text-right py-1 pr-2">Flow 5D (M$)</th>
                  <th class="text-right py-1">Rank Flow</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>

        <!-- AUDIT -->
        <section id="f1b-au" class="tab-sec">
          <div class="card p-3">
            <div class="sec-h"><i data-lucide="badge-check"></i><span>Audit & Metadati</span></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 text-sm">
              <div><b>VersionTag:</b> ${m?.Meta?.Version||m?.Meta?.VersionTag||'—'}</div>
              <div><b>Timestamp:</b> ${m?.Meta?.Timestamp||'—'} (${m?.Meta?.Timezone||'—'})</div>
              <div><b>AuditPathID:</b> ${m?.Meta?.AuditPathID||'—'}</div>
              <div><b>Source Tier:</b> ${m?.Meta?.SourceTier||'—'}</div>
              <div class="sm:col-span-2"><b>Sources:</b> ${(m?.Meta?.Sources||[]).join(', ')||'—'}</div>
              <div><b>Freshness:</b> ${m?.Meta?.FreshnessLabel||m?.Meta?.Freshness||'—'}</div>
              <div><b>Conformità:</b> ${m?.Audit?.Conformity||'—'}</div>
              <div class="sm:col-span-2"><b>Note:</b> ${m?.Meta?.Notes||'—'}</div>
              ${Array.isArray(m?.Audit?.Caveats)? `<div class="sm:col-span-2"><b>Caveat:</b> ${m.Audit.Caveats.join('; ')}</div>`:''}
              <div class="sm:col-span-2"><b>TapeNotes (REG close):</b> ${m?.Meta?.TapeNotes||m?.TapeNotes||'—'}</div>
              <div class="sm:col-span-2"><b>Missing (critici):</b> ${(m?.Meta?.MissingCritici||m?.MissingCritici||[]).join(', ')||'—'}</div>
            </div>
          </div>
        </section>

        <!-- RESOCONTO -->
        <section id="f1b-rs" class="tab-sec">
          <div class="card p-3">
            <div class="sec-h"><i data-lucide="notes"></i><span>Resoconto sintetico</span></div>
            <div class="text-sm text-slate-700 leading-relaxed">
              ${summaryText}
            </div>
          </div>
        </section>
      </div>
    `;

    // Sparkline nel tab Serie
    const svg = document.getElementById('drawer-spark');
    if(svg && Array.isArray(m?.Series?.VIX_Sparkline)){ sparkline(svg, m.Series.VIX_Sparkline); }

    // Tabs handler con stato "premuto"
    const tabsBtns = body.querySelectorAll('.tabbar [data-tab]');
    const sections = ['#f1b-ov','#f1b-mx','#f1b-le','#f1b-se','#f1b-in','#f1b-au','#f1b-rs'].map(s=> body.querySelector(s));

    const firstBtn = body.querySelector('.tabbar [data-tab="#f1b-ov"]');
    if (firstBtn){ firstBtn.classList.add('active'); firstBtn.setAttribute('aria-pressed','true'); }

    tabsBtns.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        sections.forEach(sec=>sec?.classList.remove('active'));
        body.querySelector(btn.getAttribute('data-tab'))?.classList.add('active');
        tabsBtns.forEach(b=>{ b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
        btn.classList.add('active'); btn.setAttribute('aria-pressed','true');
      });
    });

    if (window.lucide) lucide.createIcons();
  }

  /* ========= MOUNT ========= */
  function mountF1B(){
    const container = document.getElementById('mod-container');
    const tpl = document.getElementById('tpl-f1b-card');
    if(!container || !tpl) return false;
    const card = tpl.content.firstElementChild.cloneNode(true);
    container.appendChild(card);

    window.Tradelia = window.Tradelia || {};
    window.Tradelia.F1B = { update: (data)=> bindF1BCard(card, data || {}) };
    window.Tradelia.sparkline = sparkline; // export per altri moduli

    // placeholder vuoto
    window.Tradelia.F1B.update({});
    return true;
  }

  if(!mountF1B()){
    const obs = new MutationObserver(()=>{ if(mountF1B()) obs.disconnect(); });
    obs.observe(document.documentElement, {childList:true, subtree:true});
    document.addEventListener('DOMContentLoaded', ()=> mountF1B(), {once:true});
  }
})();
</script>

<script>
(function(){
  const dotClass = (tone)=> ({g:'f2-dot f2-dot-g', y:'f2-dot f2-dot-y', r:'f2-dot f2-dot-r', n:'f2-dot f2-dot-n'}[tone]||'f2-dot f2-dot-n');
  const badgeClass = (tone)=> ({g:'badge badge--g', y:'badge badge--y', r:'badge badge--r', n:'badge badge--n'}[tone]||'badge badge--n');
  const toneByConcord = (s)=>{
    const v=String(s||'').toLowerCase();
    if(/alta|high|strong|bull/.test(v)) return 'g';
    if(/media|mid|neutral|neutro/.test(v)) return 'y';
    if(/bassa|low|weak|bear/.test(v)) return 'r';
    return 'n';
  };
  const safe = (x)=> (x==null||x==='')?'—':x;

  function renderDrawer(d){
    const body = document.getElementById('drawer-body');
    document.getElementById('drawer-title').textContent = `F2 — ${safe(d.ticker)}`;
    document.getElementById('drawer-sub').textContent   = 'Ownership · Short · Options · News · Eventi · ETF · Peers';

    const row = (k,v)=> `<tr class="border-b last:border-0"><td class="py-1 pr-2">${k}</td><td class="py-1 text-right">${safe(v)}</td></tr>`;
    const tbl = (rows)=> rows && rows.length ? rows.map(([k,v])=>row(k,v)).join("") : row('n/d','');

    const newsLi = (arr)=> (arr||[]).slice(0,10).map(n=>`
      <li class="mb-1.5">
        <span class="font-semibold">${safe(n.headline||n.title)}</span>
        <span class="text-slate-500 text-xs"> · ${safe(n.source)} · ${safe(n.time)}</span>
        ${n.note?`<div class="text-sm text-slate-700">${n.note}</div>`:''}
      </li>`).join('') || '<li class="text-slate-400">n/d</li>';

    body.innerHTML = `
      <div class="space-y-3">
        <div class="f2-tabbar noprint">
          <button class="sbtn" data-tab="#f2-ov" aria-pressed="true"><i data-lucide="layout-grid"></i><span>Overview</span></button>
          <button class="sbtn" data-tab="#f2-own"><i data-lucide="user-check"></i><span>Ownership</span></button>
          <button class="sbtn" data-tab="#f2-short"><i data-lucide="shield-alert"></i><span>Short & Options</span></button>
          <button class="sbtn" data-tab="#f2-news"><i data-lucide="newspaper"></i><span>News</span></button>
          <button class="sbtn" data-tab="#f2-events"><i data-lucide="calendar-days"></i><span>Eventi</span></button>
          <button class="sbtn" data-tab="#f2-etf"><i data-lucide="boxes"></i><span>ETF & Peers</span></button>
          <button class="sbtn" data-tab="#f2-audit"><i data-lucide="badge-check"></i><span>Audit</span></button>
        </div>

        <!-- OVERVIEW -->
        <section id="f2-ov" class="f2-tab active">
          <div class="card p-3">
            <table class="tbl-kv">
              <tr><td>Ticker <button class="hx" data-k="F2_Ticker">?</button></td><td><b>${safe(d.ticker)}</b></td></tr>
              <tr><td>Price headline <button class="hx" data-k="F2_PriceHeadline">?</button></td><td>${safe(d.price_headline)}</td></tr>
              <tr><td>Concordanza Macro <button class="hx" data-k="F2_MacroConcordance">?</button></td><td>${safe(d.concordanza)}</td></tr>
              <tr><td>Confidence (F2) <button class="hx" data-k="F2_Conf">?</button></td><td>${safe(d.confidence_label||d.confidence)}</td></tr>
              <tr><td>IV / PCR <button class="hx" data-k="F2_IV">?</button></td><td>${safe(d.iv)} · ${safe(d.pcr)}</td></tr>
              <tr><td>Profilo <button class="hx" data-k="F2_Profile">?</button></td><td>${safe(d.profile)}</td></tr>
            </table>
          </div>
        </section>

        <!-- OWNERSHIP -->
        <section id="f2-own" class="f2-tab">
          <div class="card p-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div>
                <div class="font-semibold mb-1">Azionariato</div>
                <table class="w-full text-sm">
                  ${tbl([
                    ['Institutional Ownership %', d.inst_own],
                    ['Insider Ownership %',      d.insid_own],
                    ['Float %',                  d.float_pct]
                  ])}
                </table>
              </div>
              <div>
                <div class="font-semibold mb-1">Movimenti insider</div>
                <ul class="list-disc ml-5 text-sm">
                  ${(d.insider_tx||[]).slice(0,8).map(t=>`<li>${safe(t.when)} · ${safe(t.actor)} · ${safe(t.action)} · ${safe(t.amount)}</li>`).join('') || '<li class="text-slate-400">n/d</li>'}
                </ul>
              </div>
            </div>
          </div>
        </section>

        <!-- SHORT & OPTIONS -->
        <section id="f2-short" class="f2-tab">
          <div class="card p-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div>
                <div class="font-semibold mb-1">Short metrics</div>
                <table class="w-full text-sm">
                  ${tbl([
                    ['Short Float %',          d.short_float],
                    ['Short Interest (DTC)',   d.short_interest_ratio],
                    ['Short Volume Ratio',     d.short_vol_ratio]
                  ])}
                </table>
              </div>
              <div>
                <div class="font-semibold mb-1">Derivati (sentiment)</div>
                <table class="w-full text-sm">
                  ${tbl([
                    ['Implied Volatility (IV)', d.iv],
                    ['Put/Call Ratio (PCR)',    d.pcr],
                    ['IV Percentile/Rank',      (d.iv_percentile||d.iv_rank)? `${safe(d.iv_percentile)} / ${safe(d.iv_rank)}` : '—']
                  ])}
                </table>
              </div>
            </div>
          </div>
        </section>

        <!-- NEWS -->
        <section id="f2-news" class="f2-tab">
          <div class="card p-3">
            <div class="font-semibold mb-1">Ultime news <button class="hx" data-k="F2_News">?</button></div>
            <ul class="text-sm">${newsLi(d.news)}</ul>
          </div>
        </section>

        <!-- EVENTI -->
        <section id="f2-events" class="f2-tab">
          <div class="card p-3">
            <div class="font-semibold mb-1">Eventi vicini <button class="hx" data-k="F2_Upcoming">?</button></div>
            <ul class="list-disc ml-5 text-sm">
              ${(d.events||[]).slice(0,10).map(e=>`<li>${safe(e.when)} · ${safe(e.title)}${e.scope?` · <span class="text-slate-500">${safe(e.scope)}</span>`:''}</li>`).join('') || '<li class="text-slate-400">n/d</li>'}
            </ul>
          </div>
        </section>

        <!-- ETF & PEERS -->
        <section id="f2-etf" class="f2-tab">
          <div class="card p-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div>
                <div class="font-semibold mb-1">ETF collegati <button class="hx" data-k="F2_ETFs">?</button></div>
                <table class="w-full text-sm">
                  ${tbl((d.etfs||[]).slice(0,12).map(e=>[`${safe(e.symbol)} · ${safe(e.name)}`, `${safe(e.weight)}%`]))}
                </table>
              </div>
              <div>
                <div class="font-semibold mb-1">Peers <button class="hx" data-k="F2_Peers">?</button></div>
                <ul class="list-disc ml-5 text-sm">
                  ${(d.peers||[]).slice(0,20).map(p=>`<li>${safe(p)}</li>`).join('') || '<li class="text-slate-400">n/d</li>'}
                </ul>
              </div>
            </div>
          </div>
        </section>

        <!-- AUDIT -->
        <section id="f2-audit" class="f2-tab">
          <div class="card p-3">
            <table class="tbl-kv">
              <tr><td>Freshness</td><td>${safe(d.freshness)}</td></tr>
              <tr><td>Sources</td><td>${(d.sources||[]).join(', ')||'—'}</td></tr>
              <tr><td>Note</td><td>${safe(d.notes)}</td></tr>
            </table>
          </div>
        </section>
      </div>
    `;

    // Tabs
    const tabsBtns = body.querySelectorAll('.f2-tabbar [data-tab]');
    const show = (sel)=>{
      body.querySelectorAll('.f2-tab').forEach(s=>s.classList.remove('active'));
      body.querySelector(sel)?.classList.add('active');
      tabsBtns.forEach(b=>{ b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
      const btn=[...tabsBtns].find(b=>b.getAttribute('data-tab')===sel);
      if(btn){ btn.classList.add('active'); btn.setAttribute('aria-pressed','true'); }
    };
    tabsBtns.forEach(b=> b.addEventListener('click', ()=> show(b.getAttribute('data-tab')) ));
    show('#f2-ov');

    if (window.lucide) lucide.createIcons();
  }

  function mountF2(){
    const container=document.getElementById('mod-container');
    const tpl=document.getElementById('tpl-f2-card');
    if(!container||!tpl) return false;

    const card = tpl.content.firstElementChild.cloneNode(true);
    container.appendChild(card);

    const $=(sel)=> card.querySelector(sel);
    const setBadge=(el,tone,label)=>{ if(!el) return; el.className=badgeClass(tone); el.textContent=label??'—'; };

    // Apri drawer
    $('[data-f2="open"]').onclick=(e)=>{
      e.stopPropagation();
      window.Tradelia?.openDrawer?.();
      renderDrawer(window.Tradelia?.F2?.__data||{});
    };

    // API pubblica
    window.Tradelia = window.Tradelia || {};
    window.Tradelia.F2 = {
      __data:{},

      // merge: web(base) + user(override campi chiave)
      feed(webData={}, userData={}){
        const merged = Object.assign({}, webData, userData);
        this.update(merged);
      },

      update(d={}){
        this.__data = d;

        // Ticker & concordanza
        $('[data-f2="ticker"]').textContent = d.ticker ?? '—';
        const conc = d.concordanza ?? '—';
        $('[data-f2="mc"]').textContent = conc;

        // Tone
        const tone = toneByConcord(conc);
        const dot = $('[data-f2="mc-dot"]'); if(dot) dot.className = dotClass(tone);
        setBadge($('[data-f2="state-badge"]'), tone, (d.state_label||'NEUTRO').toUpperCase());

        // Confidence + IV/PCR
        setBadge($('[data-f2="conf"]'), tone, d.confidence_label ?? (d.confidence!=null? String(d.confidence): '—'));
        const ivChip  = $('[data-f2="iv-chip"]');  if(ivChip)  ivChip.textContent  = `IV ${safe(d.iv)}`;
        const pcrChip = $('[data-f2="pcr-chip"]'); if(pcrChip) pcrChip.textContent = `PCR ${safe(d.pcr)}`;

        if (window.lucide) lucide.createIcons();
      }
    };

    // placeholder
    window.Tradelia.F2.update({});
    return true;
  }

  if(!mountF2()){
    const obs = new MutationObserver(()=>{ if(mountF2()) obs.disconnect(); });
    obs.observe(document.documentElement, {childList:true, subtree:true});
    document.addEventListener('DOMContentLoaded', ()=> mountF2(), {once:true});
  }
})();
</script>
