<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tradelia · Report Runtime</title>
  <link rel="icon" href="./favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Base */
    body{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:#f1f5f9 url('https://www.transparenttextures.com/patterns/cubes.png');
      background-size:280px; color:#0f172a;
    }
    ::-webkit-scrollbar { width:10px; height:10px }
    ::-webkit-scrollbar-thumb { background:rgba(80,160,200,.4); border-radius:100vh }
    ::-webkit-scrollbar-thumb:hover { background:rgba(80,160,200,.6) }
    * { scrollbar-width:thin; scrollbar-color:rgba(80,160,200,.5) #e5e7eb }

    /* Pulsanti */
    .btn {
      display:inline-flex; align-items:center; gap:.45rem;
      padding:.4rem .6rem; border-radius:.6rem; font-weight:600; font-size:14px;
      border:1px solid #e5e7eb; background:linear-gradient(#fff,#f8fafc);
      box-shadow:0 1px 0 rgba(2,6,23,.04), inset 0 -1px 0 rgba(2,6,23,.03);
      transition:transform .08s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:hover{ background:linear-gradient(#fff,#f1f5f9); border-color:#dbe3ea }
    .btn:active{ transform:translateY(1px); box-shadow:inset 0 1px 0 rgba(0,0,0,.06) }
    .btn:focus-visible{ outline:none; box-shadow:0 0 0 2px rgba(56,189,248,.5) }
    .btn-primary{ color:#0b2a3f }
    .btn i{ width:18px; height:18px }

    /* Header compatto */
    .hdr { backdrop-filter:saturate(1.2) blur(6px) }

    /* Share sheet desktop */
    .sbtn{
      display:inline-flex;align-items:center;gap:.5rem;
      padding:.5rem .6rem;border-radius:.65rem;border:1px solid #e5e7eb;
      background:#fff;font-weight:600;font-size:13px;
      transition:transform .08s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease;
    }
    .sbtn:hover{background:#f8fafc;border-color:#dbe3ea}
    .sbtn:active{transform:translateY(1px)}
    .sbtn i{width:18px;height:18px}
    .badge-url{background:#f8fafc;border:1px solid #e5e7eb}
    .qr-wrap img{border-radius:.75rem;border:1px solid #e5e7eb;background:#fff}

    /* Animazioni popup share */
    @keyframes fadeBackdropIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fadeBackdropOut { from { opacity: 1 } to { opacity: 0 } }
    @keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.98) } to { opacity: 1; transform: translateY(0) scale(1) } }
    @keyframes popOut { from { opacity: 1; transform: translateY(0) scale(1) } to { opacity: 0; transform: translateY(4px) scale(.985) } }
    .popup-backdrop { animation: fadeBackdropIn .18s ease forwards }
    .popup-backdrop.closing { animation: fadeBackdropOut .16s ease forwards }
    .popup-card { animation: popIn .20s cubic-bezier(.22,.61,.36,1) forwards }
    .popup-card.closing { animation: popOut .16s ease forwards }

    @media print { .noprint{display:none!important} }
  </style>
</head>

<body class="text-gray-900">
  <!-- HEADER -->
  <header class="hdr sticky top-0 z-50 bg-white/90 border-b border-slate-200 noprint">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 h-12 sm:h-14 flex items-center justify-between">
      <!-- Brand + titolo -->
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <a href="./index.html" class="shrink-0 text-lg sm:text-xl font-extrabold tracking-tight text-sky-900 hover:opacity-90 transition">
          <span class="text-slate-900">TRADELIA</span><span class="text-blue-600">&bull;AI</span>
        </a>
        <span class="text-slate-400 text-xs sm:text-sm truncate">Report Runtime</span>
      </div>

      <!-- Azioni -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-print" class="btn btn-primary" aria-label="Stampa / PDF">
          <i data-lucide="printer" aria-hidden="true"></i><span class="hidden sm:inline">Stampa / PDF</span>
        </button>
        <button id="btn-share" class="btn btn-primary" aria-label="Condividi">
          <i data-lucide="share-2" aria-hidden="true"></i><span class="hidden sm:inline">Condividi</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Script header + share (mobile nativo, desktop share sheet con QR) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      document.getElementById('btn-print')?.addEventListener('click', () => window.print());
      document.getElementById('btn-share')?.addEventListener('click', async () => {
        const urlObj = new URL(window.location.href);
        if (!urlObj.searchParams.get('id')) urlObj.searchParams.set('id', 'sample-qyld-2025-10-20');
        const longUrl = urlObj.toString();
        openShareSheet({ longUrl, title:'Tradelia · Report Runtime', text:'Guarda il report completo su Tradelia AI' });
      });

      async function shortenUrl_isgd(longUrl, { timeoutMs = 5000 } = {}) {
        const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const api = `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`;
          const res = await fetch(api, { signal: ctrl.signal });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (data.shorturl) return data.shorturl;
          throw new Error(data.errormessage || 'is.gd error');
        } finally { clearTimeout(t); }
      }

      function openShareSheet({ longUrl, title, text }) {
        const backdrop = document.createElement('div');
        backdrop.className = 'popup-backdrop fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-50';

        const card = document.createElement('div');
        card.className = 'popup-card bg-white rounded-xl shadow-2xl p-5 w-[92%] max-w-lg text-left border border-slate-200';

        let currentUrl = longUrl;
        const enc = encodeURIComponent;
        const targets = (u) => ([
          { label:'WhatsApp',   href:`https://wa.me/?text=${enc(text+' ') + enc(u)}`, icon:'message-square' },
          { label:'Telegram',   href:`https://t.me/share/url?url=${enc(u)}&text=${enc(text)}`, icon:'send' },
          { label:'X (Twitter)',href:`https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(u)}`, icon:'twitter' },
          { label:'LinkedIn',   href:`https://www.linkedin.com/sharing/share-offsite/?url=${enc(u)}`, icon:'linkedin' },
          { label:'Reddit',     href:`https://www.reddit.com/submit?url=${enc(u)}&title=${enc(title)}`, icon:'square' },
          { label:'Facebook',   href:`https://www.facebook.com/sharer/sharer.php?u=${enc(u)}`, icon:'facebook' },
          { label:'Email',      href:`mailto:?subject=${enc(title)}&body=${enc(text)}%0A%0A${enc(u)}`, icon:'mail' },
        ]);

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-3">
            <div>
              <h2 class="font-semibold text-slate-800 leading-tight">${title}</h2>
              <p class="text-xs text-slate-500 mt-0.5">Condividi il link del report</p>
            </div>
            <button id="closePopup" class="btn" aria-label="Chiudi">
              <i data-lucide="x"></i><span class="hidden sm:inline">Chiudi</span>
            </button>
          </div>

          <div class="flex items-center gap-2 mb-3">
            <label class="text-sm text-slate-700 flex items-center gap-2">
              <input id="useShort" type="checkbox" class="h-4 w-4 accent-sky-600">
              <span>Usa link breve (is.gd)</span>
            </label>
            <span id="shortStatus" class="text-xs text-slate-400">(non attivo)</span>
          </div>

          <div class="space-y-3 sm:space-y-4">
            <div class="qr-wrap mx-auto w-[164px] sm:w-[180px] md:w-[200px] lg:w-[220px]">
              <img id="qrImg" alt="QR per condivisione" class="w-full h-auto rounded-lg border border-slate-200 shadow-sm bg-white p-2" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(currentUrl)}" />
            </div>

            <div id="shareGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 justify-items-center sm:justify-items-start"></div>

            <div id="urlBox" class="badge-url text-[12px] p-2 rounded-md font-mono select-all break-all">${currentUrl}</div>
            <div class="flex gap-2">
              <button id="copyLink" class="sbtn"><i data-lucide="copy"></i><span>Copia link</span></button>
              <a id="openNew" class="sbtn" href="${currentUrl}" target="_blank" rel="noopener"><i data-lucide="external-link"></i><span>Apri</span></a>
            </div>
            <p class="text-[11px] text-slate-500">Suggerimento: usa i pulsanti sopra per aprire la condivisione del servizio scelto.</p>
          </div>
        `;

        const renderTargets = (u) => {
          const grid = card.querySelector('#shareGrid');
          grid.innerHTML = targets(u).map(t =>
            `<a class="sbtn" href="${t.href}" target="_blank" rel="noopener">
               <i data-lucide="${t.icon}"></i><span>${t.label}</span>
             </a>`
          ).join('');
          lucide.createIcons();
        };

        const updateAll = (u) => {
          card.querySelector('#urlBox').textContent = u;
          card.querySelector('#openNew').href = u;
          card.querySelector('#qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(u)}`;
          renderTargets(u);
        };

        renderTargets(currentUrl);

        const close = () => {
          backdrop.classList.add('closing'); card.classList.add('closing');
          card.addEventListener('animationend', () => backdrop.remove(), { once: true });
        };
        backdrop.appendChild(card);
        document.body.appendChild(backdrop);
        lucide.createIcons();

        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
        card.querySelector('#closePopup').addEventListener('click', close);

        card.querySelector('#copyLink').addEventListener('click', async () => {
          try{
            await navigator.clipboard.writeText(card.querySelector('#urlBox').textContent);
            const btn = card.querySelector('#copyLink');
            btn.innerHTML = '<i data-lucide="check"></i><span>Copiato</span>';
            lucide.createIcons(); setTimeout(close, 900);
          }catch{
            const range = document.createRange(); range.selectNodeContents(card.querySelector('#urlBox'));
            const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
          }
        });

        let cachedShort = null;
        card.querySelector('#useShort').addEventListener('change', async (e) => {
          const shortStatus = card.querySelector('#shortStatus');
          if (e.target.checked) {
            shortStatus.textContent = 'creo link breve…'; shortStatus.className = 'text-xs text-sky-600';
            try {
              if (!cachedShort) cachedShort = await shortenUrl_isgd(longUrl);
              updateAll(cachedShort);
              shortStatus.textContent = 'attivo (is.gd)'; shortStatus.className = 'text-xs text-emerald-600';
            } catch (err) {
              updateAll(longUrl); e.target.checked = false;
              shortStatus.textContent = 'non disponibile (fallback)'; shortStatus.className = 'text-xs text-amber-600';
            }
          } else {
            updateAll(longUrl);
            shortStatus.textContent = '(non attivo)'; shortStatus.className = 'text-xs text-slate-400';
          }
        });
      }
    });
  </script>

  <!-- stile compatto per card + ? (aggiornato + robusto) -->
  <style>

    #header-ticker label{display:flex;align-items:center;gap:.4rem;font-size:11px;color:#64748b}

    .hx-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;max-width:560px;width:92%;

  <!-- popup accademico: bugfix (niente X), backdrop+Esc, focus+scroll lock -->
  <script>
  (function(){
    const EXPL = {
      Sessione:{t:"Sessione REG (adjusted)", a:"Analisi sulla sola sessione regolare; serie prezzi adjusted per dividendi/split per coerenza storica.", s:"CMT Association · Market Data Conventions; CFA Institute – Quantitative Methods."},
      DataStart:{t:"Data inizio report", a:"Timestamp di avvio finestra analitica per audit e replicabilità.", s:"Methodology & Audit Trail (interno)."},
      DataEnd:{t:"Data fine report", a:"Timestamp di chiusura finestra; evita look-ahead bias.", s:"Methodology & Audit Trail (interno)."},
      Ticker:{t:"Ticker", a:"Identificativo ufficiale dello strumento negoziato.", s:"Nasdaq/NYSE Listing Rules; SEC Form 8-A."},
      Venue:{t:"Borsa di negoziazione", a:"Venue primario/mic di quotazione dello strumento.", s:"Microstructure: O’Hara (1995) · Hasbrouck (2007)."},
      Validazione:{t:"Validazione ticker/venue", a:"Coerenza simbolo–venue (incl. ADR); requisito preliminare di qualità.", s:"Best practice di data governance (CFA QM)."},
      VersionTag:{t:"VersionTag", a:"Versione del motore/metodo usato nel report.", s:"Governance & versioning (interno)."},
      SyncID:{t:"SyncID", a:"Chiave audit: <TICKER>_<YYYYMMDD>_F3/F1.", s:"Audit Trail (interno)."},
      Freshness:{t:"Freshness", a:"Controllo freschezza dati ≤ T-1 prima della validazione.", s:"Policy di qualità dati (interno)."},
      OCR_Conf:{t:"OCR_Confidence", a:"Attendibilità dell’estrazione numerica (0–1).", s:"CFA Institute – Quantitative Methods; Kahn & Strong (1998) Data Quality."},
      DataIntegrity:{t:"Data Integrity", a:"Completezza/consistenza del dataset (0–1).", s:"Kahn & Strong (1998); Pipino, Lee & Wang (2002)."},
      FeedSync:{t:"Feed Sync", a:"Allineamento temporale tra feed e pannelli (0–1).", s:"Hasbrouck (2007) – sincronizzazione dati intraday."},
      ConfidenceFinal:{t:"Confidence (final)", a:"Euristica conservativa: min(OCR_Conf, DataIntegrity, FeedSync, Confidence_H4, Confidence_H1).", s:"Heuristic gating per audit (metodo interno)."},
      StatoReport:{t:"Stato report", a:"ACTIVE/HOLD/REVIEW in base a Confidence e copertura input.", s:"Policy stato (interno)."},
      TapeNotes:{t:"TapeNotes (REG close)", a:"Note micro-strutturali sull’asta di chiusura (AuctionShare%, Intensity, VWAP, Stickiness).", s:"Hasbrouck (2007); O’Hara (1995)."},
      Missing:{t:"Missing (critici)", a:"Elenco campi critici mancanti → N/D; se impattano Confidence ⇒ HOLD.", s:"Policy N/D (interno)."},
      PolicyND:{t:"Policy N/D", a:"Non si stimano i mancanti; si documentano e si declassa lo stato se critici.", s:"Governance trasparenza (interno)."},
      Cromatica:{t:"Criteri cromatici", a:"🟩 favorevole/sopra media · 🟨 neutro/attenzione · 🟥 sfavorevole/sotto media · — neutro/incompleto.", s:"Legenda cromatica standard del desk."},
      NoteHeader:{t:"Note header", a:"Annotazioni qualitative utili alla lettura del report.", s:"Metodologia di reporting (interno)."}
    };

    let POP=null, prevOverflow='';
    function closePop(){
      if(!POP) return;
      POP.backdrop.removeEventListener('click', onBackdrop);
      document.removeEventListener('keydown', onKeyEsc, true);
      document.documentElement.style.overflow = prevOverflow;
      POP.wrap.remove(); POP=null;
    }
    function onBackdrop(e){ if(e.target===e.currentTarget) closePop(); }
    function onKeyEsc(e){ if(e.key==='Escape'){ e.stopPropagation(); e.preventDefault(); closePop(); } }

    function openPop(d){
      if(POP){ POP.title.textContent=d.t; POP.src.textContent='Fonte accademica: '+d.s; POP.text.innerHTML=d.a; POP.wrap.focus(); return; }
      const wrap=document.createElement('div'); wrap.className='hx-pop'; wrap.role='dialog'; wrap.ariaModal='true'; wrap.tabIndex=-1;
      const card=document.createElement('div'); card.className='hx-card'; card.addEventListener('click',ev=>ev.stopPropagation());
      const h=document.createElement('h3'); h.textContent=d.t;
      const src=document.createElement('div'); src.className='src'; src.textContent='Fonte accademica: '+d.s;
      const text=document.createElement('div'); text.className='text-sm text-slate-800'; text.innerHTML=d.a;
      card.append(h,src,text); wrap.append(card); document.body.appendChild(wrap);
      prevOverflow=document.documentElement.style.overflow||''; document.documentElement.style.overflow='hidden';
      wrap.addEventListener('click', onBackdrop); document.addEventListener('keydown', onKeyEsc, true);
      wrap.focus(); POP={wrap, backdrop:wrap, title:h, src, text};
    }

    document.addEventListener('click', (e)=>{
      const btn=e.target.closest('.hx'); if(!btn) return;
      if(POP && POP.wrap.contains(btn)) return;
      const k=btn.dataset.k; const d=EXPL[k]||{t:k,a:"Descrizione non disponibile.",s:"—"};
      openPop(d);
    }, true);
  })();
  </script>

  <!-- ===========================
       SEZIONE — MODULI (framework avanzato, nessun F1–F5 qui)
       =========================== -->
  <section id="moduli" class="pt-3">
    <div class="max-w-7xl mx-auto px-3 sm:px-5">
      <!-- Header sezione -->
      <div class="flex items-end justify-between mb-3 sm:mb-4">
        <div class="min-w-0">
          <h2 class="text-base sm:text-lg font-semibold text-slate-800 tracking-tight">Moduli analitici</h2>
          <p class="text-xs text-slate-500">Framework istituzionale · sequenziale · auditabile (F1–F5 verranno registrati dopo)</p>
        </div>
        <div class="hidden sm:flex items-center gap-2">
          <button id="legendBtn" class="btn" aria-haspopup="dialog"><i data-lucide="info"></i><span class="hidden md:inline">Legenda</span></button>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3 mb-3">
        <div class="relative flex-1">
          <input id="mod-search" type="search" inputmode="search" placeholder="Cerca modulo, SyncID…"
                 class="w-full rounded-lg border border-slate-200 bg-white/90 px-3 py-2 pr-9 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-200 focus:border-sky-300" />
          <i data-lucide="search" class="w-4 h-4 absolute right-3 top-2.5 text-slate-400 pointer-events-none"></i>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-500">Ordina</label>
          <select id="mod-sort" class="rounded-lg border border-slate-200 bg-white/90 px-2.5 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-200">
            <option value="seq">Sequenza (F1→F5)</option>
            <option value="conf">Confidence</option>
            <option value="state">Stato</option>
            <option value="title">Titolo</option>
          </select>
          <div class="hidden sm:flex items-center">
            <button id="view-grid" class="btn" aria-pressed="true" aria-label="Vista griglia"><i data-lucide="grid"></i></button>
            <button id="view-list" class="btn" aria-pressed="false" aria-label="Vista lista"><i data-lucide="list"></i></button>
          </div>
        </div>
      </div>

  <!-- ========== Runtime JS (Registry + UI) ========== -->
  <script>
  (function(){
    /* --------- Utilities --------- */
    const $ = (sel,root=document)=> root.querySelector(sel);
    const $$ = (sel,root=document)=> Array.from(root.querySelectorAll(sel));
    const fmtConf = (v)=> (v==null?'—':(Number(v).toFixed(2)));

    // color mapping (card badge) — coerente con JSON colors
    const colorToBadge = (c)=>{
      switch(String(c||'').toLowerCase()){
        case 'green': return ['ACTIVE','badge b-active'];
        case 'yellow':return ['HOLD','badge b-hold'];
        case 'red':   return ['REVIEW','badge b-review'];
        default:      return ['NEUTRO','badge b-neutral'];
      }
    };
    const stateToColor = (s)=>{
      switch(String(s||'').toUpperCase()){
        case 'ACTIVE': return 'green';
        case 'HOLD':   return 'yellow';
        case 'REVIEW': return 'red';
        default:       return 'neutral';
      }
    };

    function sparkline(svg, arr){
      if(!svg) return;
      if(!arr || !arr.length){ svg.innerHTML=''; svg.setAttribute('data-spark',''); return; }
      const min = Math.min(...arr), max = Math.max(...arr);
      const norm = max-min || 1;
      const pts = arr.map((v,i)=>{
        const x = (i/(arr.length-1))*100;
        const y = 20 - ((v-min)/norm)*18 - 1;
        return `${x},${y}`;
      }).join(' ');
      svg.innerHTML = `<polyline fill="none" stroke="${arr[arr.length-1]>=arr[0]?'#16a34a':'#dc2626'}" stroke-width="1.25" points="${pts}" />`;
      svg.setAttribute('data-spark', 'ok');
    }

    /* --------- Drawer --------- */
    const drawer = $('#mod-drawer');
    const drawerPanel = $('#mod-drawer aside');
    const drawerTitle = $('#drawer-title');
    const drawerSub = $('#drawer-sub');
    const drawerBody = $('#drawer-body');
    function openDrawer({title, sub}){
      drawerTitle.textContent = title || 'Modulo';
      drawerSub.textContent = sub || '—';
      drawer.classList.remove('hidden');
      requestAnimationFrame(()=> drawerPanel.style.transform='translateX(0)');
    }
    function closeDrawer(){
      drawerPanel.style.transform='translateX(100%)';
      drawerPanel.addEventListener('transitionend', ()=> drawer.classList.add('hidden'), {once:true});
    }
    drawer.addEventListener('click', (e)=>{ if(e.target.dataset.close==='backdrop') closeDrawer(); });
    $('#drawer-close')?.addEventListener('click', closeDrawer);
    $('#drawer-print')?.addEventListener('click', ()=> window.print());

    /* --------- Legend --------- */
    const legendPop = $('#legend-pop');
    $('#legendBtn')?.addEventListener('click', ()=> legendPop.classList.remove('hidden'));
    legendPop?.addEventListener('click', (e)=>{ if(e.target.dataset.close==='legend') legendPop.classList.add('hidden'); });

    /* --------- View switch --------- */
    const container = $('#mod-container');
    $('#view-grid')?.addEventListener('click', (e)=>{
      container.dataset.view='grid';
      e.currentTarget.setAttribute('aria-pressed','true');
      $('#view-list').setAttribute('aria-pressed','false');
      container.className='grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 sm:gap-3 lg:gap-4';
    });
    $('#view-list')?.addEventListener('click', (e)=>{
      container.dataset.view='list';
      e.currentTarget.setAttribute('aria-pressed','true');
      $('#view-grid').setAttribute('aria-pressed','false');
      container.className='space-y-2.5';
    });

    /* --------- Registry --------- */
    const tpl = $('#tpl-mod-card');
    const modules = new Map();

    function renderCard(def){
      const node = tpl.content.cloneNode(true);
      const root = node.firstElementChild;

      root.dataset.id = def.id;
      root.setAttribute('tabindex','0');
      root.setAttribute('role','button');
      root.setAttribute('aria-label', def.title);

      root.querySelector('.mdc-t').textContent = def.title;
      root.querySelector('[data-field="sync"]').textContent = def.syncID || '—';

      // Badge: preferisci def.color (green/yellow/red/neutral) al posto di state
      const color = def.color || stateToColor(def.state);
      const [label, cls] = colorToBadge(color);
      const badge = root.querySelector('[data-field="badge"]');
      badge.textContent = label; badge.className = cls;

      root.querySelector('[data-field="state"]').textContent = (def.state || label);
      root.querySelector('[data-field="conf"]').textContent = fmtConf(def.confidence);
      root.querySelector('[data-field="meta"]').textContent = def.meta || '';

      // spark
      const svg = root.querySelector('[data-spark]');
      sparkline(svg, Array.isArray(def.spark)?def.spark:[]);

      // open handlers
      const open = ()=> {
        openDrawer({title:def.title, sub:def.syncID || ''});
        drawerBody.replaceChildren();
        try{
          if(typeof def.render === 'function') def.render(drawerBody);
          else if(def.html){ const wrap = document.createElement('div'); wrap.innerHTML = def.html; drawerBody.appendChild(wrap); }
          else { const p = document.createElement('p'); p.className='text-sm text-slate-600'; p.textContent='Nessun contenuto montato. Registra il modulo con { render(el) { … } }.'; drawerBody.appendChild(p); }
        }catch(err){
          const errBox = document.createElement('pre');
          errBox.className='text-xs text-red-700 bg-red-50 border border-red-200 rounded-lg p-2 overflow-auto';
          errBox.textContent = String(err);
          drawerBody.appendChild(errBox);
        }
        if(window.lucide) lucide.createIcons();
      };
      root.querySelector('[data-action="open"]').addEventListener('click', open);
      root.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); open(); } });
      root.addEventListener('dblclick', open);

      return root;
    }

    function mountAll(){
      container.replaceChildren();
      let list = Array.from(modules.values());
      // filtro
      const q = ($('#mod-search')?.value || '').trim().toLowerCase();
      if(q){
        list = list.filter(m =>
          m.title.toLowerCase().includes(q) ||
          (m.syncID||'').toLowerCase().includes(q) ||
          (m.meta||'').toLowerCase().includes(q)
        );
      }
      // sort
      const sort = $('#mod-sort')?.value || 'seq';
      const byState = {ACTIVE:0, REVIEW:1, HOLD:2, NEUTRO:3};
      list.sort((a,b)=>{
        if(sort==='title') return a.title.localeCompare(b.title);
        if(sort==='state') return (byState[(a.state||'').toUpperCase()]??9)-(byState[(b.state||'').toUpperCase()]??9);
        if(sort==='conf') return (b.confidence??-1)-(a.confidence??-1);
        return (a.seq??999)-(b.seq??999);
      });
      // mount
      for(const m of list) container.appendChild(renderCard(m));
      if(window.lucide) lucide.createIcons();
    }

    // public API
    window.TradeliaModules = {
      register(def){
        if(!def || !def.id) throw new Error('register() richiede { id }');
        if(modules.has(def.id)) throw new Error('id già registrato: '+def.id);
        const norm = {
          id: def.id,
          title: def.title || 'Modulo',
          seq: def.seq ?? 999,
          state: def.state || 'NEUTRO',
          color: def.color || null,        // << aggiunto: colore esplicito dal JSON dei moduli
          confidence: def.confidence ?? null,
          syncID: def.syncID || null,
          meta: def.meta || '',
          spark: Array.isArray(def.spark)?def.spark:[],
          render: def.render,
          html: def.html
        };
        modules.set(norm.id, norm);
        mountAll();
        return norm.id;
      },
      update(id, patch){
        if(!modules.has(id)) throw new Error('id non trovato: '+id);
        Object.assign(modules.get(id), patch||{});
        mountAll();
      },
      open(id){
        const m = modules.get(id);
        if(!m) throw new Error('id non trovato: '+id);
        openDrawer({title:m.title, sub:m.syncID||''});
        drawerBody.replaceChildren();
        if(typeof m.render === 'function') m.render(drawerBody);
        else if(m.html){ const wrap = document.createElement('div'); wrap.innerHTML=m.html; drawerBody.appendChild(wrap); }
        if(window.lucide) lucide.createIcons();
      },
      list(){ return Array.from(modules.values()); }
    };

    /* ---- Search/Sort listeners ---- */
    $('#mod-search')?.addEventListener('input', ()=> mountAll());
    $('#mod-sort')?.addEventListener('change', ()=> mountAll());

    if(window.lucide) lucide.createIcons();

    // Deep-link #open=<id>
    const url = new URL(window.location.href);
    const openId = url.hash.startsWith('#open=') ? url.hash.slice(6) : null;
    if(openId) { setTimeout(()=> { try{ window.TradeliaModules.open(openId); }catch(_){} }, 0); }
  })();
  </script>

  <!-- ===========================
       Binder JSON → UI (colori decisi dal JSON)
       =========================== -->
  <script>
  /* TradeliaHeaderColors EXT — interpreta direttamente il tuo JSON */
  (function(){
    const $  = (s)=> document.querySelector(s);
    const fmt = (v,d=2)=> (v==null || isNaN(v) ? 'N/D' : Number(v).toFixed(d));
    const clsBadge = (c)=>({green:'badge badge--active',yellow:'badge badge--hold',red:'badge badge--review'})[String(c||'').toLowerCase()]||'badge badge--neutral';
    const clsTone  = (c)=>['green','yellow','red','neutral'].includes(String(c||'').toLowerCase())?`tone--${String(c).toLowerCase()}`:'tone--neutral';

    const setText = (sel, v)=>{ const el=$(sel); if(el) el.textContent=(v==null||v==='')?'N/D':String(v); };
    const setBadge=(sel, label, color)=>{ const el=$(sel); if(!el) return; const s=document.createElement('span'); s.className=clsBadge(color); s.textContent=(label??'N/D').toString().toUpperCase(); el.replaceChildren(s); };
    const setTone =(sel, text, color)=>{ const el=$(sel); if(!el) return; const s=document.createElement('span'); s.className=clsTone(color); s.textContent=(text==null||text==='')?'N/D':String(text); el.replaceChildren(s); };

    function applyColorize(list){
      if(!Array.isArray(list)) return;
      for(const it of list){
        const t=it.id||it.sel; if(!t) continue;
        if(it.mode==='badge') setBadge(t, it.label ?? it.text ?? it.value, it.color);
        else if(it.mode==='tone'){ const content = (isFinite(it.value)? fmt(it.value, it.digits??2) : (it.text ?? it.label ?? it.value)); setTone(t, content, it.color); }
        else setText(t, it.text ?? it.label ?? it.value);
      }
    }

    function apply(j){
      if(!j||typeof j!=='object') return;
      // riga 1
      setText('#H-Session', j.session); setText('#H-Start', j.dateStart); setText('#H-End', j.dateEnd);
      // riga 2
      setText('#H-Ticker', j.ticker); setText('#H-Venue', j.venue);
      if(j.validation) setBadge('#H-Validation', j.validation.label, j.validation.color);
      // riga 3
      setText('#H-VersionTag', j.versionTag); setText('#H-SyncID', j.syncID);
      setText('#H-Freshness', j.freshnessDays==null?'N/D':(j.freshnessDays<=1?'≤ T-1':`${j.freshnessDays} giorni`));
      // riga 4
      setText('#H-OCR', fmt(j.ocr_conf)); setText('#H-DataIntegrity', fmt(j.dataIntegrity)); setText('#H-FeedSync', fmt(j.feedSync));
      // riga 5
      if(j.confidence_final) setTone('#H-Confidence', fmt(j.confidence_final.value), j.confidence_final.color);
      if(j.state) setBadge('#H-State', j.state.label, j.state.color);
      // riga 6
      setText('#H-TapeNotes', j.tapeNotes);
      setText('#H-Missing', Array.isArray(j.missing)&&j.missing.length? j.missing.join(', ') : '—');
      // extra colorize arbitrario
      applyColorize(j.colorize);
    }

    window.TradeliaHeaderColors={ apply };
    window.addEventListener('tradelia:header:update', (ev)=> apply(ev.detail||{}));
  })();
  </script>

  <!-- ===========================
       Helper SSE (chat streaming verso server locale opzionale)
       =========================== -->
  <script>
  async function kamareraAsk(text, context={}){
    const resp = await fetch('http://localhost:8787/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ input:text, context })
    });
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf='';
    return { async *chunks(){ while(true){ const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); const parts = buf.split('\n\n'); buf = parts.pop() || '';
      for(const line of parts){ if(!line.startsWith('data:')) continue;
        const payload=JSON.parse(line.slice(5).trim()); if(payload.delta) yield payload.delta; } } } };
  }
  </script>

  <!-- ===========================
       Modulo "Assistente" (facoltativo, per test runtime)
       =========================== -->
  <script>
  if(window.TradeliaModules){
    TradeliaModules.register({
      id:'ASSIST', title:'Assistente · Swing master', seq:0, color:'green',
      confidence:0.90, syncID:'ASSIST_'+new Date().toISOString().slice(0,10), meta:'Runtime helper',
      render:(el)=>{
        el.innerHTML=`<div class="space-y-2">
          <div class="text-sm text-slate-600">Chat interna (solo informativa, non MiFID)</div>
          <div class="flex gap-2">
            <input id="assist-q" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="Chiedi: es. imposta F1 header…">
            <button id="assist-send" class="btn"><i data-lucide="send"></i><span>Invia</span></button>
          </div>
          <pre id="assist-out" class="text-[12px] leading-relaxed bg-slate-50 border border-slate-200 rounded-lg p-2 h-[240px] overflow-auto"></pre>
        </div>`;
        if(window.lucide) lucide.createIcons();
        const $=(s)=>el.querySelector(s);
        $('#assist-send').addEventListener('click', async ()=>{
          const q=$('#assist-q').value.trim(); if(!q) return;
          const out=$('#assist-out'); out.textContent='';
          try{
            const stream=await kamareraAsk(q,{page:location.pathname,syncID:document.getElementById('H-SyncID')?.textContent||null});
            for await (const chunk of stream.chunks()){ out.textContent+=chunk; out.scrollTop=out.scrollHeight; }
          }catch(err){
            out.textContent='[offline] Collega il server locale su http://localhost:8787 — '+String(err);
          }
        });
      }
    });
  }
  </script>
