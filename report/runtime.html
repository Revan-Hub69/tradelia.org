<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tradelia · Report Runtime</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9 url('https://www.transparenttextures.com/patterns/cubes.png');
      background-size: 280px;
      color: #0f172a;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(80,160,200,0.4); border-radius: 100vh; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(80,160,200,0.6); }
    * { scrollbar-width: thin; scrollbar-color: rgba(80,160,200,0.5) #e5e7eb; }
    .btn {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .45rem .75rem; border-radius: .6rem;
      font-weight: 600; font-size: 14px;
      border: 1px solid #e2e8f0;
      background: white; transition: all .2s ease;
    }
    .btn:hover { background: #f8fafc; }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(56,189,248,.5); }
  </style>
</head>

<body class="text-gray-900">
  <header class="sticky top-0 z-50 bg-white shadow-md w-full px-4 sm:px-6 py-2 flex justify-between items-center mb-6">
    <div class="flex items-center gap-2">
      <a href="/index.html" class="text-xl sm:text-2xl font-extrabold tracking-tight text-sky-900 hover:opacity-90 transition">
        <span class="text-slate-900">TRADELIA</span><span class="text-blue-600 animate-pulse">&bull;AI</span>
      </a>
      <span class="text-gray-400 text-sm hidden sm:inline">· Report Runtime</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-print" class="btn"><i data-lucide="printer"></i><span>Stampa / PDF</span></button>
      <button id="btn-share" class="btn"><i data-lucide="share-2"></i><span>Condividi</span></button>
    </div>
  </header>

  <script>
    lucide.createIcons();

    // Pulsante stampa
    document.getElementById("btn-print").addEventListener("click", () => window.print());

    // Pulsante condividi
    document.getElementById("btn-share").addEventListener("click", async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || "sample-qyld-2025-10-20";
      const url = `https://tradelia.org/report/runtime.html?id=${id}`;
      if (navigator.share) {
        await navigator.share({
          title: "Tradelia · Report Runtime",
          text: "Guarda il report completo su Tradelia AI",
          url
        });
      } else {
        await navigator.clipboard.writeText(url);
        alert("Link copiato negli appunti: " + url);
      }
    });
  </script>
