<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tradelia AI · Institutional Dashboard</title>

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico?v=1">
  <link rel="icon" type="image/png" href="/favicon.png?v=1">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#0b1220">

  <!-- Tailwind (utility) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Design System -->
  <link rel="stylesheet" href="/report/assets/css/tokens.css" />

  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* container */
    .container { max-width: 90rem; margin-inline: auto; padding-inline: 1rem; }
    main { flex: 1; padding-top: 5rem; padding-bottom: 5rem; }

    /* ===== LEGEND INTERPRETATIVA ===== */
    .header-ticker-legend {
      background: color-mix(in oklab, var(--surface-card) 92%, transparent);
      border: 1px solid var(--br-soft);
      border-radius: var(--radius-card);
      padding: 1rem 1.2rem;
      margin-bottom: 1.25rem;
      font-size: .78rem;
      line-height: 1.55;
      color: var(--ink-soft);
    }

    .legend-block { display: flex; flex-direction: column; gap: .4rem; }

    .legend-title {
      font-weight: 700;
      color: var(--ink);
      font-size: .82rem;
      margin-bottom: .25rem;
    }

    .legend-list {
      margin: .25rem 0 .5rem 1rem;
      list-style: disc;
    }

    .legend-list li { margin: .15rem 0; }

    .legend-pill {
      padding: .15rem .55rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: .65rem;
      margin-right: .3rem;
    }

    .legend-state-ok { background: rgba(0,200,100,.12); color: #4ee58a; }
    .legend-state-warn { background: rgba(240,180,0,.12); color: #ffd27d; }
    .legend-state-err { background: rgba(240,60,60,.12); color: #ff9a9a; }

    .legend-metric { font-weight: 600; font-style: italic; }
    .legend-metric-ok { color: #4ee58a; }
    .legend-metric-warn { color: #ffd27d; }
    .legend-metric-err { color: #ff9a9a; }

    .legend-note {
      font-size: .72rem;
      color: var(--ink);
      margin-top: .4rem;
    }
  </style>
</head>

<body>
  <!-- HEADER (fisso in alto) -->
  <header class="hdr">
    <div class="container w-full flex items-center justify-between">
      <a href="https://tradelia.org"
         class="brand text-lg sm:text-xl"
         aria-label="Tradelia.org"
         target="_blank"
         rel="noopener noreferrer">
          <span class="brand-word">TRADELIA</span>
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-suffix">AI</span>
        </a>
        <nav class="flex items-center gap-3">
          <button id="btn-theme" class="btn-inline" type="button" aria-label="Tema (scuro)">
            <svg class="ico ico-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
            <svg class="ico ico-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <span class="hidden sm:inline text-[12px] leading-none">Tema</span>
          </button>
        </nav>
      </div>
  </header>

  <!-- MAIN (mount point per i moduli Swing) -->
  <main id="app-root" class="container"></main>

  <!-- Runtime -->
  <script type="module" src="/report/assets/js/app.js"></script>
  <script type="module" src="/report/assets/js/ui-runtime.js"></script>

  <script>
    (function(){
      /* ===== Theme toggle ===== */
      const HTML = document.documentElement;
      const THEMEKEY = 'tradelia-theme';
      const btnTheme = document.getElementById('btn-theme');
      function setTheme(t){
        HTML.setAttribute('data-theme', t);
        try{ localStorage.setItem(THEMEKEY, t); }catch(e){}
        btnTheme?.setAttribute('aria-label', t === 'dark' ? 'Tema (scuro)' : 'Tema (chiaro)');
        btnTheme?.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
      }
      setTheme(localStorage.getItem(THEMEKEY) || 'dark');
      btnTheme?.addEventListener('click', ()=> setTheme(HTML.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

      /* ===== Legend interpretativa (educational) ===== */
      function injectHeaderLegend() {
        const root = document.getElementById('app-root');
        if (!root) return;

        const legend = document.createElement('div');
        legend.className = 'header-ticker-legend';
        legend.innerHTML = `
          <div class="legend-block">
            <span class="legend-title">Legenda interpretativa</span>
            <p>
              Il riquadro descrive lo stato corrente del modello di analisi (<b>ACTIVE</b>, <b>HOLD</b>, <b>REVIEW</b>)
              e i principali indicatori sintetici, espressi in modo standardizzato.
              I colori e i codici hanno finalità puramente descrittiva e comparativa.
            </p>

            <ul class="legend-list">
              <li><span class="legend-pill legend-state-ok">ACTIVE</span> → modello coerente con i dati di base, senza anomalie rilevate.</li>
              <li><span class="legend-pill legend-state-warn">HOLD</span> → modello in fase di verifica o con elementi contrastanti nei blocchi analitici.</li>
              <li><span class="legend-pill legend-state-err">REVIEW</span> → modello in revisione metodologica o con dati in riaggiornamento.</li>
            </ul>

            <p>Le tonalità cromatiche delle metriche indicano il contributo relativo della variabile:</p>
            <ul class="legend-list">
              <li><span class="legend-metric legend-metric-ok">Verde</span> → contributo positivo o superiore alla media storica del campione.</li>
              <li><span class="legend-metric legend-metric-warn">Giallo</span> → contributo neutro o in fase di assestamento.</li>
              <li><span class="legend-metric legend-metric-err">Rosso</span> → contributo debole o inferiore alla media di riferimento.</li>
            </ul>

            <p class="legend-note">
              Le metriche colorate (<em>numeri o sigle evidenziate</em>) sono interattive:
              clicca o tocca per visualizzare la scheda metrica o la relativa traccia di audit.
              Tutti i contenuti hanno esclusiva finalità formativa e comparativa.
            </p>
          </div>
        `;
        root.prepend(legend);
      }

      injectHeaderLegend();
    })();
  </script>
</body>
</html>
