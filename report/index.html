<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tradelia · Report Runtime</title>
  <link rel="icon" href="./favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <style>
    /* Shell layout minimale */
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .container { max-width: 72rem; margin-inline: auto; padding: 0 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .45rem .65rem; border-radius: .7rem;
      font-weight: 600; font-size: 14px;
      border: 1px solid var(--br);
      background: var(--btn-bg);
      box-shadow: var(--btn-shadow);
      transition: background .2s;
    }
    .btn:hover { background: rgba(255,255,255,0.3); }
    .btn i { width: 18px; height: 18px }
    .hdr { backdrop-filter: saturate(1.2) blur(6px) }
    .noprint {}
    @media print { .noprint { display: none !important } }
  </style>
</head>
<body>
  <!-- HEADER BAR -->
  <header class="hdr sticky top-0 z-50 bg-[color:var(--card)]/90 border-b border-[color:var(--br)] noprint">
    <div class="container h-12 sm:h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <a href="/" class="shrink-0 text-lg sm:text-xl font-extrabold tracking-tight text-sky-900 hover:opacity-90 transition">
          <span class="text-[color:var(--ink)]">TRADELIA</span><span class="text-blue-600">&bull;AI</span>
        </a>
        <span class="text-[color:var(--muted)] text-xs sm:text-sm truncate">Report Runtime</span>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-print" class="btn" aria-label="Stampa / PDF">
          <i data-lucide="printer"></i><span class="hidden sm:inline">Stampa / PDF</span>
        </button>
        <button id="btn-share" class="btn" aria-label="Condividi">
          <i data-lucide="share-2"></i><span class="hidden sm:inline">Condividi</span>
        </button>
        <button id="btn-theme" class="btn" aria-label="Tema">
          <i data-lucide="sun"></i><span class="hidden sm:inline">Tema</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container py-3">
    <!-- SLOT HEADER-TICKER -->
    <section id="header-ticker" aria-label="Header Ticker (pills)"></section>
  </main>

  <!-- SHARE POPUP SCRIPT (inline per funzionare anche senza import) -->
  <script>
  async function openShare({ title='Tradelia · Report', text='Guarda il report completo', url=location.href } = {}){
    if (navigator.share) {
      try { await navigator.share({ title, text, url }); return; } catch {}
    }
    openSharePopup({ title, text, url });
  }

  function openSharePopup({ title, text, url }){
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-[1000]';
    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl shadow-2xl p-5 w-[92%] max-w-lg text-left border border-slate-200';
    card.innerHTML = `
      <div class="flex items-start justify-between gap-3 mb-3">
        <div>
          <h2 class="font-semibold text-slate-800 leading-tight">${title}</h2>
          <p class="text-xs text-slate-500 mt-0.5">Condividi il link del report</p>
        </div>
        <button class="btn" data-act="close"><i data-lucide="x"></i><span class="hidden sm:inline">Chiudi</span></button>
      </div>

      <div class="space-y-3">
        <div class="mx-auto w-[180px]">
          <img src="https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(url)}&size=180x180"
               alt="QR" class="rounded-lg border border-slate-200 shadow-sm bg-white p-2 w-full h-auto"/>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 justify-items-center sm:justify-items-start">
          ${[
            {label:'WhatsApp',href:`https://wa.me/?text=${encodeURIComponent(url)}`,icon:'message-square'},
            {label:'Telegram',href:`https://t.me/share/url?url=${encodeURIComponent(url)}`,icon:'send'},
            {label:'X',href:`https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}`,icon:'twitter'},
            {label:'LinkedIn',href:`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`,icon:'linkedin'},
            {label:'Reddit',href:`https://www.reddit.com/submit?url=${encodeURIComponent(url)}`,icon:'square'},
            {label:'Facebook',href:`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,icon:'facebook'}
          ].map(t=>`
            <a class="sbtn text-[13px] font-semibold flex gap-1 items-center px-2 py-1.5 border border-slate-200 rounded-md hover:bg-slate-100"
               href="${t.href}" target="_blank" rel="noopener">
              <i data-lucide="${t.icon}" class="w-4 h-4"></i>${t.label}
            </a>`).join('')}
        </div>

        <div class="bg-slate-50 border border-slate-200 text-[12px] p-2 rounded-md font-mono select-all break-all" data-el="linkbox">${url}</div>

        <div class="flex gap-2">
          <button class="sbtn btn" data-act="copy"><i data-lucide="copy"></i><span>Copia</span></button>
          <button class="sbtn btn" data-act="short"><i data-lucide="link-2"></i><span>Short</span></button>
        </div>
      </div>
    `;
    wrap.appendChild(card);
    document.body.appendChild(wrap);
    if (window.lucide) lucide.createIcons();

    wrap.addEventListener('click', e => { if (e.target === wrap) wrap.remove(); });
    card.querySelector('[data-act="close"]').onclick = () => wrap.remove();

    card.querySelector('[data-act="copy"]').onclick = async () => {
      await navigator.clipboard.writeText(url);
      card.querySelector('[data-act="copy"]').innerHTML = '<i data-lucide="check"></i><span>Copiato</span>';
      if (window.lucide) lucide.createIcons();
    };

    card.querySelector('[data-act="short"]').onclick = async () => {
      const short = await shortTry(url);
      if (short) {
        const box = card.querySelector('[data-el="linkbox"]');
        box.textContent = short;
      }
    };
  }

  async function shortTry(longUrl){
    try {
      const r = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`);
      const j = await r.json();
      return j.shorturl || null;
    } catch { return null; }
  }
  </script>

  <!-- APP SCRIPT -->
  <script type="module" src="./assets/js/app.js"></script>
  <script>
    document.getElementById('btn-print')?.addEventListener('click',()=>window.print());
    const html=document.documentElement; const btn=document.getElementById('btn-theme');
    const icon=()=> html.dataset.theme==='dark' ? 'moon' : 'sun';
    btn?.addEventListener('click',()=>{html.dataset.theme=(html.dataset.theme==='dark'?'light':'dark');
      btn.innerHTML=`<i data-lucide="${icon()}"></i><span class='hidden sm:inline'>Tema</span>`;
      if(window.lucide) lucide.createIcons();});
    document.getElementById('btn-share')?.addEventListener('click',()=>openShare());
    if(window.lucide) lucide.createIcons();
  </script>
</body>
</html>
