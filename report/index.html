<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tradelia AI · Report Runtime</title>

  <!-- CSS design system -->
  <link rel="stylesheet" href="/report/assets/css/tokens.css" />

  <!-- Lucide (icone) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="tl-body tl-theme-dark">
  <header class="tl-header">
    <div class="tl-header__left">
      <h1 class="tl-brand">TRADELIA · AI</h1>
      <p class="tl-sub">Report runtime</p>
    </div>
    <div class="tl-header__right">
      <button id="btn-print" class="btn btn-sm">Stampa</button>
      <button id="btn-theme" class="btn btn-icon" aria-label="Cambia tema">
        <i data-lucide="moon"></i>
      </button>
    </div>
  </header>

  <main class="tl-main">
    <!-- HERO / HEADER TICKER -->
    <section id="hero" class="tl-hero">
      <div id="header-ticker-mount" class="header-ticker-shell">
        <!-- montato da header-ticker.js -->
      </div>
    </section>

    <!-- Moduli dinamici F1..F6 -->
    <section id="modules" class="tl-modules-grid">
      <article id="sec-f1b" class="tl-card">F1B placeholder</article>
      <article id="sec-f2" class="tl-card">F2 placeholder</article>
      <article id="sec-f3" class="tl-card">F3 placeholder</article>
      <article id="sec-f4" class="tl-card">F4 placeholder</article>
      <article id="sec-f5" class="tl-card">F5 placeholder</article>
      <article id="sec-f6" class="tl-card">F6 placeholder</article>
    </section>
  </main>

  <!-- PANEL OVERLAY (analitico / metriche) -->
  <aside id="panel-overlay" class="tl-panel-overlay" aria-hidden="true">
    <div class="tl-panel tl-panel--mobile" id="panel-mobile">
      <header class="tl-panel__header">
        <h2 id="panel-title">Metriche header</h2>
        <button class="btn-icon" id="panel-close" aria-label="Chiudi"><i data-lucide="x"></i></button>
      </header>
      <div class="tl-panel__body" id="panel-body-mobile">
        <!-- il runtime inietta qui il drawer mobile -->
      </div>
      <footer class="tl-panel__footer">
        <button class="btn" id="panel-close-bottom">Chiudi</button>
      </footer>
    </div>
    <div class="tl-panel tl-panel--desktop" id="panel-desktop">
      <header class="tl-panel__header">
        <h2 id="panel-title-desktop">Metriche header</h2>
        <button class="btn-icon" id="panel-close-desktop" aria-label="Chiudi"><i data-lucide="x"></i></button>
      </header>
      <div class="tl-panel__body tl-panel__body--desktop" id="panel-body-desktop">
        <!-- il runtime inietta qui il drawer desktop -->
      </div>
    </div>
  </aside>

  <!-- OVERLAY LEGALE (separato) -->
  <aside id="legal-overlay" class="tl-panel-overlay tl-panel-overlay--legal" aria-hidden="true">
    <div class="tl-panel tl-panel--mobile" id="legal-panel">
      <header class="tl-panel__header">
        <h2 id="legal-title">Informativa</h2>
        <button class="btn-icon" id="legal-close" aria-label="Chiudi"><i data-lucide="x"></i></button>
      </header>
      <div class="tl-panel__body" id="legal-body">
        <!-- testo legale -->
      </div>
      <footer class="tl-panel__footer">
        <button class="btn" id="legal-close-bottom">Chiudi</button>
      </footer>
    </div>
  </aside>

  <!-- JS runtime -->
  <script src="/report/assets/js/ui-runtime.js"></script>
  <script src="/report/assets/js/app.js"></script>
  <script src="/report/assets/js/components/header-ticker.js"></script>
</body>
</html>
