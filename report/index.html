<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Branding -->
  <title>Tradelia AI · Report {NOME AZIENDA}</title>

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico?v=1">
  <link rel="icon" type="image/png" href="/favicon.png?v=1">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#0b1220">

  <!-- Tailwind (utility layout) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Design system / tokens -->
  <link rel="stylesheet" href="/report/assets/css/tokens.css" />

  <style>
    :root { --pop-w:320px; }
    html, body { height: 100%; }

    .body--lock {
      overflow: hidden;
      touch-action: none;
    }

    .container {
      max-width: 90rem;
      margin-inline: auto;
      padding: 0 16px;
    }

    main {
      padding-top: 2.25rem;
      padding-bottom: 3rem;
    }
    @media (min-width:1280px){
      main {
        padding-top: 2.75rem;
        padding-bottom: 3.75rem;
      }
    }

    .hdr{
      backdrop-filter:saturate(1.1) blur(6px);
      background:color-mix(in oklab, var(--surface-card) 90%, transparent);
      border-bottom:1px solid var(--br-soft);
      box-shadow:0 1px 0 var(--br-soft);
    }
    .brand{font-weight:900}
    .claim{
      font-size:12px;
      color:var(--muted);
    }

    .footer-wrap{
      background:color-mix(in oklab, var(--surface-page) 94%, black);
      border-top:1px solid color-mix(in oklab, var(--surface-page) 80%, black);
    }
    .site-footer .heading{
      font-size:13px;
      font-weight:600;
      letter-spacing:-0.03em;
      color:var(--ink);
    }
    .site-footer{
      font-size:13px;
      line-height:1.45;
      color:var(--ink);
    }
    .site-footer a{
      color:var(--ink);
      text-decoration:underline;
    }

    .sr-only {
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @media screen {
      .onlyprint { display:none !important; }
    }

    @media print {
      .noprint { display:none !important; }
      .onlyprint { display:block !important; }

      body.body--lock { overflow: visible !important; }

      html,
      body {
        background:#fff !important;
        color:#000 !important;
      }

      #print-disclaimer   { page-break-before: always; }
      #print-toc          { page-break-before: always; }
      #print-appendix     { page-break-before: always; }
      #print-footer       { page-break-before: always; }

      .sr-only.print\:block {
        position:static !important;
        width:auto !important;
        height:auto !important;
        margin:0 !important;
        overflow:visible !important;
        clip:auto !important;
        white-space:normal !important;
        border:0 !important;
        display:block !important;
      }
    }
  </style>
</head>

<body>
  <!-- HEADER (solo web) -->
  <header class="hdr sticky top-0 z-50 noprint">
    <div class="container h-12 sm:h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <a href="/" class="brand shrink-0 text-lg sm:text-xl tracking-tight hover:opacity-90 transition">
          <span class="text-[color:var(--ink)]">TRADELIA</span><span class="text-[color:var(--brand)]">&bull;AI</span>
        </a>

        <!-- claim cliente / titolo report -->
        <span class="claim truncate">
          Report {NOME AZIENDA}
        </span>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- PRINT BTN -->
        <button id="btn-print" class="btn" aria-label="Stampa / PDF">
          <span class="icon-16" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>
            </svg>
          </span>
          <span class="hidden sm:inline">Stampa / PDF</span>
        </button>

        <!-- THEME BTN -->
        <button id="btn-theme" class="btn" aria-label="Tema">
          <span class="theme-icon" aria-hidden="true">
            <svg data-theme-icon="sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
          </span>
          <span class="hidden sm:inline">Tema</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">
    <!-- HERO -->
    <section id="hero" class="hero" aria-label="Copertina Report">
      <h1 class="sr-only print:block text-[16px] font-bold leading-tight mb-2 text-[color:var(--ink)]">
        Tradelia AI · Report {NOME AZIENDA}
      </h1>

      <div class="hero__top">
        <div class="hero__id">
          <div class="hero__ticker" id="hero-ticker">—</div>
          <div class="hero__venue" id="hero-venue">—</div>

          <div class="hero__client text-[11px] leading-[1.3] text-[color:var(--muted)] mt-1">
            <span id="hero-client">Client: {NOME AZIENDA}</span> ·
            <span class="uppercase tracking-wide">Institutional Model Report</span>
          </div>
        </div>

        <div class="hero__price">
          <div class="hero__px" id="hero-price">—</div>
          <div class="hero__chg" id="hero-change">—</div>
          <span class="hero__badge" id="hero-state">—</span>
        </div>
      </div>

      <div class="hero__meta">
        <div class="meta-pill" id="pill-snap">
          <span class="tonebar" id="tone-snap"></span>
          <div class="min-w-0">
            <div class="flex items-center">
              <div class="meta-label">Snapshot</div>
              <button class="info-btn info-btn--mini" data-metric="Snapshot" aria-label="Info Snapshot">?</button>
            </div>
            <div class="meta-val">
              <span id="hero-start">—</span>
              <span>→</span>
              <span id="hero-end">—</span>
            </div>
          </div>
        </div>

        <div class="meta-pill" id="pill-price">
          <span class="tonebar" id="tone-price"></span>
          <div class="min-w-0">
            <div class="flex items-center">
              <div class="meta-label">Price</div>
              <button class="info-btn info-btn--mini" data-metric="Price" aria-label="Info Price">?</button>
            </div>
            <div class="meta-val" id="hero-price2">—</div>
          </div>
        </div>

        <div class="meta-pill" id="pill-chg">
          <span class="tonebar" id="tone-chg"></span>
          <div class="min-w-0">
            <div class="flex items-center">
              <div class="meta-label">Δ%</div>
              <button class="info-btn info-btn--mini" data-metric="ChangePct" aria-label="Info Δ%">?</button>
            </div>
            <div class="meta-val" id="hero-change2">—</div>
          </div>
        </div>

        <div class="meta-pill" id="pill-ccy">
          <span class="tonebar" id="tone-ccy"></span>
          <div class="min-w-0">
            <div class="flex items-center">
              <div class="meta-label">Currency</div>
              <button class="info-btn info-btn--mini" data-metric="Currency" aria-label="Info Currency">?</button>
            </div>
            <div class="meta-val" id="hero-ccy">—</div>
          </div>
        </div>

        <div class="meta-pill" id="pill-fresh">
          <span class="tonebar" id="tone-fresh"></span>
          <div class="min-w-0">
            <div class="flex items-center">
              <div class="meta-label">Freshness</div>
              <button class="info-btn info-btn--mini" data-metric="Freshness" aria-label="Info Freshness">?</button>
            </div>
            <div class="meta-val" id="hero-freshness">—</div>
          </div>
        </div>

        <div class="meta-pill" id="pill-conf">
          <span class="tonebar" id="tone-conf"></span>
          <div class="min-w-0">
            <div class="flex items-center">
              <div class="meta-label">Confidence</div>
              <button class="info-btn info-btn--mini" data-metric="ConfidenceFinal" aria-label="Info Confidence">?</button>
            </div>
            <div class="meta-val" id="hero-confidence">—</div>
          </div>
        </div>
      </div>
    </section>

    <!-- DISCLAIMER SOLO PDF -->
    <section id="print-disclaimer" class="onlyprint" aria-label="Avvertenze regolamentari">
      <!-- ... (uguale a prima) ... -->
    </section>

    <!-- INDICE SOLO PDF -->
    <section id="print-toc" class="onlyprint" aria-label="Indice del Report">
      <!-- ... (uguale a prima) ... -->
    </section>

    <!-- DESCRIZIONE FRAMEWORK (web) -->
    <section class="section-head" aria-label="Struttura del Report">
      <!-- ... (uguale a prima) ... -->
    </section>

    <!-- SEZIONI DINAMICHE -->
    <section class="report-sections" aria-label="Moduli del Report">
      <article id="sec-f1"  class="report-section-block is-loading" aria-label="F1 · Contesto iniziale / Regime di mercato"></article>
      <article id="sec-f2"  class="report-section-block is-loading" aria-label="F2 · Sentiment e flussi"></article>
      <article id="sec-f3"  class="report-section-block is-loading" aria-label="F3 · Analisi tecnica multi-timeframe"></article>
      <article id="sec-f4"  class="report-section-block is-loading" aria-label="F4 · Relazioni intermarket"></article>
      <article id="sec-f5"  class="report-section-block is-loading" aria-label="F5 · Resoconto tecnico"></article>
      <article id="sec-f5b" class="report-section-block is-loading" aria-label="F5B · Validazione LT (orizzonte medio-lungo)"></article>
      <article id="sec-f6"  class="report-section-block is-loading" aria-label="F6 · Broker selezionati"></article>
    </section>

    <!-- APPENDICE SOLO PDF -->
    <section id="print-appendix" class="onlyprint" aria-label="Appendice · Audit & Fonti">
      <!-- ... (uguale a prima) ... -->
    </section>
  </main>

  <!-- FOOTER WEB -->
  <div class="footer-wrap noprint">
    <footer class="site-footer container py-4">
      <!-- ... (uguale a prima) ... -->
    </footer>
  </div>

  <!-- FOOTER SOLO PDF -->
  <footer id="print-footer" class="onlyprint" aria-label="Chiosa legale finale">
    <!-- ... (uguale a prima) ... -->
  </footer>

  <!-- PANEL OVERLAY -->
  <div
    id="panel-overlay"
    class="tl-panel-overlay noprint"
    aria-hidden="true"
    data-blocking="false"
  >
    <!-- ... (uguale a prima) ... -->
  </div>

  <!-- TOOLTIP METRICHE DESKTOP -->
  <div id="metric-popover" class="tl-popover noprint" role="tooltip" aria-hidden="true">
    <!-- ... (uguale a prima) ... -->
  </div>

  <!-- TOOLTIP METRICHE MOBILE -->
  <div id="metric-modal" class="tl-metric-modal-overlay noprint" aria-hidden="true">
    <!-- ... (uguale a prima) ... -->
  </div>

  <!-- ⛔ NIENTE share-overlay QUI -->

  <!-- JS runtime -->
  <script type="module" src="/report/assets/js/app.js"></script>
  <script type="module" src="/report/assets/js/ui-runtime.js"></script>
</body>
</html>
