<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Tradelia · Institutional Report</title>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico">

  <!-- Design tokens + base UI (dark-only, istituzionale) -->
  <link rel="stylesheet" href="/report/assets/css/tokens.css?v=3.1">
</head>
<body>

  <!-- HEADER (semplice, dark) -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Tradelia AI">
        <span class="logo" aria-hidden="true"></span>
        <span class="wordmark">TRADELIA<span class="dot">•</span>AI</span>
      </a>
      <div class="spacer" aria-hidden="true"></div>
    </div>
  </header>

  <!-- HERO / HEADER TICKER -->
  <section id="hero" class="hero" role="region" aria-label="Header ticker">
    <h1 id="hero-title" class="hero-title">Report</h1>
    <div id="hero-sub" class="hero-sub"></div>

    <!-- Confidence meter con ticks -->
    <div class="hero-meter">
      <div class="meter-head">
        <div class="label">
          Confidence
          <button class="info-btn" data-info="ConfidenceFinal" aria-label="Cos'è la Confidence?">?</button>
        </div>
        <div id="hero-conf-val" class="tabular">—</div>
      </div>
      <div class="meter-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="hero-meter-fill" class="meter-fill"></div>
      </div>
      <div class="meter-legend">
        <span>0</span>
        <span>65 (Review)</span>
        <span>85 (Pass)</span>
        <span>100</span>
      </div>
    </div>

    <!-- Prezzo + hint + Δ% / Stato -->
    <div class="hero-main">
      <div class="price-block">
        <div class="price-row">
          <div id="hero-price" class="price tabular">—</div>
          <div id="hero-ccy" class="ccy"></div>
          <button class="info-btn" data-info="Price_info" aria-label="Che prezzo mostriamo?">?</button>
        </div>
        <div id="hero-hint" class="hint"></div>
      </div>

      <div class="right-block" aria-label="Variazione e stato">
        <span id="hero-delta" class="delta tabular" aria-live="polite"></span>
        <button class="info-btn" data-info="ChangePct_info" aria-label="Come si calcola la variazione percentuale?">?</button>
        <span id="hero-state" class="state"></span>
        <button class="info-btn" data-info="State_info" aria-label="Cosa significa lo stato?">?</button>
      </div>
    </div>

    <!-- KPI TABLE (label / valore allineato a destra) -->
    <div id="hero-kpi" class="kpi"></div>

    <!-- Nota MiFID -->
    <div id="hero-note" class="hero-note">
      Materiale informativo/educativo. Nessuna raccomandazione personale (MiFID II).
    </div>
  </section>

  <!-- Separatore -->
  <div class="section-divider" role="separator" aria-label="Schede moduli"></div>

  <!-- GRID MODULI (F1..F7) -->
  <main id="modules" class="modules-grid" role="main">
    <article id="sec-f1b" class="report-section" data-card="F1B"></article>
    <article id="sec-f2"  class="report-section" data-card="F2"></article>
    <article id="sec-f3o" class="report-section" data-card="F3O"></article>
    <article id="sec-f3"  class="report-section" data-card="F3"></article>
    <article id="sec-f4"  class="report-section" data-card="F4"></article>
    <article id="sec-f5"  class="report-section" data-card="F5"></article>
    <article id="sec-f5b" class="report-section" data-card="F5B"></article>
    <article id="sec-f6"  class="report-section" data-card="F6"></article>
    <article id="sec-f7"  class="report-section" data-card="F7"></article>
  </main>

  <!-- OVERLAY ANALITICO (singleton) -->
  <div id="panel-overlay" class="overlay" hidden>
    <div class="overlay-backdrop" data-overlay-close></div>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <header class="panel-head">
        <h2 id="panel-title" class="panel-title">Dettaglio</h2>
        <button class="btn btn-ghost" data-overlay-close aria-label="Chiudi pannello">✕</button>
      </header>
      <nav id="panel-tabs" class="panel-tabs" role="tablist" aria-label="Sezioni analitiche"></nav>
      <div id="panel-body" class="panel-body" data-scrollable tabindex="0" role="region" aria-live="polite"></div>
      <footer id="panel-foot" class="panel-foot"></footer>
    </section>
  </div>

  <!-- OVERLAY LEGALE -->
  <div id="legal-overlay" class="overlay" hidden>
    <div class="overlay-backdrop" data-legal-close></div>
    <section class="panel panel-legal" role="dialog" aria-modal="true" aria-labelledby="legal-title">
      <header class="panel-head">
        <h2 id="legal-title" class="panel-title">Informativa</h2>
        <button class="btn btn-ghost" data-legal-close aria-label="Chiudi informativa">✕</button>
      </header>
      <div id="legal-body" class="panel-body" data-scrollable></div>
      <footer class="panel-foot">
        <button class="btn" data-legal-close>OK</button>
      </footer>
    </section>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <div>© <span id="footer-year"></span> Tradelia AI — Educational / Informational only</div>
      <div class="footer-actions">
        <button class="btn btn-ghost" id="btn-privacy">Privacy</button>
        <button class="btn btn-ghost" id="btn-mifid">MiFID</button>
      </div>
    </div>
  </footer>

  <!-- Runtime UI (tooltip unificati, overlay) + App orchestrator -->
  <script type="module" src="/report/assets/js/ui-runtime.js?v=3.1"></script>
  <script type="module" src="/report/assets/js/app.js?v=3.1"></script>
</body>
</html>
