<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <title>TRADELIA • AI — Report Azionario (v4 • Istituzionale 2025)</title>
  <meta name="description" content="Report istituzionale Tradelia AI: analisi multi-blocco avanzata con strategie operative, fondamentali, tecnica e governance." />
  <meta name="author" content="Tradelia AI" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Open Graph / Twitter (per anteprime professionali) -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="TRADELIA • AI — Report Azionario Istituzionale 2025">
  <meta property="og:description" content="Analisi avanzata multi-blocco, con strategie operative e framework istituzionale.">
  <meta property="og:site_name" content="TRADELIA • AI">
  <meta property="og:locale" content="it_IT">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Theme color dinamico -->
  <meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- AOS Animations -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { color-scheme: light dark; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    /* Scrollbar raffinata */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 8px; border: 2px solid #e2e8f0; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Accessibilità focus */
    :focus-visible { outline: 2px solid rgb(14 165 233); outline-offset: 3px; border-radius: 4px; }

    /* Header shrink effect */
    header.shrink { padding-top: 0.4rem; padding-bottom: 0.4rem; }
    header.shrink .logo-text { font-size: 1.1rem; }
    
    /* Progress bar di lettura */
    #scroll-progress {
      position: fixed; top: 0; left: 0;
      height: 3px; background: linear-gradient(to right, #0ea5e9, #3b82f6);
      width: 0%; z-index: 60;
    }
  </style>
</head>

<body class="antialiased">
  <!-- Progress bar scroll -->
  <div id="scroll-progress"></div>

  <!-- Header -->
  <header role="banner" aria-label="Intestazione report"
    class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-slate-200 shadow-sm px-4 sm:px-6 py-3 flex items-center justify-between transition-all duration-300">
    
    <!-- Logo -->
    <a href="https://tradelia.org" target="_blank" rel="noopener noreferrer" 
       class="flex items-center font-extrabold tracking-tight hover:opacity-90 transition">
      <span class="logo-text hidden sm:inline text-xl sm:text-2xl text-slate-900">TRADELIA</span>
      <span class="logo-text sm:text-2xl text-sky-600 sm:ml-1">•AI</span>
      <span class="logo-text sm:hidden text-lg text-slate-900">T•AI</span>
    </a>

    <!-- Azioni -->
    <nav aria-label="Azioni pagina" class="flex gap-2">
      <!-- Stampa -->
      <button onclick="window.print()" 
              class="no-print inline-flex items-center gap-2 rounded-md border border-slate-200 px-3 py-1.5 text-sm hover:bg-slate-50 focus-visible:outline focus-visible:outline-sky-500 hidden sm:flex">
        <i data-lucide="printer" class="w-4 h-4"></i> Stampa
      </button>
      <!-- Solo icona su mobile -->
      <button onclick="window.print()" 
              class="sm:hidden p-2 rounded-md border border-slate-200 hover:bg-slate-50">
        <i data-lucide="printer" class="w-4 h-4"></i>
      </button>

      <!-- Indice -->
      <button id="open-toc-drawer" type="button" 
              class="no-print inline-flex items-center gap-2 rounded-md border border-slate-200 px-3 py-1.5 text-sm hover:bg-slate-50 focus-visible:outline focus-visible:outline-sky-500 hidden sm:flex">
        <i data-lucide="list-tree" class="w-4 h-4"></i> Indice
      </button>
      <button id="open-toc-drawer" type="button" 
              class="sm:hidden p-2 rounded-md border border-slate-200 hover:bg-slate-50">
        <i data-lucide="list-tree" class="w-4 h-4"></i>
      </button>
    </nav>
  </header>

  <script>
    // Inizializza icone Lucide
    if (window.lucide && lucide.createIcons) lucide.createIcons();

    // Header shrink on scroll
    const header = document.querySelector("header");
    window.addEventListener("scroll", () => {
      if (window.scrollY > 40) {
        header.classList.add("shrink");
      } else {
        header.classList.remove("shrink");
      }
    });

    // Progress bar scroll
    const progress = document.getElementById("scroll-progress");
    window.addEventListener("scroll", () => {
      const h = document.documentElement;
      const scrolled = (h.scrollTop || document.body.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
      progress.style.width = scrolled + "%";
    });
  </script>
