<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Azionario – Tradelia AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-4xl mx-auto p-6">
    <!-- Sezione chart -->
    <div id="chart" class="h-64 bg-white border rounded-lg mb-6"></div>

    <!-- Sezione tabelle fondamentali -->
    <div class="bg-white border rounded-lg p-4 mb-6">
      <h2 class="text-lg font-semibold mb-4">Simulazione – Investimento Lungo Termine</h2>
      <table class="w-full table-fixed border-collapse">
        <thead>
          <tr class="bg-gray-100">
            <th class="p-2 border">Parametro</th>
            <th class="p-2 border">Valore</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="p-2 border">Prezzo Attuale</td><td class="p-2 border">€XXX.XX</td></tr>
          <!-- altri parametri -->
        </tbody>
      </table>
    </div>

    <!-- Sezione Swing Trading -->
    <div class="bg-white border rounded-lg p-4">
      <h2 class="text-lg font-semibold mb-4">Swing Trading – Segnale Multi-Day</h2>
      <table class="w-full table-fixed border-collapse mb-4">
        <thead>
          <tr class="bg-gray-100">
            <th class="p-2 border">Livello</th>
            <th class="p-2 border">Valore</th>
            <th class="p-2 border">Giustificazione</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="p-2 border">Entry</td><td class="p-2 border">–</td><td class="p-2 border">Breakout / Pullback</td></tr>
          <tr><td class="p-2 border">Stop Loss</td><td class="p-2 border">–</td><td class="p-2 border">2×ATR / Supporto chiave</td></tr>
          <!-- altri livelli -->
        </tbody>
      </table>
      <ul class="list-disc list-inside text-sm">
        <li>Size consigliata: 1–3%</li>
        <li>Durata stimata: 2–15 giorni</li>
        <!-- altri punti -->
      </ul>
    </div>
  </div>

  <script>
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: { backgroundColor: '#ffffff', textColor: '#333' },
      width: document.getElementById('chart').clientWidth,
      height: 300,
    });
    const candleSeries = chart.addCandlestickSeries();
    candleSeries.setData([
      { time: '2025-07-10', open: 22, high: 25, low: 21, close: 24 },
      { time: '2025-07-11', open: 24, high: 26, low: 23, close: 25 },
      // dati reali JSON...
    ]);
  </script>
</body>
</html>
