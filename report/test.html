<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Header Ticker · Educational (Standalone)</title>
  <style>
    /* ===== Standalone minimal design (no tokens.css) ===== */
    :root{
      /* palette base */
      --bg: #0f1115;            /* page */
      --card: #161a20;          /* card */
      --ink: #e9eef8;           /* text */
      --ink-soft:#b9c3d6;       /* secondary */
      --muted:#93a1b5;          /* muted */
      --br:#242a33;             /* border */
      --green-ink:#1d6b3f;
      --yellow-ink:#7a5a05;
      --red-ink:#7c2d2d;
      --green-bg:#dff3e8;
      --yellow-bg:#fff2cd;
      --red-bg:#ffe2e2;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f6f7fb; --card:#ffffff; --ink:#0e1116; --ink-soft:#2a3342; --muted:#687488; --br:#e6e9f0;
        --green-ink:#0e6b3a; --yellow-ink:#7a5a05; --red-ink:#7c2d2d;
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      padding:24px;
    }
    .wrap{max-width:1080px;margin:0 auto}

    /* Card compatta */
    .hdtk-card{border:1px solid var(--br);background:var(--card);border-radius:14px;padding:.75rem}
    .hdtk-top{display:grid;grid-template-columns:1fr auto;gap:.75rem;align-items:start}
    .hdtk-tkr{font-weight:800;letter-spacing:-.015em;font-size:clamp(16px,2.6vw,20px)}
    .hdtk-venue{color:var(--muted);font-size:11px;margin-left:.4rem;white-space:nowrap}
    .hdtk-co{color:var(--ink-soft);font-size:11px;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hdtk-price{text-align:right}
    .hdtk-price .val{font-weight:800;line-height:1;font-size:clamp(20px,3vw,28px)}
    .hdtk-price .ccy{font-size:11px;font-weight:600;margin-left:.35rem}
    .hdtk-delta{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .48rem;border-radius:999px;border:1px solid var(--br);font-size:11px;font-weight:700;margin-left:.45rem}
    .hdtk-delta[data-tone="green"]{color:var(--green-ink); background:color-mix(in oklab, var(--card) 90%, var(--green-bg))}
    .hdtk-delta[data-tone="yellow"]{color:var(--yellow-ink); background:color-mix(in oklab, var(--card) 90%, var(--yellow-bg))}
    .hdtk-delta[data-tone="red"]{color:var(--red-ink); background:color-mix(in oklab, var(--card) 90%, var(--red-bg))}
    .hdtk-meta{font-size:11px;color:var(--muted);text-align:right;margin-top:.2rem}

    /* Tabella compatta */
    .hdtk-table{width:100%;border-collapse:collapse;margin-top:.5rem}
    .hdtk-table th,.hdtk-table td{padding:.44rem .5rem;border-bottom:1px solid var(--br);font-size:12px}
    .hdtk-table th{text-align:left;color:var(--ink-soft);font-weight:700}
    .hdtk-table td:last-child{text-align:right}
    .btn{border:1px solid var(--br);border-radius:999px;padding:.22rem .5rem;font-size:11.5px;background:transparent;color:var(--ink);cursor:pointer}
    .btn:hover{background:color-mix(in oklab, var(--card) 80%, #fff)}
    .text-right{text-align:right}

    /* Chip tono inline (minuscola, sobria) */
    .hdtk-chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--br);border-radius:999px;padding:.06rem .38rem;font-size:11px;font-weight:700;margin-left:.38rem}
    .hdtk-dot{width:6px;height:6px;border-radius:50%}
    .hdtk-chip[data-tone="green"]{color:var(--green-ink); background:color-mix(in oklab, var(--card) 92%, var(--green-bg))}
    .hdtk-chip[data-tone="yellow"]{color:var(--yellow-ink); background:color-mix(in oklab, var(--card) 92%, var(--yellow-bg))}
    .hdtk-chip[data-tone="red"]{color:var(--red-ink); background:color-mix(in oklab, var(--card) 92%, var(--red-bg))}

    /* Micro modal standalone per (i) */
    .modal[hidden]{display:none!important}
    .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(2px)}
    .dialog{max-width:min(560px,96vw);width:100%;border:1px solid var(--br);background:var(--card);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.22);padding:1rem}
    .d-title{font-weight:700;font-size:14px;margin-bottom:.25rem}
    .d-what{font-size:13px;color:var(--ink-soft);margin-bottom:.25rem}
    .d-how{font-size:12px;line-height:1.55}
    .d-src{font-size:11px;color:var(--muted);margin-top:.5rem}
    .d-actions{display:flex;justify-content:flex-end;margin-top:.75rem}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="hdr-slot"></div>
  </div>

  <script>
    // ===== Standalone headerTicker (compatto) =====
    const headerTicker = (() => {
      const QS = (s,r=document)=>r.querySelector(s);
      const EL = (t, cls, html)=>{const e=document.createElement(t); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;};
      const normTone = t => (t||'').toString().toLowerCase();
      const fmt = {
        price:v => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}),
        pct:  v => (v==null||isNaN(v)) ? '—%' : `${v>0?'+':''}${Number(v).toFixed(2)}%`,
        timeUTC:s=>{try{const d=new Date(s);return isNaN(d)?String(s||'—'):d.toISOString().slice(11,16)+' UTC'}catch{return String(s||'—')}}
      };
      const toneForPct = v => (v==null||isNaN(v))?'neutral':(v>0?'green':(v<0?'red':'neutral'));
      function toneForFreshness(label){ if(!label) return 'neutral'; const s=String(label).toLowerCase(); if(s.includes('t-0')||s.includes('live')) return 'green'; if(s.includes('≤ t-1')||s.includes('t-1')) return 'yellow'; return 'red'; }
      function toneForScore(x){ if(x==null||isNaN(x)) return 'neutral'; if(x>=0.85) return 'green'; if(x>=0.70) return 'yellow'; return 'red'; }
      function toneForState(s){ if(!s) return 'neutral'; const u=String(s).toUpperCase(); if(u.includes('ACTIVE')) return 'green'; if(u.includes('REVIEW')) return 'yellow'; if(u.includes('HOLD')) return 'red'; return 'neutral'; }

      function skeleton(){
        return `
          <div class="hdtk-card">
            <div class="hdtk-top">
              <div>
                <div class="flex items-baseline" style="display:flex;align-items:baseline;gap:.5rem">
                  <span class="hdtk-tkr">—</span>
                  <span class="hdtk-venue">—</span>
                </div>
                <div class="hdtk-co">—</div>
              </div>
              <div class="hdtk-price">
                <div><span class="val">—</span><span class="ccy"> —</span><span class="hdtk-delta" data-tone="neutral"><span class="dval">—%</span></span></div>
                <div class="hdtk-meta"></div>
              </div>
            </div>
            <table class="hdtk-table">
              <thead><tr><th style="width:34%">Metrica</th><th>Valore</th><th style="width:48px;text-align:right"></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="modal" hidden>
            <div class="dialog" role="dialog" aria-modal="true">
              <div class="d-title">—</div>
              <div class="d-what">—</div>
              <div class="d-how">—</div>
              <div class="d-src">—</div>
              <div class="d-actions"><button class="btn" data-close>Chiudi</button></div>
            </div>
          </div>
        `;
      }
      const row = (id,label,valueHTML)=>`
        <tr data-row="${id}">
          <td>${label}</td>
          <td class="text-right">${valueHTML}</td>
          <td class="text-right"><button type="button" class="btn" data-info="${id}">(i)</button></td>
        </tr>`;
      const chip = (tone,label)=> {
        const t=normTone(tone||'');
        if(!t || t==='neutral') return '';
        return `<span class="hdtk-chip" data-tone="${t}"><span class="hdtk-dot" style="background:currentColor"></span>${label||t}</span>`;
      };

      function mount(slot){
        const host = (typeof slot==='string') ? QS(slot) : slot;
        if(!host) throw new Error('mount: invalid slot');
        const wrap = EL('div', null, skeleton());
        host.innerHTML=''; host.appendChild(wrap);
        return wrap;
      }

      function update(root, raw={}){
        // normalize freshness
        const data = { ...raw, Freshness: raw.Freshness ?? { raw: raw.FreshnessLabel, tone: raw.FreshnessTone } };

        // header
        QS('.hdtk-tkr', root).textContent   = data.Ticker || '—';
        QS('.hdtk-venue', root).textContent = data.Venue ? `· ${data.Venue}` : '';
        QS('.hdtk-co', root).textContent    = data.CompanyName || '';

        QS('.hdtk-price .val', root).textContent = fmt.price(data.Price);
        QS('.hdtk-price .ccy', root).textContent = data.Currency ? ` ${data.Currency}` : '';
        const chgTone = normTone(data.ChangePctTone) || toneForPct(Number(data.ChangePct));
        QS('.hdtk-delta', root).setAttribute('data-tone', chgTone);
        QS('.hdtk-delta .dval', root).textContent = fmt.pct(Number(data.ChangePct));

        const meta = QS('.hdtk-meta', root);
        meta.textContent = `Snapshot ${data.Start||'—'} → ${data.End||'—'} · Updated ${fmt.timeUTC(data.UpdatedAt)}`;

        // rows
        const body = QS('tbody', root); body.innerHTML = '';
        const pick = (o)=> (o&&typeof o==='object') ? { val:(o.raw??o.value??o.val), tone:normTone(o.tone) } : { val:o, tone:null };

        const rows = [];
        rows.push(['Price','Price', `${fmt.price(data.Price)}`]);
        rows.push(['ChangePct','Change %', `${fmt.pct(Number(data.ChangePct))} ${chip(chgTone)}`]);
        rows.push(['Currency','Currency', String(data.Currency||'—')]);

        const f = pick(data.Freshness);
        const fVal = (f.val || data.FreshnessLabel || '—').replace(' / ',' (') + (String(f.val||'').includes(' / ')?')':'');
        const fTone = f.tone || toneForFreshness(fVal);
        rows.push(['Freshness','Freshness', `${fVal} ${chip(fTone)}`]);

        const cf = pick(data.ConfidenceFinal);
        rows.push(['ConfidenceFinal','Confidence (final)', `${!isNaN(Number(cf.val))? Number(cf.val).toFixed(2):String(cf.val||'—')} ${chip(cf.tone || toneForScore(Number(cf.val)))}`]);

        const di = pick(data.DataIntegrity);
        rows.push(['DataIntegrity','Data integrity', `${!isNaN(Number(di.val))? Number(di.val).toFixed(2):String(di.val||'—')} ${chip(di.tone || toneForScore(Number(di.val)))}`]);

        if (data.FeedSync!=null){
          const fs = pick(data.FeedSync);
          rows.push(['FeedSync','Feed sync', `${String(fs.val||'—')} ${chip(fs.tone||'neutral')}`]);
        }

        const st = pick(data.State);
        const sNote = data.StateNote ? `<span style="color:var(--muted);font-size:11px;margin-left:.35rem">${data.StateNote}</span>` : '';
        rows.push(['State','State', `${String(st.val||'—')}${sNote} ${chip(st.tone || toneForState(st.val))}`]);

        rows.push(['Snapshot','Snapshot window', `${data.Start||'—'} → ${data.End||'—'}`]);
        rows.push(['UpdatedAt','Updated at (UTC)', `${fmt.timeUTC(data.UpdatedAt)}`]);
        rows.push(['Version','Version', String(data.Version||'—')]);

        rows.forEach(([id,label,val]) => body.insertAdjacentHTML('beforeend', row(id,label,val)));

        // info modal (standalone)
        const MOD = QS('.modal', root);
        const openInfo = (key)=>{
          // Demo contenuti WHAT/HOW/SOURCE (senza glossary esterno)
          const map = {
            Price:{title:'Price', what:'Prezzo di riferimento del titolo.', how:'Ultimo close o last trade (a seconda del feed).', source:'Exchange / Consolidated'},
            ChangePct:{title:'Change %', what:'Variazione percentuale sul periodo selezionato.', how:'(Prezzo attuale - Prezzo base) / Prezzo base', source:'Calcolo locale'},
            Currency:{title:'Currency', what:'Valuta di quotazione.', how:'Fornita dal venue di scambio.', source:'Exchange'},
            Freshness:{title:'Freshness', what:'Freschezza del dato (T-0, T-1...).', how:'Etichetta di staleness del feed (live, latest close, after-hours).', source:'Data pipeline'},
            ConfidenceFinal:{title:'Confidence (final)', what:'Confidenza complessiva del pacchetto dati.', how:'Score [0–1] su qualità/freschezza/integrità.', source:'Pipeline qualità'},
            DataIntegrity:{title:'Data integrity', what:'Integrità e coerenza interna del dataset.', how:'Score [0–1] su validazioni e controlli.', source:'Pipeline qualità'},
            FeedSync:{title:'Feed sync', what:'Allineamento dei feed secondari/derivati.', how:'Stato di sync (es. T-1 OK).', source:'Data pipeline'},
            State:{title:'State', what:'Stato del report / snapshot.', how:'ACTIVE/REVIEW/HOLD.', source:'Sistema'},
            Snapshot:{title:'Snapshot window', what:'Intervallo temporale del dataset.', how:'Start → End.', source:'Sistema'},
            UpdatedAt:{title:'Updated at (UTC)', what:'Orario ultima elaborazione.', how:'ISO 8601 → orario UTC leggibile.', source:'Sistema'},
            Version:{title:'Version', what:'Versione del report/pipeline.', how:'Stringa semantica.', source:'Sistema'}
          };
          const g = map[key] || {title:key, what:'—', how:'—', source:''};
          QS('.d-title', MOD).textContent = g.title;
          QS('.d-what',  MOD).textContent = g.what;
          QS('.d-how',   MOD).textContent = g.how;
          QS('.d-src',   MOD).textContent = g.source ? `Fonte: ${g.source}` : '';
          MOD.hidden = false;
        };
        root.querySelectorAll('[data-info]').forEach(btn=>{
          btn.addEventListener('click',()=> openInfo(btn.getAttribute('data-info')));
        });
        MOD.addEventListener('click',(e)=>{ if(e.target===MOD || e.target.hasAttribute('data-close')) MOD.hidden=true; });
        window.addEventListener('keydown',(e)=>{ if(!MOD.hidden && e.key==='Escape') MOD.hidden=true; });
      }

      return { mount, update };
    })();

    // ===== Demo JSON (quello che mi hai passato) =====
    const sampleData = {
      "Ticker": "NVDA",
      "Venue": "NASDAQ",
      "CompanyName": "NVIDIA Corporation",
      "Price": 123.45,
      "ChangePct": -2.13,
      "ChangePctTone": "red",
      "Currency": "USD",
      "Start": "2025-10-21",
      "End": "2025-10-25",
      "Freshness": { "raw": "T-0 / latest close + AH", "tone": "green" },
      "ConfidenceFinal": { "raw": 0.82, "tone": "yellow" },
      "DataIntegrity":   { "raw": 0.88, "tone": "green" },
      "FeedSync":        { "raw": "T-1 OK", "tone": "yellow" },
      "State":      { "raw": "ACTIVE", "tone": "green" },
      "StateNote":  "LIVE SNAPSHOT",
      "Version":   "v2025.10.25-rc3",
      "UpdatedAt": "2025-10-25T22:14:00Z"
    };

    // ===== Mount + Update =====
    const root = headerTicker.mount('#hdr-slot');
    headerTicker.update(root, sampleData);
  </script>
</body>
</html>
